<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Vedátorský podcast – podle témat</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#162033;--muted:#64748b;--line:#dbe2ea;--accent:#5b4bdb;--accent2:#ede9fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:linear-gradient(135deg,#151b2f,#32256c);color:#fff;padding:28px 18px 24px}.wrap{max-width:1050px;margin:auto}.eyebrow{opacity:.75;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.76rem}h1{font-size:clamp(1.7rem,5vw,2.7rem);margin:.25rem 0 .4rem}main{padding:18px}.panel,article,.series-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.06)}.panel{padding:16px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:1rem}button,select{font:inherit}.refresh{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 16px;font-weight:700;cursor:pointer}.tabs,.topics{display:flex;gap:8px;overflow:auto;scrollbar-width:thin}.tabs{padding:14px 0 2px}.topics{padding:10px 0 4px}.topic,.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.topic.active,.tab.active{background:var(--accent2);border-color:#8b7ee8;color:#392b9b;font-weight:700}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 2px 10px;color:var(--muted)}.sort{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}article{padding:16px;display:flex;flex-direction:column;min-height:260px}article h2{font-size:1.08rem;line-height:1.35;margin:.35rem 0 .55rem}.date{color:var(--muted);font-size:.85rem}.desc{line-height:1.48;color:#354158;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{font-size:.76rem;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px}.links{display:flex;gap:8px;margin-top:auto}.links a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:9px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);color:var(--ink)}.status{padding:28px;text-align:center;color:var(--muted)}.series-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;align-items:start}.series-card{overflow:hidden}.series-card>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:750;display:flex;justify-content:space-between;gap:10px;align-items:center}.series-card>summary::-webkit-details-marker{display:none}.series-card>summary::after{content:"▾";transition:.2s}.series-card[open]>summary::after{transform:rotate(180deg)}.series-card[open]>summary{border-bottom:1px solid var(--line);background:#fafaff}.series-count{color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}.series-body{padding:8px 16px 14px}.series-body ol{margin:.25rem 0 0;padding-left:1.35rem}.series-body li{padding:.38rem 0;line-height:1.35}.series-body a{color:#392b9b}.person-name{font-weight:750;color:var(--ink);display:block;font-size:.9rem}.episode-title{font-size:.82rem;color:var(--muted)}.hidden{display:none!important}@media(max-width:550px){.controls{grid-template-columns:1fr}.refresh{padding:12px}.meta{align-items:flex-start;flex-direction:column}.series-list{grid-template-columns:1fr}}
</style></head>
<body><header><div class="wrap"><div class="eyebrow">Neoficiální tematický katalog</div><h1>Vedátorský podcast podle témat</h1></div></header>
<main class="wrap"><section class="panel"><div class="controls"><input id="search" class="search" placeholder="Hledat česky nebo slovensky: černé/čierne díry, vesmír…"><button id="refresh" class="refresh">Znovu načíst</button></div><div class="tabs"><button class="tab active" data-view="episodes">Epizody</button><button class="tab" data-view="series">Série</button></div><div id="topics" class="topics"></div></section><div class="meta"><div id="count">Načítám epizody…</div><select id="episodeSort" class="sort"><option value="new">Nejnovější</option><option value="old">Nejstarší</option><option value="number">Podle čísla dílu</option></select><select id="seriesSort" class="sort hidden"><option value="count">Podle počtu dílů</option><option value="alpha">Podle abecedy</option><option value="first">Podle stáří prvního dílu</option></select></div><section id="episodes" class="grid"><div class="status">Načítám katalog…</div></section><section id="series" class="series-list hidden"></section></main>
<script>
const TOPICS={'Vše':[],'FAQ':['faq','dobre otazky','dobré otázky'],'Mimozemský život':['mimozem','astrobiolog','exoplanet','civiliz','biosignat'],'Kosmologie':['kozmolog','kosmolog','velky tresk','rozpin','casopriestor'],'Temná energie':['tmava energia','temna energie','dark energy'],'Temná hmota':['tmava hmota','temna hmota','dark matter'],'Černé díry':['cierna diera','cerna dira','cierne diery','cerne diry','black hole'],'Kvantová fyzika':['kvant','superpoz','previazan','provazan'],'Relativita':['relativit','dilatacia casu','rychlost svetla'],'Astronomie':['hviezd','hvezd','planet','galaxi','teleskop','slnko','slunce','mesiac','mesic','mars','jupiter'],'Biologie a medicína':['bunk','mozog','mozek','gen','evol','virus','bakter','sperm','vajic','alzheimer','dopamin'],'Matematika':['matemat','geometri','fraktal','nekonec','chaos','pravdepodob'],'Technologie a AI':['umela inteligencia','umela inteligence','internet','pocitac','robot','algoritm'],'Země a příroda':['zemetrasen','sopk','tornad','hurikan','klima','ocean','geolog'],'Chemie a materiály':['chem','molekul','atom','prvok','prvek','helium','material'],'Společnost a psychologie':['socialne siete','socialni site','psychol','spolocnost','spolecnost','moral','radikaliz','ekonom','peniaz','penez']};
const QUERY_EQUIV=[['cerna dira','cierna diera'],['cerne diry','cierne diery'],['temna energie','tmava energia'],['temna hmota','tmava hmota'],['umela inteligence','umela inteligencia'],['slunce','slnko'],['mesic','mesiac'],['hvezda','hviezda'],['mozek','mozog']];
const MALE_SCIENTISTS=['Albert Einstein','Isaac Newton','Galileo Galilei','Charles Darwin','Nikola Tesla','Stephen Hawking','Richard Feynman','Niels Bohr','Max Planck','Werner Heisenberg','Erwin Schrödinger','Paul Dirac','Michael Faraday','James Clerk Maxwell','Johannes Kepler','Edwin Hubble','Carl Sagan','Kip Thorne','Roger Penrose','Alan Turing','John von Neumann','Kurt Gödel','David Hilbert','Leonhard Euler','Carl Friedrich Gauss','Bernhard Riemann','Henri Poincaré','Blaise Pascal','Pierre de Fermat','René Descartes','Archimedes','Euclid','Gregor Mendel','Louis Pasteur','Robert Koch','Alexander Fleming','Francis Crick','James Watson','Linus Pauling','Dmitri Mendělejev','Antoine Lavoisier','Robert Boyle','Ernest Rutherford','J. J. Thomson','Enrico Fermi','Robert Oppenheimer','Murray Gell-Mann','Peter Higgs','Steven Weinberg','Sheldon Glashow','Subrahmanyan Chandrasekhar','Georges Lemaître','John Wheeler','Freeman Dyson','Noam Chomsky','Claude Shannon','John Nash','John Maynard Smith','Daniel Kahneman','Ivan Pavlov','Sigmund Freud','B. F. Skinner','Konrad Lorenz','David Attenborough','James Lovelock','Tim Berners-Lee','Geoffrey Hinton','Yann LeCun','Demis Hassabis','Kary Mullis','Svante Pääbo','Anton Zeilinger','Alain Aspect','John Clauser','Steven Chu','Michio Kaku','Brian Cox','Neil deGrasse Tyson','Peter Bewise Búran'];
const FEMALE_SCIENTISTS=['Marie Curie','Maria Skłodowska-Curie','Ada Lovelace','Rosalind Franklin','Lise Meitner','Emmy Noether','Sofia Kovalevskaya','Katherine Johnson','Dorothy Vaughan','Mary Jackson','Jocelyn Bell Burnell','Vera Rubin','Chien-Shiung Wu','Maria Goeppert-Mayer','Donna Strickland','Andrea Ghez','Jennifer Doudna','Emmanuelle Charpentier','Jane Goodall','Rachel Carson','Barbara McClintock','Rita Levi-Montalcini','Gertrude Elion','Tu Youyou','May-Britt Moser','Frances Arnold','Katalin Karikó','Eunice Newton Foote','Henrietta Leavitt','Annie Jump Cannon','Cecilia Payne-Gaposchkin','Caroline Herschel','Mary Anning','Florence Nightingale','Grace Hopper','Hedy Lamarr','Margaret Hamilton','Fei-Fei Li','Dorothy Hodgkin','Irène Joliot-Curie','Lynn Margulis','Elizabeth Blackburn','Carol Greider','Françoise Barré-Sinoussi','Christiane Nüsslein-Volhard','Dominika Fričová'];
const FIXED_SERIES=[{name:'Hľadanie mimozemského života',test:e=>norm(e.title).includes('hladanie mimozemskeho zivota')},{name:'FAQ – dobré otázky',test:e=>/\bfaq\b/i.test(e.title)},{name:'Rozhovory o vesmíre',test:e=>norm(e.title).includes('rozhovory o vesmire')},{name:'Žijem vedu',test:e=>norm(e.title).includes('zijem vedu')},{name:'Nobelovy ceny',test:e=>{const n=norm(e.title);return(n.includes('nobelove ceny')&&!n.includes('ig nobelove'))||e.number===152}},{name:'Ig Nobelovy ceny',test:e=>norm(e.title).includes('ig nobelove ceny')},{name:'Teorie her',test:e=>[29,105,120,245,254].includes(Number(e.number))}];
let episodes=[],active='Vše',view='episodes';const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();const cleanHtml=s=>{const d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim()};const short=s=>{s=cleanHtml(s).replace(/Podcast vzniká[\s\S]*/i,'').trim();return s.length>440?s.slice(0,437).replace(/\s+\S*$/,'')+'…':s};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function expandedQuery(q){const out=new Set([norm(q)]);for(const pair of QUERY_EQUIV){if(pair.some(x=>norm(q).includes(norm(x))))pair.forEach(x=>out.add(norm(x)))}return[...out].filter(Boolean)}function categories(ep){const txt=norm(ep.title+' '+cleanHtml(ep.description));return Object.entries(TOPICS).filter(([k,w])=>k!=='Vše'&&w.some(x=>txt.includes(norm(x)))).map(x=>x[0])}
async function load(){document.querySelector('#count').textContent='Načítám katalog…';try{const r=await fetch('./episodes.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();episodes=Array.isArray(data)?data:data.episodes;if(!Array.isArray(episodes)||!episodes.length)throw Error('Katalog je prázdný');localStorage.setItem('vedatorEpisodes',JSON.stringify(episodes));render()}catch(e){const saved=localStorage.getItem('vedatorEpisodes');if(saved){episodes=JSON.parse(saved);render()}else{document.querySelector('#episodes').innerHTML='<div class="status"><strong>Katalog se nepodařilo načíst.</strong><br>'+esc(e.message)+'</div>';document.querySelector('#count').textContent='Bez dat'}}}
function renderTopics(){const el=document.querySelector('#topics');el.innerHTML='';Object.keys(TOPICS).forEach(t=>{const b=document.createElement('button');b.className='topic'+(t===active?' active':'');b.textContent=t;b.onclick=()=>{active=t;render()};el.appendChild(b)})}function filtered(){const queries=expandedQuery(document.querySelector('#search').value);return episodes.map(e=>({...e,cats:categories(e)})).filter(e=>{const txt=norm(e.title+' '+cleanHtml(e.description));return(active==='Vše'||e.cats.includes(active))&&(!queries.length||queries.some(q=>txt.includes(q)))})}
function renderEpisodes(){let arr=filtered(),queries=expandedQuery(document.querySelector('#search').value);const sort=document.querySelector('#episodeSort').value;arr.sort((a,b)=>{if(queries.length){const at=queries.some(q=>norm(a.title).includes(q))?0:1,bt=queries.some(q=>norm(b.title).includes(q))?0:1;if(at!==bt)return at-bt}return sort==='old'?new Date(a.date)-new Date(b.date):sort==='number'?(b.number||0)-(a.number||0):new Date(b.date)-new Date(a.date)});document.querySelector('#count').textContent=`Nalezeno ${arr.length} z ${episodes.length} epizod`;const box=document.querySelector('#episodes');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="status">Nic jsem nenašel.</div>';return}arr.forEach(e=>{const a=document.createElement('article');const dt=e.date?new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'long',year:'numeric'}).format(new Date(e.date)):'';a.innerHTML=`<div class="date">${esc(dt)}</div><h2>${esc(e.title)}</h2><div class="desc">${esc(short(e.description)||'Popis není k dispozici.')}</div><div class="tags">${(e.cats.length?e.cats:['Ostatní']).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="links">${e.enclosure?`<a class="primary" href="${esc(e.enclosure)}" target="_blank" rel="noopener">Přehrát</a>`:''}<a class="secondary" href="${esc(e.link||e.enclosure)}" target="_blank" rel="noopener">Detail dílu</a></div>`;box.appendChild(a)})}
function findPeople(list){const out=[];for(const ep of episodes){const t=norm(ep.title);for(const name of list){if(t.includes(norm(name))){out.push({...ep,person:name});break}}}return[...new Map(out.map(e=>[(e.id||e.link||e.title)+'|'+e.person,e])).values()]}function firstDate(g){return Math.min(...g.items.map(e=>new Date(e.date).getTime()).filter(Number.isFinite))}
function seriesGroups(){const groups=[];for(const s of FIXED_SERIES){const items=episodes.filter(s.test).sort((a,b)=>new Date(a.date)-new Date(b.date));if(items.length>=2)groups.push({name:s.name,items})}const men=findPeople(MALE_SCIENTISTS);if(men.length)groups.push({name:'Vědci',items:men,people:true});const women=findPeople(FEMALE_SCIENTISTS);if(women.length)groups.push({name:'Vědkyně',items:women,people:true});const automatic={};episodes.forEach(e=>{let core=norm(e.title.replace(/^Vedátorský podcast\s*\d+\s*[–—-]?\s*/i,'').replace(/\b(?:i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii|\d+)\b\s*$/i,''));if(core==='najvacsia bitka v matematike')return;if(core.length>8)(automatic[core]??=[]).push(e)});for(const items0 of Object.values(automatic)){if(items0.length<2)continue;const ids=new Set(groups.flatMap(g=>g.items.map(e=>e.id||e.link||e.title)));const items=items0.filter(e=>!ids.has(e.id||e.link||e.title));if(items.length>=2)groups.push({name:items[0].title.replace(/^Vedátorský podcast\s*\d+\s*[–—-]?\s*/i,'').replace(/\s+(?:I|II|III|IV|V|VI|VII|VIII|IX|X|XI|XII|\d+)\s*$/i,''),items:items.sort((a,b)=>new Date(a.date)-new Date(b.date))})}const mode=document.querySelector('#seriesSort').value;groups.sort((a,b)=>mode==='alpha'?a.name.localeCompare(b.name,'cs'):mode==='first'?firstDate(a)-firstDate(b):b.items.length-a.items.length||a.name.localeCompare(b.name,'cs'));return groups}
function renderSeries(){const groups=seriesGroups();document.querySelector('#count').textContent=`Nalezeno ${groups.length} sérií`;document.querySelector('#series').innerHTML=groups.map(g=>`<details class="series-card"><summary><span>${esc(g.name)}</span><span class="series-count">${g.items.length} dílů</span></summary><div class="series-body"><ol>${g.items.map(e=>`<li><a href="${esc(e.link||e.enclosure)}" target="_blank" rel="noopener">${g.people?`<span class="person-name">${esc(e.person)}</span><span class="episode-title">${esc(e.title)}</span>`:esc(e.title)}</a></li>`).join('')}</ol></div></details>`).join('')}
function render(){renderTopics();const ep=document.querySelector('#episodes'),se=document.querySelector('#series');ep.classList.toggle('hidden',view!=='episodes');se.classList.toggle('hidden',view!=='series');document.querySelector('#episodeSort').classList.toggle('hidden',view!=='episodes');document.querySelector('#seriesSort').classList.toggle('hidden',view!=='series');view==='episodes'?renderEpisodes():renderSeries()}document.querySelector('#search').addEventListener('input',render);document.querySelector('#episodeSort').addEventListener('change',render);document.querySelector('#seriesSort').addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',load);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();
</script></body></html>
