<!DOCTYPE html>
<html lang="cs">
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light dark;--bg:#111522;--panel:#1b2030;--text:#f1f1ff;--muted:#b8bdd5;--accent:#8e80fa;--line:#42475f;--ok:#69daa0;--error:#ff9caa}
    *{box-sizing:border-box}
    body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    .group{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
    .field-title{font-size:13px;font-weight:700;line-height:1.3}
    .muted{color:var(--muted)}.small{font-size:12px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .row.between{justify-content:space-between}
    button{border:1px solid #665ac0;background:#292c45;color:var(--text);padding:10px 9px;border-radius:9px;cursor:pointer;font:600 13px/1.3 system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:40px}
    button.primary{background:#6556da;border-color:#8e80fa;color:#fff}
    button.danger{background:transparent;border-color:#b36b80;color:#ffb8c6}
    button:disabled{opacity:.45;cursor:wait}
    .hidden{display:none!important}.ok{color:var(--ok)}.error{color:var(--error)}
    .source-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:10px}
    .source-switch button{min-width:0;padding:9px 2px;font-size:12px}
    .source-switch button.active{background:var(--accent);border-color:var(--accent);color:#fff}
    #model-status{margin:0;font-size:11px}
    .model-actions{margin-top:10px}
    .model-actions button{width:100%}
    .actions{display:grid;grid-template-columns:1fr;gap:8px}
    #batch-stop{width:100%}
    .progress{display:block;width:100%;height:9px;margin-top:10px;border-radius:999px;accent-color:var(--accent)}
    .feedback{font-size:12px;line-height:1.45;margin:10px 0 0;overflow-wrap:anywhere}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .section-head .field-title{margin:0}
    #result-count{font-size:11px;color:var(--muted)}
    .item{padding:9px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .item a{font-weight:650;color:#c4baff;text-decoration:none;overflow-wrap:anywhere}
    .item a:hover{text-decoration:underline}
    .item .small{margin-top:3px}
  </style>
</head>
<body>
  <section class="group">
    <div class="field-title">Hledat v</div>
    <div class="source-switch" role="group" aria-label="V jakých kapitolách hledat">
      <button type="button" data-source-mode="question" class="active" aria-pressed="true">Otázky</button>
      <button type="button" data-source-mode="nonquestion" aria-pressed="false">Neotázky</button>
      <button type="button" data-source-mode="all" aria-pressed="false">Oboje</button>
    </div>
  </section>
  <section class="group">
    <div class="row between"><div class="field-title">Model AI</div><span id="model-status" class="muted">Kontroluji…</span></div>
    <div class="model-actions">
      <button id="install" class="primary">Stáhnout model</button>
      <button id="erase" class="danger hidden" disabled>Smazat model</button>
    </div>
    <progress id="progress" class="progress hidden" max="100" value="0"></progress>
    <p id="download-status" class="feedback hidden" role="status" aria-live="polite"></p>
  </section>
  <section class="group">
    <div class="actions">
      <button id="rerank" class="primary" disabled>Zpracovat jeden řádek</button>
      <button id="batch-run" disabled>Zpracovat celý list</button>
      <button id="batch-stop" class="danger hidden" disabled>Zastavit</button>
    </div>
    <progress id="search-progress" class="progress hidden" max="100" value="0"></progress>
    <progress id="batch-progress" class="progress hidden" max="100" value="0"></progress>
    <p id="status" class="feedback hidden" role="status" aria-live="polite"></p>
    <p id="batch-status" class="feedback hidden" role="status" aria-live="polite"></p>
  </section>
  <section id="results-section" class="group hidden">
    <div class="section-head"><h2 class="field-title">Výsledky</h2><span id="result-count">0</span></div>
    <div id="results"></div>
  </section>

  <script>
  (() => {
    'use strict';
    const MODEL='Xenova/multilingual-e5-small';
    const CDN='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
    const CACHE_NAMES=['transformers-cache','vedator-ai-model-v1'];
    // Larger inference batches reduce repeated ONNX/WASM invocation overhead.
    // The model, scoring weights and canonical 30 candidates stay unchanged.
    const AI_EMBED_BATCH_SIZE=8;
    const AI_VECTOR_CACHE_LIMIT=1250;
    const $=id=>document.getElementById(id);
    const state={data:null,original:[],ranked:[],refined:false,busy:false,installed:false,extractor:null,library:null,sourceFetch:null,loading:null,generation:0,vectors:new Map(),mode:'question',batch:{running:false,stopping:false,total:0,done:0,saved:0,failed:0,lastRow:0}};
    function setFeedback(id,value,type=''){
      const el=$(id);
      el.className='feedback '+(type||'muted');
      el.textContent=value||'';
      el.classList.toggle('hidden',!value);
    }
    function say(value,type=''){setFeedback('status',value,type);}
    function downloading(value,type=''){setFeedback('download-status',value,type);}
    function disableBusy(busy){
      state.busy=busy;
      $('install').disabled=busy||state.installed;
      $('erase').disabled=busy||!state.installed;
      $('rerank').disabled=busy||!state.installed;
      $('batch-run').disabled=busy||!state.installed;
      $('batch-stop').classList.toggle('hidden',!state.batch.running);
      $('batch-stop').disabled=!state.batch.running||state.batch.stopping;
      document.querySelectorAll('[data-source-mode]').forEach(button=>button.disabled=busy);
    }
    function call(method,...args){
      return new Promise((resolve,reject)=>{
        const run=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if(method==='mode-read')run.vedatorAiAktualniRezim();
        else if(method==='mode-set')run.vedatorAiNastavRezim(args[0]);
        else if(method==='selected')run.vedatorAiVybranyRadek();
        else if(method==='candidates')run.vedatorAiKandidati(args[0],args[1]);
        else if(method==='save')run.vedatorAiUlozPoradi(args[0],args[1],args[2],args[3]);
        else if(method==='batch-list')run.vedatorAiSeznamRadku(args[0],args[1]);
        else if(method==='batch-candidates')run.vedatorAiKandidatiDavka(args[0],args[1]);
        else if(method==='batch-save')run.vedatorAiUlozDavku(args[0],args[1]);
        else if(method==='restore')run.vedatorAiVratPuvodni(args[0],args[1],args[2]);
        else reject(Error('Neznámá operace Apps Scriptu.'));
      });
    }
    function sourceLabel(mode){
      return mode==='all'?'Otázky i neotázky':mode==='nonquestion'?'Neotázky':'Otázky';
    }
    function updateSourceButtons(){
      document.querySelectorAll('[data-source-mode]').forEach(button=>{
        const active=button.dataset.sourceMode===state.mode;
        button.classList.toggle('active',active);
        button.setAttribute('aria-pressed',String(active));
      });

    }
    async function selectSourceMode(nextMode){
      if(state.busy||!['question','nonquestion','all'].includes(nextMode))return;
      disableBusy(true);
      try{
        const saved=await call('mode-set',nextMode);
        state.mode=saved;
        state.data=null;state.original=[];state.ranked=[];state.refined=false;
        updateSourceButtons();
        render();
        say('');batchStatus('');
        $('search-progress').classList.add('hidden');
        $('batch-progress').classList.add('hidden');
      }catch(error){
        say('Nepodařilo se změnit zdroj: '+(error.message||error),'error');
        return;
      }finally{disableBusy(false);}
    }
    function modelPath(req){
      let url=String(req?.url||req||'').toLowerCase();
      try{url=decodeURIComponent(url)}catch{}
      return url;
    }
    function isModel(req){return modelPath(req).includes('/xenova/multilingual-e5-small/');}
    function isWeight(req){return isModel(req)&&/\/onnx\/model_(?:quantized|int8|uint8|q8)\.onnx(?:[?#]|$)/i.test(modelPath(req));}
    async function isInstalled(){
      if(!('caches' in window))return false;
      const names=await caches.keys();
      for(const name of CACHE_NAMES){
        if(!names.includes(name))continue;
        const cache=await caches.open(name);
        if((await cache.keys()).some(isWeight))return true;
      }
      return false;
    }
    async function updateModelUI(){
      state.installed=await isInstalled().catch(()=>false);
      $('model-status').textContent=state.installed?'Připraven':'Nestažený';
      $('install').classList.toggle('hidden',state.installed);
      $('erase').classList.toggle('hidden',!state.installed);
      disableBusy(state.busy);
    }
    function render(){
      const visible=state.refined?state.ranked.slice(0,5):[];
      $('results-section').classList.toggle('hidden',!visible.length);
      $('result-count').textContent=String(visible.length);
      const box=$('results');box.replaceChildren();
      visible.forEach((item,i)=>{
        const card=document.createElement('div');card.className='item';
        const a=document.createElement('a');
        a.textContent=(i+1)+'. '+item.title;
        a.href=item.url||'#';a.target='_blank';a.rel='noopener';
        const meta=document.createElement('div');meta.className='small muted';
        meta.textContent='Díl '+item.episode+(item.time?' · '+item.time:'')+
          (state.mode==='all'?' · '+(item.type==='nonquestion'?'Neotázka':'Otázka'):'');
        card.append(a,meta);box.append(card);
      });
    }
    async function getLibrary(){
      if(state.library)return state.library;
      const lib=await import(CDN);
      lib.env.useBrowserCache=true;
      lib.env.allowLocalModels=false;
      lib.env.allowRemoteModels=true;
      if(lib.env.backends?.onnx?.wasm)lib.env.backends.onnx.wasm.numThreads=1;
      state.sourceFetch=lib.env.fetch||fetch.bind(window);
      state.library=lib;
      return lib;
    }
    async function getExtractor(download){
      if(state.extractor)return state.extractor;
      if(state.loading)return state.loading;
      state.loading=(async()=>{
        const lib=await getLibrary();
        const base=state.sourceFetch||fetch.bind(window);
        lib.env.fetch=(url,options)=>{
          const path=modelPath(url);
          if(!download&&path.includes('/multilingual-e5-small/')&&/\/onnx\/model_/i.test(path))
            throw Error('Model není v tomto prohlížeči plně uložený. Použij Stáhnout AI.');
          return base(url,options);
        };
        const extractor=await lib.pipeline('feature-extraction',MODEL,{
          dtype:'q8',device:'wasm',
          progress_callback:p=>{
            if(!download)return;
            if(p.status==='progress'&&Number.isFinite(p.progress)){
              const percent=Math.max(0,Math.min(100,p.progress));
              $('progress').classList.remove('hidden');$('progress').value=percent;
              downloading('Stahuji model · '+Math.round(percent)+' %');
            }else if(p.status==='initiate'||p.status==='done'){
              downloading(p.status==='done'?'Soubor uložen':'Připravuji model…');
            }
          }
        });
        state.extractor=extractor;return extractor;
      })().finally(()=>state.loading=null);
      return state.loading;
    }
    async function install(){
      if(state.busy||state.installed)return;
      if(!('caches' in window)||!('WebAssembly' in window)){
        downloading('Prohlížeč v tomto panelu nepodporuje potřebné ukládání nebo WebAssembly. Vyhledávání bez AI funguje dál.','error');return;
      }
      if(!confirm('Stáhnout model AI (~140 MB)?'))return;
      disableBusy(true);$('progress').value=0;$('progress').classList.remove('hidden');
      downloading('Připravuji stažení…');
      try{
        await getExtractor(true);
        state.installed=await isInstalled();
        if(!state.installed)throw Error('Model se načetl, ale Google panel nepotvrdil trvalé uložení.');
        $('progress').value=100;
        downloading('Model stažen.','ok');
      }catch(error){
        downloading('Instalace AI selhala: '+(error.message||error)+'. Původní vyhledávání zůstává funkční.','error');
        state.extractor=null;
      }finally{await updateModelUI();disableBusy(false);}
    }
    async function erase(){
      if(state.busy||!state.installed)return;
      if(!confirm('Smazat uložený model AI?'))return;
      disableBusy(true);
      try{
        if(state.loading)await state.loading.catch(()=>{});
        if(state.extractor?.dispose)await state.extractor.dispose();
        state.extractor=null;state.vectors.clear();
        for(const name of await caches.keys()){
          if(!CACHE_NAMES.includes(name))continue;
          const cache=await caches.open(name);
          for(const req of (await cache.keys()).filter(isModel))await cache.delete(req);
        }
        state.installed=await isInstalled();
        if(state.installed)throw Error('Některé soubory zůstaly uložené.');
        state.refined=false;state.ranked=state.original.slice();render();
        downloading('Model smazán.','ok');
      }catch(error){downloading('Smazání selhalo: '+(error.message||error),'error');}
      finally{await updateModelUI();disableBusy(false);}
    }
    async function vectorsFor(texts){
      if(!texts.length)return [];
      const out=await state.extractor(texts,{pooling:'mean',normalize:true});
      const cols=out.data.length/texts.length;
      if(!Number.isInteger(cols)||cols<8)throw Error('Neplatný výstup AI modelu.');
      const values=texts.map((_,i)=>new Float32Array(out.data.slice(i*cols,(i+1)*cols)));
      if(typeof out.dispose==='function')out.dispose();
      return values;
    }
    function rememberVector(key,vector){
      if(state.vectors.has(key))state.vectors.delete(key);
      state.vectors.set(key,vector);
      while(state.vectors.size>AI_VECTOR_CACHE_LIMIT){
        state.vectors.delete(state.vectors.keys().next().value);
      }
    }
    function dot(a,b){let total=0;for(let i=0;i<a.length;i++)total+=a[i]*b[i];return total;}

    // Shared model computation for one row, used by the manual action and
    // the sequential whole-sheet run. Never introduces new candidates.
    async function computeAiOrder(data,onProgress,shouldStop=()=>false){
      const original=Array.isArray(data.candidates)?data.candidates:[];
      if(original.length<2)return original.map(item=>item.id);
      await getExtractor(false);
      if(shouldStop())throw Error('Zpracování bylo zastaveno.');
      const queryKey='query: '+data.question;
      let queryVector=state.vectors.get(queryKey);
      if(!queryVector){
        queryVector=(await vectorsFor([queryKey]))[0];
        rememberVector(queryKey,queryVector);
      }
      const scores=[];
      for(let i=0;i<original.length;i+=AI_EMBED_BATCH_SIZE){
        if(shouldStop())throw Error('Zpracování bylo zastaveno.');
        const group=original.slice(i,i+AI_EMBED_BATCH_SIZE);
        const missing=[];
        const seen=new Set();
        for(const item of group){
          const key='passage: '+item.passage;
          if(!state.vectors.has(key)&&!seen.has(key)){
            seen.add(key);missing.push(key);
          }
        }
        if(missing.length){
          const embeddings=await vectorsFor(missing);
          missing.forEach((key,j)=>rememberVector(key,embeddings[j]));
        }
        for(let j=0;j<group.length;j++){
          const item=group[j];
          const vector=state.vectors.get('passage: '+item.passage);
          if(!vector)throw Error('Vektor AI nelze načíst.');
          const similarity=dot(queryVector,vector);
          const tier=1-Math.min(8,Number(item.tier)||0)/8;
          scores.push({item,position:i+j,score:.63*(.7*tier+.3*item.score)+.37*similarity});
        }
        if(onProgress)onProgress(scores.length,original.length);
        await new Promise(resolve=>setTimeout(resolve,0));
      }
      if(shouldStop())throw Error('Zpracování bylo zastaveno.');
      scores.sort((a,b)=>b.score-a.score||a.position-b.position);
      const ranked=scores.map(x=>x.item);
      const expected=new Set(original.map(x=>x.id));
      if(ranked.length!==original.length||new Set(ranked.map(x=>x.id)).size!==original.length||
         ranked.some(x=>!expected.has(x.id)))throw Error('AI vrátila neplatné pořadí kandidátů.');
      return ranked.map(x=>x.id);
    }

    function orderedFromIds(original,ids){
      const byId=new Map(original.map(x=>[x.id,x]));
      if(ids.length!==original.length||new Set(ids).size!==ids.length||
          ids.some(id=>!byId.has(id)))throw Error('Neplatná sada výsledků AI.');
      return ids.map(id=>byId.get(id));
    }

    // For a single question, save results immediately to Dotazy B:S.
    async function rerank(){
      if(state.busy||!state.installed)return;
      const token=++state.generation;
      disableBusy(true);
      state.data=null;state.original=[];state.ranked=[];state.refined=false;render();
      batchStatus('');
      $('batch-progress').classList.add('hidden');
      $('search-progress').value=0;
      $('search-progress').classList.remove('hidden');
      say('Načítání…');
      try{
        const selection=await call('selected');
        const data=await call('candidates',selection.row,state.mode);
        if(data.searchMode!==state.mode)throw Error('Změnil se zdroj hledání.');
        state.data=data;state.original=data.candidates||[];
        say('Zpracovávám 0 %');
        const ids=await computeAiOrder(data,(done,total)=>{
          const percent=Math.round(done/Math.max(total,1)*100);
          $('search-progress').value=percent;
          say('Zpracovávám '+percent+' %');
        },()=>token!==state.generation);
        if(token!==state.generation)throw Error('Zpracování přerušeno.');
        const result=await call('save',data.row,data.question,ids,state.mode);
        state.ranked=orderedFromIds(state.original,ids);state.refined=true;render();
        say('Zpracováno · řádek '+result.row,'ok');
      }catch(error){
        state.refined=false;state.ranked=[];render();
        const message=String(error.message||error);
        say(/prázdnou otázku|Vyberte nejprve buňku/.test(message)
          ?'Vyber vyplněný řádek v listu Dotazy.'
          :'Chyba: '+message,'error');
      }finally{
        $('search-progress').classList.add('hidden');
        disableBusy(false);
      }
    }

    function batchStatus(message,type=''){
      setFeedback('batch-status',message,type);
    }
    function batchProgress(){
      const stateBatch=state.batch;
      $('batch-progress').classList.remove('hidden');
      $('batch-progress').value=stateBatch.total?
        Math.round(stateBatch.done/stateBatch.total*100):100;
    }
    function stopBatch(){
      if(!state.batch.running)return;
      state.batch.stopping=true;
      disableBusy(true);
      batchStatus('Zastavuji…');
    }
    // Writes a completed subset immediately, even when Stop was requested.
    async function saveCompletedBatch(rows){
      if(!rows.length)return;
      const outcome=await call('batch-save',rows,state.mode);
      const saved=Array.isArray(outcome.saved)?outcome.saved:[];
      const rejected=Array.isArray(outcome.failed)?outcome.failed:[];
      state.batch.saved+=saved.length;
      state.batch.failed+=rejected.length;
      state.batch.done+=rows.length;
      batchProgress();
      const last=rows.at(-1);
      state.batch.lastRow=last.row;
      batchStatus('Zpracováno '+state.batch.done+'/'+state.batch.total+
        (state.batch.failed?' · chyby '+state.batch.failed:''),'ok');
      if(rejected.length)console.warn('Nepodařilo se uložit některé AI výsledky',rejected);
      if(state.data && saved.includes(state.data.row)){
        const stored=rows.find(x=>x.row===state.data.row);
        if(stored){
          state.ranked=orderedFromIds(state.original,stored.ids);
          state.refined=true;render();
        }
      }
    }

    // One UI run holds its own client-side model; no background process or API.
    // Default mode skips "AI hotovo", allowing reliable manual resume.
    async function runBatch(){
      if(state.busy||!state.installed)return;
      const batch=state.batch={running:true,stopping:false,total:0,done:0,saved:0,failed:0,lastRow:0};
      disableBusy(true);
      say('');
      $('search-progress').classList.add('hidden');
      batchStatus('Načítání…');
      let pending=[];
      try{
        await getExtractor(false);
        const list=await call('batch-list',false,state.mode);
        const rows=Array.isArray(list.rows)?list.rows:[];
        batch.total=rows.length;
        batchProgress();
        if(!rows.length){
          batchStatus('Zpracováno – všechny řádky jsou hotové.','ok');
          return;
        }
        batchStatus('0 / '+batch.total+' · 0 %');
        let modelErrors=0;
        for(let pos=0;pos<rows.length&&!batch.stopping;pos+=5){
          const group=rows.slice(pos,pos+5);
          // One source index is used for a group of 5; not rebuilt per question.
          const data=await call('batch-candidates',group,state.mode);
          pending=[];
          for(let i=0;i<data.length;i++){
            if(batch.stopping)break;
            const item=data[i];
            if(item.empty || !Array.isArray(item.candidates) || item.searchMode!==state.mode){
              batch.failed++;batch.done++;batchProgress();continue;
            }
            state.data=item;state.original=item.candidates;state.ranked=item.candidates.slice();state.refined=false;
            try{
              const ids=await computeAiOrder(item,(done,total)=>{
                const processed=batch.done+pending.length+(total?done/total:0);
                const percent=Math.round(processed/batch.total*100);
                $('batch-progress').value=percent;
                batchStatus(Math.floor(processed)+' / '+batch.total+' · '+percent+' %');
              },()=>batch.stopping);
              pending.push({row:item.row,question:item.question,ids});
              modelErrors=0;
            }catch(error){
              if(batch.stopping)break;
              batch.failed++;batch.done++;batchProgress();modelErrors++;
              console.warn('AI nezpracovala řádek '+item.row,error);
              batchStatus('Chyba na řádku '+item.row+': '+String(error?.message||error),'error');
              // If the model is unavailable, do not hammer hundreds of rows.
              if(modelErrors>=3){batch.stopping=true;break;}
            }
          }
          // Always flush already-computed rows, including on user Stop.
          if(pending.length){
            const toSave=pending;
            pending=[];
            await saveCompletedBatch(toSave);
          }
          await new Promise(resolve=>setTimeout(resolve,0));
        }
        const summary=batch.saved+'/'+batch.total+
          (batch.failed?' · chyby '+batch.failed:'');
        batchStatus((batch.stopping?'Zastaveno ':'Zpracováno ')+summary,
          batch.failed?'error':'ok');
      }catch(error){
        batchStatus('Chyba: '+(error.message||error),'error');
      }finally{
        batch.running=false;batch.stopping=false;
        disableBusy(false);
      }
    }
    document.querySelectorAll('[data-source-mode]').forEach(button=>{
      button.addEventListener('click',()=>selectSourceMode(button.dataset.sourceMode));
    });
    $('install').addEventListener('click',install);
    $('erase').addEventListener('click',erase);
    $('rerank').addEventListener('click',rerank);
    $('batch-run').addEventListener('click',runBatch);
    $('batch-stop').addEventListener('click',stopBatch);
    updateModelUI().catch(e=>downloading(String(e),'error'));
    // Read the spreadsheet-wide setting before loading the first row.
    (async()=>{
      disableBusy(true);
      try{
        state.mode=await call('mode-read');
        updateSourceButtons();
      }catch(error){say('Nepodařilo se načíst uložený režim: '+(error.message||error),'error');}
      finally{disableBusy(false);}
      say('');batchStatus('');
    })();
  })();
  </script>
</body>
</html>
