name: Check episode 12 data before caption registration
on:
  push:
    branches: [captions/episode-12-precise-20261126]
    paths:
      - 'captions/episode-12*'
      - 'captions/source/episode-12*'
      - 'tools/*episode12*'
      - .github/workflows/validate-episode12-pre-registration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode12-pre-registration-data
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VEDATOR_EP12_AUDIO: /tmp/vedator-ep12-audio
      VEDATOR_CAPTION_AUDIO: /tmp/vedator-ep12-audio
      VEDATOR_TEST_DEPS: ${{ runner.temp }}/episode12-layout-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source tools and reproducible reviewed segmentation
        run: |
          python -m py_compile tools/prepare-episode12-segmented-captions.py tools/rebuild-episode12-captions.py tools/validate-episode12-captions.py
          node --check tools/test-episode12-mobile-layout-browser.mjs
          node --check tools/register-episode12-captions.mjs
          python tools/review-episode12-segmentation.py
          python tools/prepare-episode12-segmented-captions.py
          git diff --exit-code -- captions/episode-12.edited.json captions/source/episode-12-segmentation-review.json
      - name: Detect complete actual acoustic output without faking release readiness
        id: output
        run: |
          ready=true
          for path in captions/episode-12.json captions/episode-12.cs.srt captions/episode-12.sk.srt captions/episode-12.review.json captions/source/episode-12-alignment.json; do
            if ! test -s "$path"; then ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Actual aligned output present: $ready"
      - uses: actions/cache@v4
        if: steps.output.outputs.ready == 'true'
        with:
          path: /tmp/vedator-ep12-audio
          key: vedator-original-episode-12-audio-v1
      - name: Authenticate original RSS MP3
        if: steps.output.outputs.ready == 'true'
        run: python tools/download-caption-reference.py --episode 12 --output /tmp/vedator-ep12-audio/episode-12.mp3
      - name: Verify all original words, characters, exact scores and JSON/SRT data
        if: steps.output.outputs.ready == 'true'
        run: |
          python tools/validate-episode12-captions.py --allow-unregistered --audio /tmp/vedator-ep12-audio/episode-12.mp3 > captions/source/episode-12-prereg-validation.json
          cat captions/source/episode-12-prereg-validation.json
      - name: Install actual mobile layout dependencies
        if: steps.output.outputs.ready == 'true'
        run: npm install --prefix "$VEDATOR_TEST_DEPS" --no-audit --no-fund puppeteer-core@25.12.0 @sparticuz/chromium@153.0.0
      - name: Check every final CZ/SK cue on MP3 video and reader surfaces
        if: steps.output.outputs.ready == 'true'
        run: |
          VEDATOR_LAYOUT_UNREGISTERED_FINAL=1 node tools/test-episode12-mobile-layout-browser.mjs > captions/source/episode-12-prereg-layout.json
          cat captions/source/episode-12-prereg-layout.json
      - name: Record actual successful data and layout verification
        if: steps.output.outputs.ready == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const a=read('captions/source/episode-12-prereg-validation.json'),b=read('captions/source/episode-12-prereg-layout.json');
          assert(a.ok&&b.findings.length===0&&b.pageErrors.length===0&&a.captionSha256===b.captionSha256);
          const p='captions/episode-12.review.json',r=read(p);
          delete r.publicationApproved;
          r.status='editorially-reviewed-acoustically-aligned-with-documented-uncertainty';
          r.validatedForRegistration=true;
          r.registrationChecks={captionSha256:a.captionSha256,editedSha256:a.editedSha256,structure:'captions/source/episode-12-prereg-validation.json',layout:'captions/source/episode-12-prereg-layout.json'};
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          JS
      - name: Save actual evidence without registering or publishing captions
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in captions/source/episode-12-prereg-validation.json captions/source/episode-12-prereg-layout.json captions/episode-12.review.json; do
            if test -s "$path"; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Preserve actual episode 12 pre-registration validation results"
            saved=0
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then saved=1; break; fi
            done
            test "$saved" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode12-pre-registration-evidence
          path: |
            captions/source/episode-12-prereg-validation.json
            captions/source/episode-12-prereg-layout.json
