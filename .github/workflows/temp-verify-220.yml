name: TEMP verify episode 220
on:
  push:
    branches: [add-summary-220]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build canonical episode 220 data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const urls={cs:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/220-inge-lehmann.html',sk:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/220-inge-lehmann.html'};
          const decode=s=>s.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&#x27;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
          const parse=html=>{
            const ep=html.match(/data-episode="(\d+)"/)?.[1];
            const title=decode(html.match(/<h1>([\s\S]*?)<\/h1>/)?.[1]||'');
            const out=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m; while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            return {ep,title,out};
          };
          (async()=>{
            const data={};
            for(const lang of ['cs','sk']){
              const r=await fetch(urls[lang]); if(!r.ok) throw new Error(`${lang} fetch ${r.status}`);
              const p=parse(await r.text());
              if(p.ep!=='220'||!p.title.includes('220')||!p.title.includes('Inge Lehmann')) throw new Error(`${lang} metadata mismatch`);
              data[lang]=p.out;
            }
            if(data.cs.length!==10||data.sk.length!==10) throw new Error(`FAQ count ${data.cs.length}/${data.sk.length}`);
            if(data.cs.map(x=>x.time).join('|')!==data.sk.map(x=>x.time).join('|')) throw new Error('Timestamp mismatch');
            let json=JSON.stringify(data).replace(/;/g,'\\u003b');
            fs.writeFileSync('episode-220-summary.js',`const DATA=${json};\nif(typeof window!==\"undefined\")window.EPISODE_220_SUMMARY=DATA;\n`);
            let aug=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            aug=aug.replace('const EXTRAS=[221,','const EXTRAS=[220,221,');
            fs.writeFileSync('tools/augment-v2-extra-nonquestions.mjs',aug);
            let test=fs.readFileSync('tools/test-content-v2.mjs','utf8');
            test=test.replace('for(const n of [221,','for(const n of [220,221,');
            fs.writeFileSync('tools/test-content-v2.mjs',test);
            const src=fs.readFileSync('episode-220-summary.js','utf8');
            const payload=src.slice(src.indexOf('const DATA=')+11,src.indexOf(';',src.indexOf('const DATA=')+11));
            const round=JSON.parse(payload);
            if(round.cs.length!==10||round.sk.length!==10) throw new Error('Serialization round-trip failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node --check episode-220-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-220-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Přidat ověřená data epizody 220'
          git push
