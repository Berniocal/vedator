# trigger retry
name: TEMP verify episode 227

on:
  push:
    branches: [add-summary-227]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical episode 227 data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/227-expandujici-mikroskopicke-cerne-diry.html' -o /tmp/227-cs.html
          curl -fsSL 'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/227-expandujuce-mikroskopicke-cierne-diery.html' -o /tmp/227-sk.html
          cat > /tmp/build-227.mjs <<'NODE'
          import fs from 'node:fs';
          function parse(path,lang){
            const html=fs.readFileSync(path,'utf8');
            const article=html.match(/<article class="episode-summary"([^>]*)>/)?.[1]||'';
            const episode=article.match(/data-episode="(\d+)"/)?.[1];
            if(episode!=='227')throw new Error(`${lang}: wrong episode ${episode}`);
            const title=html.match(/<title>([\s\S]*?)<\/title>/)?.[1]||'';
            const h1=html.match(/<h1>([\s\S]*?)<\/h1>/)?.[1]||'';
            if(!title.includes('227')||!h1.includes('227'))throw new Error(`${lang}: title/h1 mismatch`);
            const sections=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>x[1]);
              sections.push({time:m[1],title:m[2],points});
            }
            return {sections,metaCount:Number(article.match(/data-question-count="(\d+)"/)?.[1]||0)};
          }
          const cs=parse('/tmp/227-cs.html','cs');
          const sk=parse('/tmp/227-sk.html','sk');
          if(cs.sections.length!==10||sk.sections.length!==10)throw new Error(`Expected 10+10 FAQ, got ${cs.sections.length}+${sk.sections.length}`);
          if(cs.metaCount!==10||sk.metaCount!==10)throw new Error(`Metadata count mismatch ${cs.metaCount}/${sk.metaCount}`);
          const cst=cs.sections.map(x=>x.time), skt=sk.sections.map(x=>x.time);
          if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK timestamp mismatch`);
          const data={cs:cs.sections,sk:sk.sections};
          let json=JSON.stringify(data).replace(/;/g,'\\u003b');
          fs.writeFileSync('episode-227-summary.js',`const DATA=${json};\n`);
          const round=JSON.parse(json);
          if(JSON.stringify(round)!==JSON.stringify(data))throw new Error('Serialization round-trip failed');
          for(const file of ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']){
            let s=fs.readFileSync(file,'utf8');
            if(file.includes('augment')){
              if(!s.includes('const EXTRAS=[228,'))throw new Error('EXTRAS anchor missing');
              s=s.replace('const EXTRAS=[228,','const EXTRAS=[227,228,');
            }else{
              if(!s.includes('for(const n of [228,'))throw new Error('test anchor missing');
              s=s.replace('for(const n of [228,','for(const n of [227,228,');
            }
            fs.writeFileSync(file,s);
          }
          console.log(JSON.stringify({episode:227,cs:cs.sections.length,sk:sk.sections.length,timestamps:cst},null,2));
          NODE
          node /tmp/build-227.mjs
          node --check app-v2.js
          node --check episode-227-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
          git status --short
      - name: Commit verified target files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-227-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git diff --cached --quiet && { echo 'No target changes'; exit 1; }
          git commit -m 'Přidat ověřená data epizody 227'
          git push
