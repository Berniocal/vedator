name: Temp verify 212
on:
  push:
    branches: [add-summary-212]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical episode 212 data
        run: |
          python - <<'PY'
          import json,re,html,urllib.request,pathlib
          EP=212
          urls={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/212-rok-2023-ve-vede.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/212-rok-2023-vo-vede.html'
          }
          data={}
          for lang,url in urls.items():
            txt=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
            assert f'data-episode="{EP}"' in txt
            assert re.search(rf'<title>[^<]*\b{EP}\b[^<]*</title>',txt)
            assert re.search(rf'<h1>[^<]*\b{EP}\b[^<]*</h1>',txt)
            secs=re.findall(r'<section class="faq" data-time="([^"]+)"><h2>(.*?)</h2><ul>(.*?)</ul></section>',txt,re.S)
            items=[]
            for t,title,ul in secs:
              pts=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in re.findall(r'<li>(.*?)</li>',ul,re.S)]
              items.append({'time':t,'title':html.unescape(re.sub(r'<[^>]+>','',title)).strip(),'points':pts})
            assert len(items)==12, (lang,len(items))
            data[lang]=items
          assert [x['time'] for x in data['cs']]==[x['time'] for x in data['sk']]
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')
          pathlib.Path('episode-212-summary.js').write_text(f'const DATA={payload};\nif(typeof window!=="undefined")window.EPISODE_212_SUMMARY=DATA;\n',encoding='utf-8')
          aug=pathlib.Path('tools/augment-v2-extra-nonquestions.mjs')
          s=aug.read_text(encoding='utf-8')
          s=s.replace('const EXTRAS=[213,','const EXTRAS=[212,213,',1)
          aug.write_text(s,encoding='utf-8')
          test=pathlib.Path('tools/test-content-v2.mjs')
          s=test.read_text(encoding='utf-8')
          s=s.replace('for(const n of [213,','for(const n of [212,213,',1)
          anchor="if(data.meta?.legacyParity?.source!=='series.json')fail('Series source metadata missing');"
          extra="""const episode212=data.nonquestions.episodes['212'];\nif(!episode212||episode212.cs.length!==12||episode212.sk.length!==12)fail('Episode 212 summary count mismatch');\nconst episode212Times=['10:26','11:15','12:52','14:53','16:02','18:18','18:46','21:14','24:25','27:07','29:12','29:48'];\nif(JSON.stringify(episode212.cs.map(x=>x.time))!==JSON.stringify(episode212Times)||JSON.stringify(episode212.sk.map(x=>x.time))!==JSON.stringify(episode212Times))fail('Episode 212 timestamps mismatch');\n"""
          s=s.replace(anchor,extra+anchor,1)
          test.write_text(s,encoding='utf-8')
          # serialization round-trip
          js=pathlib.Path('episode-212-summary.js').read_text(encoding='utf-8')
          raw=js.split('const DATA=',1)[1].split(';',1)[0]
          assert json.loads(raw)==data
          print('canonical 212 OK:',len(data['cs']),len(data['sk']))
          PY
      - name: Run V2 verification
        run: |
          node --check app-v2.js
          node --check episode-212-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- content-v2.json episodes.json sw.js
          git add -- episode-212-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git commit -m 'Přidat ověřené shrnutí epizody 212'
          git push
