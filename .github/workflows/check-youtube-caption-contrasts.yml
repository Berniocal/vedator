name: Compare disputed caption wordings acoustically
on:
  push:
    branches: [captions/finish-youtube-363-361-20261119]
    paths:
      - tools/check-youtube-caption-contrasts.py
      - .github/workflows/check-youtube-caption-contrasts.yml
      - captions/source/episode-36*-youtube-contrast-requests.json
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        episode: [363, 362, 361]
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-youtube-caption-final-models-v1
          restore-keys: vedator-youtube-caption-audio-models-v1
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-${{ matrix.episode }}-v1
      - name: Install acoustic comparison dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 sentencepiece 'numpy<2' num2words==0.5.14
      - name: Compare explicit alternatives on identical audio
        run: python tools/check-youtube-caption-contrasts.py ${{ matrix.episode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-contrasts-${{ matrix.episode }}-${{ github.run_id }}
          path: captions/source/episode-${{ matrix.episode }}-youtube-contrast-audio.json
          retention-days: 7
          if-no-files-found: warn
      - name: Save acoustic comparison evidence
        if: always()
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f captions/source/episode-${EPISODE}-youtube-contrast-audio.json; then
            git add captions/source/episode-${EPISODE}-youtube-contrast-audio.json
            if ! git diff --cached --quiet; then
              git commit -m "Compare episode ${EPISODE} disputed caption words acoustically"
              for attempt in 1 2 3 4; do
                git pull --rebase origin "${GITHUB_REF_NAME}"
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              done
              exit 1
            fi
          fi
