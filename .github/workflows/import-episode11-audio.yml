name: Import verified episode 11 MP3
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-episode11-audio.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-episode11-audio
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download unchanged MP3 and authenticate against reviewed captions
        run: python tools/download-caption-reference.py --episode 11 --output audio/episode-11.mp3
      - name: Preserve verified audio for playback from the application host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/episode-11.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add hash-verified original episode 11 MP3 for reliable playback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
