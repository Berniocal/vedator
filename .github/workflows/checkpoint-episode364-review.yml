name: Preserve completed episode 364 review evidence
on:
  push:
    branches: [captions/episode-364-20261119]
    paths: [.github/workflows/checkpoint-episode364-review.yml]
permissions:
  actions: write
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve completed recognition before final parallel alignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Berniocal/vedator/actions/runs/44593878457/jobs > /tmp/review-jobs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/review-jobs.json'))
          steps=d['jobs'][0]['steps']
          required=['Prepare Czech translation from reviewed Slovak candidates','Independently recognize flagged speech and omitted-caption gaps']
          assert all(any(s['name']==name and s['conclusion']=='success' for s in steps) for name in required)
          PY
          status=$(gh api repos/Berniocal/vedator/actions/runs/44593878457 --jq .status)
          if test "$status" != completed; then
            gh api --method POST repos/Berniocal/vedator/actions/runs/44593878457/cancel
          fi
