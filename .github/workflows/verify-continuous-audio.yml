name: Verify continuous audio experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'continuous-audio.mjs'
      - 'continuous-test-ui.mjs'
      - 'test-souvisle.html'
      - 'tools/test-continuous-audio-browser.mjs'
      - 'tools/continuous-tone-base64.txt'
      - 'tools/continuous-vbr-base64.txt'
      - 'audio-seek-index.json'
      - 'tools/build-mp3-seek-index.mjs'
      - '.github/workflows/verify-continuous-audio.yml'
permissions:
  contents: read
jobs:
  continuous-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check isolated modules
        run: |
          node --check continuous-audio.mjs
          node --check continuous-test-ui.mjs
          node --check tools/test-continuous-audio-browser.mjs
      - name: Install browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/continuous-audio-test" --no-audit --no-fund puppeteer-core@25.12.0 @sparticuz/chromium@153.0.0
      - name: Test real MP3 decoding and continuous hidden playback
        run: VEDATOR_TEST_DEPS="$RUNNER_TEMP/continuous-audio-test" node tools/test-continuous-audio-browser.mjs

      - name: Download the exact reported episode for a long-seek regression
        run: curl --fail --location --retry 2 --max-time 120 'https://mcdn.podbean.com/mf/web/4mbanm/podcast_ep9.mp3' -o "$RUNNER_TEMP/vedator-episode-9.mp3"
      - name: Verify episode 9 at 26:22 and continuous handoff after seeking
        run: VEDATOR_REAL_EP9_FILE="$RUNNER_TEMP/vedator-episode-9.mp3" VEDATOR_TEST_DEPS="$RUNNER_TEMP/continuous-audio-test" node tools/test-continuous-audio-browser.mjs
