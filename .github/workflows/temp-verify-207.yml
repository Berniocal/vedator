name: Temp verify 207
on:
  push:
    branches: [add-summary-207]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical episode 207 data
        run: |
          python - <<'PY'
          import json,re,html,urllib.request,pathlib
          EP=207
          urls={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/207-magie-nikoly-tesly.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/207-magia-nikolu-teslu.html'
          }
          data={}; meta={}
          for lang,url in urls.items():
            txt=urllib.request.urlopen(url,timeout=30).read().decode('utf-8')
            assert f'data-episode="{EP}"' in txt
            assert re.search(rf'<title>[^<]*\b{EP}\b[^<]*</title>',txt)
            assert re.search(rf'<h1>[^<]*\b{EP}\b[^<]*</h1>',txt)
            secs=re.findall(r'<section class="faq" data-time="([^"]+)"><h2>(.*?)</h2><ul>(.*?)</ul></section>',txt,re.S)
            items=[]
            for t,title,ul in secs:
              pts=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in re.findall(r'<li>(.*?)</li>',ul,re.S)]
              items.append({'time':t,'title':html.unescape(re.sub(r'<[^>]+>','',title)).strip(),'points':pts})
            assert items, lang
            data[lang]=items
            qc=re.search(r'data-question-count="(\d+)"',txt)
            meta[lang]=int(qc.group(1)) if qc else None
          assert len(data['cs'])==len(data['sk']), (len(data['cs']),len(data['sk']))
          assert [x['time'] for x in data['cs']]==[x['time'] for x in data['sk']]
          print('actual counts',len(data['cs']),len(data['sk']),'metadata',meta)
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace('</','<\\/')
          pathlib.Path('episode-207-summary.js').write_text(f'const DATA={payload};\nif(typeof window!=="undefined")window.EPISODE_207_SUMMARY=DATA;\n',encoding='utf-8')
          aug=pathlib.Path('tools/augment-v2-extra-nonquestions.mjs')
          s=aug.read_text(encoding='utf-8')
          assert "indexOf(';')" not in s
          if '207' not in re.search(r'const EXTRAS=\[([^\]]+)\]',s).group(1).split(','):
            s=s.replace('const EXTRAS=[','const EXTRAS=[207,',1)
          aug.write_text(s,encoding='utf-8')
          test=pathlib.Path('tools/test-content-v2.mjs')
          s=test.read_text(encoding='utf-8')
          if not re.search(r'for\(const n of \[[^\]]*\b207\b',s):
            s=s.replace('for(const n of [','for(const n of [207,',1)
          anchor="if(data.meta?.legacyParity?.source!=='series.json')fail('Series source metadata missing');"
          times=[x['time'] for x in data['cs']]
          extra=f"const episode207=data.nonquestions.episodes['207'];\nif(!episode207||episode207.cs.length!=={len(data['cs'])}||episode207.sk.length!=={len(data['sk'])})fail('Episode 207 summary count mismatch');\nconst episode207Times={json.dumps(times,separators=(',',':'))};\nif(JSON.stringify(episode207.cs.map(x=>x.time))!==JSON.stringify(episode207Times)||JSON.stringify(episode207.sk.map(x=>x.time))!==JSON.stringify(episode207Times))fail('Episode 207 timestamps mismatch');\n"
          assert anchor in s
          if "const episode207=data.nonquestions.episodes['207'];" not in s:
            s=s.replace(anchor,extra+anchor,1)
          test.write_text(s,encoding='utf-8')
          js=pathlib.Path('episode-207-summary.js').read_text(encoding='utf-8')
          raw=js.split('const DATA=',1)[1].split(';\nif(typeof window',1)[0]
          assert json.loads(raw)==data
          PY
      - name: Run V2 verification
        run: |
          node --check app-v2.js
          node --check episode-207-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- content-v2.json episodes.json sw.js
          git add -- episode-207-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if git diff --cached --quiet; then
            echo 'Target files already verified and unchanged.'
          else
            git commit -m 'Přidat ověřené shrnutí epizody 207'
            git push
          fi
