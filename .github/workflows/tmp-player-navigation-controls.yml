name: Temporary player navigation controls fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-player-navigation-controls.yml'
      - 'tools/tmp-player-navigation-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch player navigation and controls
        run: node tools/tmp-player-navigation-patch.mjs

      - name: Verify patch
        shell: bash
        run: |
          node --check app-v2.js
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('app-v2.js','utf8');
          const required=[
            'V2_PLAYER_NAVIGATION_CONTROLS_V1',
            "#questions-v2 .question-card .play,#nonquestions-v2 .question-card .play",
            'player-prev-question-v2',
            'player-next-question-v2',
            'player-dismiss-v2',
            "n.prev.textContent='|◀'",
            "n.next.textContent='▶|'",
            "expand.textContent='🔊'",
            '--vedator-back-bottom',
            'background:#7c3aed'
          ];
          for(const value of required)if(!source.includes(value))throw new Error('Missing expected fragment: '+value);
          const data=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const counts=new Map();for(const question of data.questions||[]){const n=Number(question.episode)||0;counts.set(n,(counts.get(n)||0)+1)}
          if(![...counts.values()].some(count=>count>=2))throw new Error('No episode with multiple questions found');
          console.log('Static player navigation checks passed.');
          NODE
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          git commit -m 'Fix player navigation and controls'
          git push origin main
