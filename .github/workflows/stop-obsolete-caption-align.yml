name: Stop obsolete caption alignment attempt
on:
  push:
    branches: [captions/youtube-batch-363-361-20261119]
    paths: [.github/workflows/stop-obsolete-caption-align.yml]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop only the superseded attempt with the corrected saving step
