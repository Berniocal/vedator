name: Draft Czech translation of episode 6
on:
  push:
    branches: [captions/episode-6-precise-20261117]
    paths:
      - tools/translate-episode6-draft.py
      - .github/workflows/translate-episode6-draft.yml
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Czech translation model
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 sentencepiece 'numpy<2'
      - name: Wait for complete source transcription
        run: |
          for attempt in $(seq 1 120); do
            git pull --ff-only origin captions/episode-6-precise-20261117
            if test -f captions/source/episode-6-draft.sk.json; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Translate complete source draft
        env:
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/translate-episode6-draft.py
      - name: Save translation draft for editorial review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-6-translation.cs.json
          git commit -m "Prepare Czech draft translation for complete episode 6 editorial review"
          git pull --rebase origin captions/episode-6-precise-20261117
          git push origin HEAD:captions/episode-6-precise-20261117
