name: TEMP verify episode 252

on:
  push:
    branches: [add-summary-252]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate canonical episode 252 data and register it
        run: |
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const get=url=>new Promise((resolve,reject)=>https.get(url,{headers:{'User-Agent':'Vedator-252-builder'}},r=>{let s='';r.setEncoding('utf8');r.on('data',d=>s+=d);r.on('end',()=>r.statusCode===200?resolve(s):reject(new Error(`HTTP ${r.statusCode}`)));}).on('error',reject));
          const decode=s=>s.replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          const parse=html=>[...html.matchAll(/<section class="faq" data-time="([^"]+)"><h2>(.*?)<\/h2><ul>(.*?)<\/ul><\/section>/gs)].map(m=>({time:m[1],title:decode(m[2]),points:[...m[3].matchAll(/<li>(.*?)<\/li>/gs)].map(x=>decode(x[1]))}));
          (async()=>{
            const csHtml=await get('https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/252-ig-nobelove-ceny-2024.html');
            const skHtml=await get('https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/252-ig-nobelove-ceny-2024.html');
            for(const [lang,html] of [['cs',csHtml],['sk',skHtml]]){
              if(!html.includes('data-episode="252"')||!html.includes(`data-lang="${lang}"`))throw new Error(`Wrong ${lang} source metadata`);
              if(!html.includes('Vedátorský podcast 252 – Ig Nobelove ceny 2024'))throw new Error(`Wrong ${lang} title`);
            }
            const cs=parse(csHtml), sk=parse(skHtml);
            if(cs.length!==11||sk.length!==11)throw new Error(`Expected 11+11 FAQ, got ${cs.length}+${sk.length}`);
            if(cs.some((x,i)=>x.time!==sk[i].time))throw new Error('CZ/SK timestamps differ');
            const data={cs,sk};
            const json=JSON.stringify(data).replace(/;/g,'\\u003b');
            fs.writeFileSync('episode-252-summary.js',`const DATA=${json};\n`);
            const aug='tools/augment-v2-extra-nonquestions.mjs';
            let a=fs.readFileSync(aug,'utf8');
            a=a.replace('const EXTRAS=[253,','const EXTRAS=[252,253,');
            fs.writeFileSync(aug,a);
            const test='tools/test-content-v2.mjs';
            let t=fs.readFileSync(test,'utf8');
            t=t.replace('for(const n of [253,','for(const n of [252,253,');
            fs.writeFileSync(test,t);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check episode-252-summary.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-252-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Add episode 252 summary integration'
            git push
          fi
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node --check episode-252-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
