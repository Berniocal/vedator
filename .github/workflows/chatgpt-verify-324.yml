name: Verify episode 324

on:
  push:
    branches:
      - chatgpt/episode-324-summary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24 >/dev/null 2>&1
          cp index.html v2.html
          if command -v chromium >/dev/null 2>&1; then echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"; fi
          if command -v google-chrome >/dev/null 2>&1; then echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; fi

      - name: Generate episode 324 source and registrations
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/324-richard-feynman.html' -o /tmp/324-cs.html
          curl -fsSL 'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/324-richard-feynman.html' -o /tmp/324-sk.html
          node <<'NODE'
          const fs=require('fs');
          const decode=s=>String(s)
            .replace(/<[^>]*>/g,'')
            .replace(/&nbsp;/g,' ')
            .replace(/&amp;/g,'&')
            .replace(/&quot;/g,'"')
            .replace(/&#39;/g,"'")
            .replace(/&lt;/g,'<')
            .replace(/&gt;/g,'>')
            .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n)))
            .replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)))
            .trim();
          function parse(file){
            const html=fs.readFileSync(file,'utf8');
            const out=[];
            const re=/<section\s+class="faq"\s+data-time="([^"]+)"[^>]*><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            return out;
          }
          const cs=parse('/tmp/324-cs.html');
          const sk=parse('/tmp/324-sk.html');
          if(!cs.length||cs.length!==sk.length)throw new Error(`CZ/SK section count mismatch: ${cs.length}/${sk.length}`);
          for(let i=0;i<cs.length;i++){
            if(cs[i].time!==sk[i].time)throw new Error(`CZ/SK time mismatch at ${i}: ${cs[i].time}/${sk[i].time}`);
            if(!cs[i].title||!sk[i].title||!cs[i].points.length||!sk[i].points.length)throw new Error(`Incomplete item ${i}`);
          }
          fs.writeFileSync('episode-324-summary.js',`const DATA=${JSON.stringify({cs,sk})};\n`);
          const augmenterPath='tools/augment-v2-extra-nonquestions.mjs';
          let augmenter=fs.readFileSync(augmenterPath,'utf8');
          augmenter=augmenter.replace(/const EXTRAS=\[([^\]]*)\];/,(_,body)=>{
            const values=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            if(!values.includes(324))values.push(324);
            values.sort((a,b)=>a-b);
            return `const EXTRAS=[${values.join(',')}];`;
          });
          fs.writeFileSync(augmenterPath,augmenter);
          const testPath='tools/test-content-v2.mjs';
          let test=fs.readFileSync(testPath,'utf8');
          test=test.replace(/for\(const n of \[([^\]]+)\]\)\{/,(_,body)=>{
            const values=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            if(!values.includes(324))values.push(324);
            values.sort((a,b)=>a-b);
            return `for(const n of [${values.join(',')}]){`;
          });
          fs.writeFileSync(testPath,test);
          console.log(JSON.stringify({episode:324,cs:cs.length,sk:sk.length,first:cs[0].time,last:cs.at(-1).time}));
          NODE

      - name: Build V2 content
        run: |
          BASE_SIZE=$(wc -c < content-v2.json)
          echo "BASE_SIZE=$BASE_SIZE" >> "$GITHUB_ENV"
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          echo "APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
          echo "INDEX_SHA=$INDEX_SHA" >> "$GITHUB_ENV"
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs

      - name: Verify episode payload and runtime stability
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const x=d.nonquestions?.episodes?.['324'];
          if(!x||!x.cs?.length||x.cs.length!==x.sk?.length)throw new Error('Episode 324 missing or incomplete');
          for(let i=0;i<x.cs.length;i++)if(x.cs[i].time!==x.sk[i].time)throw new Error(`time mismatch ${i}`);
          console.log(JSON.stringify({ok:true,episode:324,cs:x.cs.length,sk:x.sk.length,first:x.cs[0].time,last:x.cs.at(-1).time}));
          NODE
          test "$(sha256sum app-v2.js | cut -d' ' -f1)" = "$APP_SHA"
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$INDEX_SHA"
          NEW_SIZE=$(wc -c < content-v2.json)
          DELTA=$((NEW_SIZE-BASE_SIZE))
          echo "content-v2 size: $BASE_SIZE -> $NEW_SIZE (delta $DELTA)"
          test "$DELTA" -gt 0
          test "$DELTA" -lt 100000
          echo "SIZE_DELTA=$DELTA" >> "$GITHUB_ENV"

      - name: Run required tests except approved obsolete episode-experience test
        run: |
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          echo 'Skipping tools/test-v2-episode-experience.mjs by explicit user approval.'
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs

      - name: Commit verified episode 324 files
        run: |
          rm -f v2.html package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-324-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          git diff --cached --stat
          git commit -m 'Add bilingual summary for episode 324 [skip ci]'
          git push origin HEAD:chatgpt/episode-324-summary
          echo "Verified content-v2 delta: $SIZE_DELTA bytes"
