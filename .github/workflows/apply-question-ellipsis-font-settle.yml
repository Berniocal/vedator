name: Dočasné ověření výpustky při změně sazby

on:
  push:
    branches: [fix/question-answer-ellipsis-position]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sledovat změny sazby pouze u vyrenderovaných odpovědí
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v2.js')
          s=p.read_text(encoding='utf-8')
          old="""  function queueQuestionMoreCheck(view){
            requestAnimationFrame(()=>{const root=view==='questions'?$('#questions-v2'):$('#nonquestions-v2');root?.querySelectorAll('.question-card').forEach(card=>{const answer=card.querySelector('.question-answer'),button=card.querySelector('.question-more');if(!answer||!button)return;const open=card.classList.contains('open'),marker=answer.querySelector('.question-ellipsis-v2');if(marker)marker.hidden=true;const clipped=!open&&answer.scrollHeight>answer.clientHeight+2;button.classList.toggle('hidden',!open&&!clipped);placeQuestionEllipsis(answer,clipped)})});
          }
          let questionEllipsisResizeFrame=0;
          window.addEventListener('resize',()=>{if(state.view!=='questions'&&state.view!=='nonquestions')return;if(questionEllipsisResizeFrame)cancelAnimationFrame(questionEllipsisResizeFrame);questionEllipsisResizeFrame=requestAnimationFrame(()=>{questionEllipsisResizeFrame=0;queueQuestionMoreCheck(state.view)})},{passive:true});
          """
          new="""  let questionEllipsisLayoutFrame=0,questionEllipsisObservedRoot=null;
          const questionEllipsisObservedNodes=new Set();
          const questionEllipsisLayoutObserver=typeof ResizeObserver==='function'?new ResizeObserver(()=>{
            if(state.view!=='questions'&&state.view!=='nonquestions'||questionEllipsisLayoutFrame)return;
            questionEllipsisLayoutFrame=requestAnimationFrame(()=>{questionEllipsisLayoutFrame=0;queueQuestionMoreCheck(state.view)});
          }):null;
          function syncQuestionEllipsisLayoutObserver(root){
            if(!questionEllipsisLayoutObserver||!root)return;
            if(questionEllipsisObservedRoot!==root){questionEllipsisLayoutObserver.disconnect();questionEllipsisObservedNodes.clear();questionEllipsisObservedRoot=root}
            for(const node of [...questionEllipsisObservedNodes])if(!node.isConnected||!root.contains(node)){questionEllipsisLayoutObserver.unobserve(node);questionEllipsisObservedNodes.delete(node)}
            root.querySelectorAll('.question-answer>ul').forEach(node=>{if(questionEllipsisObservedNodes.has(node))return;questionEllipsisObservedNodes.add(node);questionEllipsisLayoutObserver.observe(node)});
          }
          function queueQuestionMoreCheck(view){
            requestAnimationFrame(()=>{const root=view==='questions'?$('#questions-v2'):$('#nonquestions-v2');if(!root)return;root.querySelectorAll('.question-card').forEach(card=>{const answer=card.querySelector('.question-answer'),button=card.querySelector('.question-more');if(!answer||!button)return;const open=card.classList.contains('open'),marker=answer.querySelector('.question-ellipsis-v2');if(marker)marker.hidden=true;const clipped=!open&&answer.scrollHeight>answer.clientHeight+2;button.classList.toggle('hidden',!open&&!clipped);placeQuestionEllipsis(answer,clipped)});syncQuestionEllipsisLayoutObserver(root)});
          }
          let questionEllipsisResizeFrame=0;
          window.addEventListener('resize',()=>{if(state.view!=='questions'&&state.view!=='nonquestions')return;if(questionEllipsisResizeFrame)cancelAnimationFrame(questionEllipsisResizeFrame);questionEllipsisResizeFrame=requestAnimationFrame(()=>{questionEllipsisResizeFrame=0;queueQuestionMoreCheck(state.view)})},{passive:true});
          """
          if old in s:
              s=s.replace(old,new,1)
          elif 'const questionEllipsisLayoutObserver=' not in s:
              raise SystemExit('queueQuestionMoreCheck pattern not found')
          p.write_text(s,encoding='utf-8')
          PY
      - run: node --check app-v2.js
      - run: npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24
      - run: |
          cp index.html v2.html
          node tools/test-v2-question-experience.mjs
          rm v2.html
      - run: node tools/test-v2-question-ellipsis-position.mjs
      - run: node tools/test-v2-mobile-browser.mjs
      - name: Commitnout jen ověřenou změnu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Přepočítat výpustku při změně sazby odpovědi'
          git push
