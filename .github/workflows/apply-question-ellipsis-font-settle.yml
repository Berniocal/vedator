name: Dočasné dosazení výpustky po fontech

on:
  push:
    branches: [fix/question-answer-ellipsis-position]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doplnit přepočet po finálním načtení fontů
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v2.js')
          s=p.read_text(encoding='utf-8')
          old="  function parityTypeset(root){const refresh=()=>{const view=root?.id==='questions-v2'?'questions':root?.id==='nonquestions-v2'?'nonquestions':'';if(view)queueQuestionMoreCheck(view)};if(window.MathJax?.typesetPromise)return window.MathJax.typesetPromise([root]).then(refresh,()=>{});refresh();return Promise.resolve()}"
          new="  function parityTypeset(root){const refresh=()=>{const view=root?.id==='questions-v2'?'questions':root?.id==='nonquestions-v2'?'nonquestions':'';if(view)queueQuestionMoreCheck(view)},settle=()=>{refresh();const fonts=document.fonts?.ready;if(fonts&&typeof fonts.then==='function')fonts.then(refresh).catch(()=>{})};if(window.MathJax?.typesetPromise)return window.MathJax.typesetPromise([root]).then(settle,()=>{});settle();return Promise.resolve()}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('parityTypeset pattern not found')
          p.write_text(s,encoding='utf-8')
          PY
      - run: node --check app-v2.js
      - run: npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24
      - run: |
          cp index.html v2.html
          node tools/test-v2-question-experience.mjs
          rm v2.html
      - run: node tools/test-v2-question-ellipsis-position.mjs
      - run: node tools/test-v2-mobile-browser.mjs
      - name: Commitnout jen ověřenou změnu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Přepočítat výpustku po načtení fontů'
          git push
