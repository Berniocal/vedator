name: TEMP verify episode 233

on:
  push:
    branches: [add-summary-233]

permissions:
  contents: write

concurrency:
  group: temp-verify-233
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact episode 233 summary and validate source
        run: |
          python - <<'PY'
          import json, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.article={}; self.title=[]; self.h1=[]; self.in_title=False; self.in_h1=False
                  self.cur=None; self.in_h2=False; self.in_li=False; self.buf=[]; self.sections=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='article' and 'episode-summary' in a.get('class','').split(): self.article=a
                  elif tag=='title': self.in_title=True; self.buf=[]
                  elif tag=='h1': self.in_h1=True; self.buf=[]
                  elif tag=='section' and 'faq' in a.get('class','').split(): self.cur={'time':a.get('data-time',''),'title':'','points':[]}
                  elif tag=='h2' and self.cur is not None: self.in_h2=True; self.buf=[]
                  elif tag=='li' and self.cur is not None: self.in_li=True; self.buf=[]
              def handle_endtag(self, tag):
                  if tag=='title' and self.in_title: self.title.append(''.join(self.buf).strip()); self.in_title=False; self.buf=[]
                  elif tag=='h1' and self.in_h1: self.h1.append(''.join(self.buf).strip()); self.in_h1=False; self.buf=[]
                  elif tag=='h2' and self.in_h2: self.cur['title']=''.join(self.buf).strip(); self.in_h2=False; self.buf=[]
                  elif tag=='li' and self.in_li: self.cur['points'].append(''.join(self.buf).strip()); self.in_li=False; self.buf=[]
                  elif tag=='section' and self.cur is not None: self.sections.append(self.cur); self.cur=None
              def handle_data(self, data):
                  if self.in_title or self.in_h1 or self.in_h2 or self.in_li: self.buf.append(data)

          def fetch(path):
              url='https://raw.githubusercontent.com/Berniocal/vedator-test/main/'+path
              req=urllib.request.Request(url,headers={'User-Agent':'Vedator-summary-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r: return r.read().decode('utf-8')
          def parse(path,lang):
              p=Parser(); p.feed(fetch(path))
              assert p.article.get('data-episode')=='233', (path,p.article)
              assert p.article.get('data-lang')==lang, (path,p.article)
              assert p.title and '233' in p.title[0] and p.h1 and '233' in p.h1[0]
              assert len(p.sections)==23, (path,len(p.sections))
              for s in p.sections:
                  assert s['time'] and s['title'] and 3 <= len(s['points']) <= 4, s
              return p

          cs=parse('shrnuti/cs/233-ako-vieme-ze-zem-je-gulata.html','cs')
          sk=parse('shrnuti/sk/233-ako-vieme-ze-zem-je-gulata.html','sk')
          assert [s['time'] for s in cs.sections]==[s['time'] for s in sk.sections]

          # Simple duplicate guard against immediate neighbours.
          for path in ['shrnuti/cs/232-zapisky-zo-starmusu.html','shrnuti/cs/234-david-eicher-starmus-interview.html']:
              p=Parser(); p.feed(fetch(path))
              assert [(s['time'],s['title']) for s in p.sections] != [(s['time'],s['title']) for s in cs.sections], path

          data={'cs':cs.sections,'sk':sk.sections}
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace(';','\\u003b')
          out='const DATA='+payload+';\n'
          Path('episode-233-summary.js').write_text(out,encoding='utf-8')
          src=Path('episode-233-summary.js').read_text(encoding='utf-8')
          loaded=json.loads(src[len('const DATA='):-2])
          assert loaded==data
          print('Validated episode 233:',len(cs.sections),'CZ +',len(sk.sections),'SK; times 1:1; serialization exact')
          PY
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit generated summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-233-summary.js
          if git diff --cached --quiet; then
            echo 'Episode 233 summary is already exact.'
          else
            git commit -m 'Add episode 233 summary data'
            git push
          fi
