name: Temporary episode-only Sliby rebuild
on:
  push:
    branches:
      - batch/sliby-duplicates-third-20261112
    paths:
      - 'sliby/duplicate-review.json'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/sliby-duplicates-third-20261112
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore original report and reconsolidate episode-only group
        run: |
          git fetch origin main
          git show origin/main:sliby/index.html > sliby/index.html
          node tools/consolidate-sliby.cjs
          node tools/test-sliby-duplicate-batch.cjs
          node tools/test-sliby-duplicate-third-batch.cjs
          node tools/test-sliby-player.cjs
          node tools/test-sliby-personal-state.cjs
          node tools/test-sliby-github-admin.cjs
          git diff --check
      - name: Commit regenerated source report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sliby/index.html
          if git diff --cached --quiet; then
            echo 'Sliby report already up to date.'
          else
            git commit -m 'Keep only reviewed duplicate episode promises'
            git push origin HEAD:batch/sliby-duplicates-third-20261112
          fi
