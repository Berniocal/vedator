# trigger verification
name: TEMP verify episode 221

on:
  push:
    branches: [add-summary-221]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-221
          fetch-depth: 0
      - name: Build canonical episode 221 data
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const get=url=>new Promise((resolve,reject)=>https.get(url,r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>r.statusCode===200?resolve(d):reject(new Error(`${r.statusCode} ${url}`)));}).on('error',reject));
          const decode=s=>s.replace(/<[^>]+>/g,'').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').trim();
          const parse=html=>{
            const ep=html.match(/data-episode="(\d+)"/); if(!ep||Number(ep[1])!==221)throw new Error('Wrong episode metadata');
            const title=decode((html.match(/<h1>([\s\S]*?)<\/h1>/)||[])[1]||''); if(!title.includes('221'))throw new Error('Wrong h1');
            const out=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m; while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            return out;
          };
          (async()=>{
            const base='https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti';
            const [csHtml,skHtml]=await Promise.all([get(`${base}/cs/221-zabije-nas-supernova.html`),get(`${base}/sk/221-zabije-nas-supernova.html`)]);
            const cs=parse(csHtml), sk=parse(skHtml);
            if(cs.length!==8||sk.length!==8)throw new Error(`Expected 8+8 FAQ, got ${cs.length}+${sk.length}`);
            if(cs.map(x=>x.time).join('|')!==sk.map(x=>x.time).join('|'))throw new Error('CZ/SK timestamps differ');
            const data={cs,sk};
            let json=JSON.stringify(data).replace(/;/g,'\\u003b');
            fs.writeFileSync('episode-221-summary.js',`const DATA=${json};\nif(typeof window!==\"undefined\")window.EPISODE_221_SUMMARY=DATA;\nif(typeof module!==\"undefined\")module.exports=DATA;\n`);
            const round=JSON.parse(fs.readFileSync('episode-221-summary.js','utf8').match(/const DATA=(.*);\n/)[1]);
            if(JSON.stringify(round)!==JSON.stringify(data))throw new Error('Serialization round-trip failed');
            let aug=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            if(!/const EXTRAS=\[221,/.test(aug))aug=aug.replace('const EXTRAS=[','const EXTRAS=[221,');
            fs.writeFileSync('tools/augment-v2-extra-nonquestions.mjs',aug);
            let test=fs.readFileSync('tools/test-content-v2.mjs','utf8');
            if(!/for\(const n of \[221,/.test(test))test=test.replace('for(const n of [222,','for(const n of [221,222,');
            fs.writeFileSync('tools/test-content-v2.mjs',test);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node --check episode-221-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-221-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Přidat ověřená data epizody 221'
            git push origin HEAD:add-summary-221
          fi
