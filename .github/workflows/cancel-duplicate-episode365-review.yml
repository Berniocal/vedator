name: Stop duplicate episode 365 audio review
on:
  push:
    branches: [content/episode-365-20261127]
    paths: [.github/workflows/cancel-duplicate-episode365-review.yml]
permissions:
  actions: write
jobs:
  stop-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:46038024460});
