name: Temporary subtitle packaging 190

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-temp-subtitles-190.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record run identifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_RUN_ID" > subtitle-artifact-run-id.txt
          git add subtitle-artifact-run-id.txt
          git commit -m "Record temporary subtitle artifact run [skip ci]"
          git push

      - name: Validate subtitle file
        run: test -s vedatorsky-podcast-190-faq-dobre-otazky-18.srt

      - name: Upload subtitle artifact
        uses: actions/upload-artifact@v4
        with:
          name: vedatorsky-podcast-190-subtitles
          path: vedatorsky-podcast-190-faq-dobre-otazky-18.srt
          if-no-files-found: error
          retention-days: 1
