name: One-time reviewed Sliby duplicate batch
on:
  push:
    branches: [batch/sliby-duplicates-20261112]
    paths:
      - 'sliby/duplicate-review.json'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch/sliby-duplicates-20261112
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only reviewed duplicate groups
        run: |
          node tools/consolidate-sliby.cjs
          node tools/test-sliby-player.cjs
          node tools/test-sliby-personal-state.cjs
          git diff --check
      - name: Commit updated source report to batch branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sliby/index.html
          if git diff --cached --quiet; then
            echo "Report is already consolidated."
          else
            git commit -m 'Consolidate second batch of reviewed promise duplicates'
            git push origin HEAD:batch/sliby-duplicates-20261112
          fi
