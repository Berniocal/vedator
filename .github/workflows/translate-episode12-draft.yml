name: Draft Czech translation of episode 12 for editorial review
on:
  push:
    branches: [captions/episode-12-precise-20261126]
    paths:
      - tools/translate-episode12-draft.py
      - .github/workflows/translate-episode12-draft.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vedator-episode12-czech-draft
  cancel-in-progress: true
jobs:
  translation-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-nllb-600m-episode12-v1
      - name: Install translation model dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 'numpy<2' sentencepiece
      - name: Read completed Slovak ASR from preparation branch
        run: |
          for attempt in $(seq 1 240); do
            git pull --ff-only origin captions/episode-12-precise-20261126
            if test -s captions/source/episode-12-draft.sk.json && test -s captions/source/episode-12-extra-checks.sk.json; then exit 0; fi
            sleep 15
          done
          echo 'Episode 12 source ASR was not available' >&2
          exit 1
      - name: Freeze complete source integrity and review view
        run: python tools/freeze-episode12-source.py
      - name: Create unreviewed Czech translation draft (not publishable)
        run: |
          if ! test -s captions/source/episode-12-translation-draft.cs.json; then python tools/translate-episode12-draft.py; fi
      - name: Flag uncertain audio windows and incomplete Czech translation
        run: python tools/triage-episode12-draft.py
      - name: Store draft for manual language review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-12-*
          if ! git diff --cached --quiet; then
            git commit -m "Add unreviewed Czech translation draft for episode 12"
            git pull --rebase origin captions/episode-12-precise-20261126
            git push origin HEAD:captions/episode-12-precise-20261126
          fi
