name: Verify episode 267

on:
  push:
    branches:
      - automation/episode-267-summary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/episode-267-summary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Generate and verify episode 267
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=267;
          const slug='jurgen-schukraft';
          const sources={
            cs:`https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/${EP}-${slug}.html`,
            sk:`https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/${EP}-${slug}.html`
          };
          function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/\p{M}/gu,'').replace(/[^a-z0-9]+/g,' ').trim()}
          function tokens(s){return new Set(norm(s).split(/\s+/).filter(x=>x.length>2))}
          function jaccard(a,b){const A=tokens(a),B=tokens(b);let i=0;for(const x of A)if(B.has(x))i++;const u=new Set([...A,...B]).size;return u?i/u:0}
          async function load(lang){
            const url=sources[lang];
            const filename=url.split('/').pop();
            if(!filename.startsWith(`${EP}-`))throw new Error(`${lang} filename mismatch: ${filename}`);
            const r=await fetch(url); if(!r.ok)throw new Error(`${lang} source HTTP ${r.status}`);
            const html=await r.text();
            const d=new JSDOM(html).window.document;
            const article=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent.trim()||'';
            const h1=d.querySelector('h1')?.textContent.trim()||'';
            if(!article)throw new Error(`${lang} missing article`);
            if(article.dataset.episode!==String(EP))throw new Error(`${lang} data-episode ${article.dataset.episode}`);
            if(article.dataset.lang!==lang)throw new Error(`${lang} data-lang ${article.dataset.lang}`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `))throw new Error(`${lang} title/h1 number mismatch`);
            if(!title.includes('Jürgen Schukraft')||!h1.includes('Jürgen Schukraft'))throw new Error(`${lang} topic mismatch`);
            const sections=[...article.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim()||'',points:[...s.querySelectorAll('li')].map(li=>li.textContent.trim())}));
            return {sections,title,h1};
          }
          (async()=>{
            const cs=await load('cs'), sk=await load('sk');
            if(cs.sections.length!==sk.sections.length)throw new Error(`CZ/SK count mismatch ${cs.sections.length}/${sk.sections.length}`);
            if(cs.sections.length!==20)throw new Error(`Expected actual 20 sections, got ${cs.sections.length}`);
            const ct=cs.sections.map(x=>x.time), st=sk.sections.map(x=>x.time);
            if(JSON.stringify(ct)!==JSON.stringify(st))throw new Error('CZ/SK times differ');
            if(cs.sections.some(x=>!x.time||!x.title||!x.points.length)||sk.sections.some(x=>!x.time||!x.title||!x.points.length))throw new Error('Incomplete FAQ section');
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep||!ep.title.includes(` ${EP} `)||!ep.title.includes('Jürgen Schukraft'))throw new Error(`Catalog mismatch: ${ep?.title}`);
            const newText=cs.sections.map(x=>x.title+' '+x.points.join(' ')).join(' ');
            for(const file of fs.readdirSync('.').filter(f=>/^episode-\d+-summary\.js$/.test(f))){
              const n=Number(file.match(/^episode-(\d+)/)[1]);
              const text=fs.readFileSync(file,'utf8'); const a=text.indexOf('const DATA='), b=text.indexOf(';',a+11); if(a<0||b<0)continue;
              const data=JSON.parse(text.slice(a+11,b));
              const oldTimes=data.cs?.map(x=>x.time)||[];
              const oldText=(data.cs||[]).map(x=>x.title+' '+(x.points||[]).join(' ')).join(' ');
              const sameTimes=JSON.stringify(oldTimes)===JSON.stringify(ct);
              const sim=jaccard(newText,oldText);
              if(sameTimes&&sim>0.55)throw new Error(`Suspicious duplicate with episode ${n}: similarity ${sim.toFixed(3)}`);
              if(sim>0.82)throw new Error(`Suspicious near-duplicate with episode ${n}: similarity ${sim.toFixed(3)}`);
            }
            const json=JSON.stringify({cs:cs.sections,sk:sk.sections}).replaceAll(';','\\u003b');
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${json};\n`);
            console.log(`Verified episode ${EP}: ${cs.sections.length} CZ + ${sk.sections.length} SK`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Register episode and regression guard
        run: |
          node <<'NODE'
          const fs=require('fs'); const EP=267;
          let p='tools/augment-v2-extra-nonquestions.mjs', s=fs.readFileSync(p,'utf8');
          s=s.replace(/const EXTRAS=\[([^\]]*)\];/,(_,body)=>{const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(!a.includes(EP))a.push(EP);a.sort((x,y)=>x-y);return `const EXTRAS=[${a.join(',')}];`}); fs.writeFileSync(p,s);
          p='tools/test-content-v2.mjs'; s=fs.readFileSync(p,'utf8');
          s=s.replace(/for\(const n of \[([^\]]*)\]\)\{/,(_,body)=>{const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(!a.includes(EP))a.push(EP);a.sort((x,y)=>x-y);return `for(const n of [${a.join(',')}]){`}); fs.writeFileSync(p,s);
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER-BEFORE)); echo "content-v2 growth: $GROWTH"; test "$GROWTH" -gt 0; test "$GROWTH" -lt 150000
          node <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('content-v2.json','utf8')); const e=d.nonquestions?.episodes?.['267'];
          if(!e||e.cs?.length!==20||e.sk?.length!==20)throw new Error('Episode 267 missing/wrong count');
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('267 times differ');
          if(d.nonquestions?.episodes?.['316'])throw new Error('Episode 316 unexpectedly returned');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified episode files only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-267-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Add bilingual summary for episode 267'
          git push
