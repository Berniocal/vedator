name: Verify removal of episode 316 nonquestions

on:
  push:
    branches:
      - chatgpt/remove-episode-316-nonquestions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-episode-316-nonquestions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Remove episode 316 only
        run: |
          test -f episode-316-summary.js
          git rm -- episode-316-summary.js
          node <<'NODE'
          const fs=require('fs');
          let p='tools/augment-v2-extra-nonquestions.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/const EXTRAS=\[([^\]]*)\];/,(_,body)=>{
            const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite).filter(n=>n!==316);
            return `const EXTRAS=[${a.join(',')}];`;
          });
          fs.writeFileSync(p,s);
          p='tools/test-content-v2.mjs';
          s=fs.readFileSync(p,'utf8');
          s=s.replace(/for\(const n of \[([^\]]*)\]\)\{/,(_,body)=>{
            const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite).filter(n=>n!==316);
            return `for(const n of [${a.join(',')}]){`;
          });
          fs.writeFileSync(p,s);
          NODE
      - name: Build V2 and verify precise removal
        run: |
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          if(d.nonquestions?.episodes?.['316']) throw new Error('Episode 316 still exists in nonquestions');
          const e315=d.nonquestions?.episodes?.['315'];
          if(!e315) throw new Error('Episode 315 was accidentally removed');
          if(e315.cs?.length!==18||e315.sk?.length!==18) throw new Error(`Episode 315 changed unexpectedly: ${e315.cs?.length}/${e315.sk?.length}`);
          console.log('Verified: 316 absent, 315 preserved.');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit only the 316 cleanup
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          echo 'Staged files:'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only | grep -qx 'content-v2.json'
          git diff --cached --name-only | grep -qx 'episode-316-summary.js'
          git diff --cached --name-only | grep -qx 'tools/augment-v2-extra-nonquestions.mjs'
          git diff --cached --name-only | grep -qx 'tools/test-content-v2.mjs'
          git commit -m 'Remove duplicate nonquestions for episode 316'
          git push
