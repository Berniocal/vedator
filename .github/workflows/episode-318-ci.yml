name: Episode 318 verification

on:
  push:
    branches:
      - chatgpt/episode-318-summary

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify episode 318 source and V2 build
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('episode-318-summary.js','utf8');
          const marker='const DATA=';
          const start=src.indexOf(marker)+marker.length;
          const end=src.indexOf(';',start);
          if(start<marker.length||end<0)throw new Error('DATA marker missing');
          const data=JSON.parse(src.slice(start,end));
          if(data.cs.length!==18||data.sk.length!==18)throw new Error(`Expected 18/18 sections, got ${data.cs.length}/${data.sk.length}`);
          const cs=data.cs.map(x=>x.time);
          const sk=data.sk.map(x=>x.time);
          if(JSON.stringify(cs)!==JSON.stringify(sk))throw new Error('CZ/SK time mismatch');
          console.log('Episode 318 bilingual source OK:',cs.join(', '));
          NODE
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const ep=data.nonquestions?.episodes?.['318'];
          if(!ep)throw new Error('Episode 318 missing from content-v2.json');
          if(ep.cs.length!==18||ep.sk.length!==18)throw new Error('Episode 318 count mismatch in content-v2.json');
          console.log('Episode 318 present in rebuilt content-v2.json');
          NODE
