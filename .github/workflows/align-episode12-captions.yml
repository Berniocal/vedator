name: Align reviewed episode 12 captions and preserve endpoint evidence
on:
  push:
    branches: [captions/episode-12-precise-20261126]
    paths:
      - tools/audit-episode12-working-alignment.py
      - captions/source/episode-12-working-alignment-input.json
      - tools/check-episode12-editorial-contrasts.py
      - captions/source/episode-12-editorial-contrast-requests.json
      - tools/check-episode12-ctc-endpoints.py
      - tools/rebuild-episode12-captions.py
      - captions/episode-12.edited.json
      - .github/workflows/align-episode12-captions.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vedator-episode12-alignment
  cancel-in-progress: false
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VEDATOR_EP12_AUDIO: /tmp/vedator-ep12-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep12-audio
          key: vedator-original-episode-12-audio-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-episode12-slovak-ctc-v1
      - name: Install established Slovak CTC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 'numpy<2'
      - name: Preserve unforced CTC beginning and ending evidence
        run: python tools/check-episode12-ctc-endpoints.py
      - name: Compare explicitly disputed wordings against original audio
        run: python tools/check-episode12-editorial-contrasts.py
      - name: Audit working source groups without generating release captions
        run: python tools/audit-episode12-working-alignment.py
      - name: Align only a completely reviewed bilingual text
        run: |
          if test -s captions/episode-12.edited.json; then
            python tools/rebuild-episode12-captions.py
          fi
      - name: Save actual acoustic results without registering unfinished captions
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-12-* audio-seek-index.json
          if test -s captions/episode-12.json; then git add captions/episode-12*; fi
          if ! git diff --cached --quiet; then
            git commit -m "Preserve actual episode 12 acoustic evidence or reviewed alignment results"
            saved=0
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then saved=1; break; fi
            done
            test "$saved" = 1
          fi
