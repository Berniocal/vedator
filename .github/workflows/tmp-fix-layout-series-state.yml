name: Temporary layout and series state fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch layout and series state
        run: node tools/tmp-layout-series-state-patch.mjs

      - name: Verify patch
        shell: bash
        run: |
          node --check app-v2.js
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('app-v2.js','utf8');
          const required=[
            'V2_LAYOUT_SERIES_STATE_FIX_V1',
            'seriesProgressInfo=seriesCollectionProgressInfoV2',
            'const collection=finalSeriesCollection(series)||{}',
            'const started=Boolean(collection.lastItemId)||heard>0',
            'body.player-collapsed-v2 #back-top-v2',
            'max-width:50vw!important',
            'flex-wrap:nowrap!important'
          ];
          for(const value of required)if(!source.includes(value))throw new Error('Missing expected fragment: '+value);
          const block=source.slice(source.indexOf('/* V2_LAYOUT_SERIES_STATE_FIX_V1 */'));
          if(block.includes('state.progress[episodeKey'))throw new Error('Series state override must not use global episode progress');
          console.log('Layout and series-state static checks passed.');
          NODE
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          git commit -m 'Fix compact sort row and series listening state'
          git push origin HEAD:main
