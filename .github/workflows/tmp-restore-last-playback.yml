name: Temporary last playback restore

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch last playback restore
        run: node tools/tmp-restore-last-playback.mjs

      - name: Verify patch
        shell: bash
        run: |
          node --check app-v2.js
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('app-v2.js','utf8');
          const required=[
            "const LAST_PLAYBACK_KEY='vedatorLastPlaybackV1'",
            'autoplay=true',
            'rebuildLastPlaybackContext',
            "if(type==='series')",
            'seriesContext(series,0)',
            "if(type==='playlist')",
            'playlistContext(playlist,0)',
            "['episodes','questions','nonquestions'].includes(type)",
            'autoplay:false',
            'legacyVisualSetPlayerCollapsed(true)',
            "window.addEventListener('vedator-v2-ready'"
          ];
          for(const value of required)if(!source.includes(value))throw new Error('Missing expected fragment: '+value);
          const core=source.slice(source.indexOf('async function openPlayback'),source.indexOf('function closePlayer'));
          if((core.match(/if\(autoplay\)audio\.play\(\)/g)||[]).length!==2)throw new Error('Core autoplay calls are not both guarded');
          console.log('Last playback restore static checks passed.');
          NODE
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          git commit -m 'Restore last playback context on startup'
          git push origin HEAD:main
