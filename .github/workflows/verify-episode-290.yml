name: Verify episode 290

on:
  push:
    branches:
      - chatgpt/episode-290-summary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/episode-290-summary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Generate episode 290 from canonical sources
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=290;
          const sources={
            cs:{path:'shrnuti/cs/290-najsilnejsi-gama-zablesk.html',url:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/290-najsilnejsi-gama-zablesk.html'},
            sk:{path:'shrnuti/sk/290-najsilnejsi-gama-zablesk.html',url:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/290-najsilnejsi-gama-zablesk.html'}
          };
          async function load(lang){
            const src=sources[lang];
            const base=src.path.split('/').pop();
            if(!base.startsWith(`${EP}-`))throw new Error(`${lang} filename mismatch: ${base}`);
            const r=await fetch(src.url);
            if(!r.ok)throw new Error(`${lang} source HTTP ${r.status}`);
            const html=await r.text();
            const d=new JSDOM(html).window.document;
            const article=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent?.trim()||'';
            const h1=d.querySelector('h1')?.textContent?.trim()||'';
            if(!article)throw new Error(`Missing ${lang} article`);
            if(article.dataset.episode!==String(EP))throw new Error(`${lang} data-episode mismatch: ${article.dataset.episode}`);
            if(article.dataset.lang!==lang)throw new Error(`${lang} data-lang mismatch: ${article.dataset.lang}`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `))throw new Error(`${lang} title/h1 number mismatch`);
            if(!title.includes('Najsilnejší gama záblesk')||!h1.includes('Najsilnejší gama záblesk'))throw new Error(`${lang} topic mismatch`);
            const sections=[...article.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim(),points:[...s.querySelectorAll('li')].map(li=>li.textContent.trim())}));
            return {sections};
          }
          (async()=>{
            const cs=await load('cs'), sk=await load('sk');
            if(cs.sections.length!==14||sk.sections.length!==14)throw new Error(`Expected actual 14/14 sections, got ${cs.sections.length}/${sk.sections.length}`);
            const cst=cs.sections.map(x=>x.time), skt=sk.sections.map(x=>x.time);
            if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK times differ: ${cst} vs ${skt}`);
            if(cs.sections.some(x=>!x.time||!x.title||!x.points.length)||sk.sections.some(x=>!x.time||!x.title||!x.points.length))throw new Error('Incomplete section found');
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep)throw new Error(`Episode ${EP} missing from production catalog`);
            if(!ep.title.includes(` ${EP} `)||!ep.title.includes('Najsilnejší gama záblesk'))throw new Error(`Production catalog mismatch: ${ep.title}`);
            const extrasText=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            const m=extrasText.match(/const EXTRAS=\[([^\]]*)\]/);
            const extras=(m?.[1]||'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            for(const n of extras){
              const p=`episode-${n}-summary.js`;
              if(!fs.existsSync(p))continue;
              const t=fs.readFileSync(p,'utf8');
              const a=t.indexOf('const DATA='), b=t.indexOf(';',a+11);
              if(a<0||b<0)continue;
              const data=JSON.parse(t.slice(a+11,b));
              const sameTimes=JSON.stringify(data.cs?.map(x=>x.time))===JSON.stringify(cst);
              const sameTitles=JSON.stringify(data.cs?.map(x=>x.title))===JSON.stringify(cs.sections.map(x=>x.title));
              if(sameTimes&&sameTitles)throw new Error(`Episode ${EP} duplicates existing episode ${n}`);
            }
            const json=JSON.stringify({cs:cs.sections,sk:sk.sections}).replaceAll(';','\\u003b');
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${json};\n`);
            console.log(`Verified ${EP}: ${cs.sections.length} CZ + ${sk.sections.length} SK`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Register episode 290
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const p of ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']){
            let s=fs.readFileSync(p,'utf8');
            if(p.includes('augment')){
              s=s.replace(/const EXTRAS=\[([^\]]*)\];/,(_,body)=>{const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(!a.includes(290))a.push(290);a.sort((x,y)=>x-y);return `const EXTRAS=[${a.join(',')}];`;});
            }else{
              s=s.replace(/for\(const n of \[([^\]]*)\]\)\{/,(_,body)=>{const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(!a.includes(290))a.push(290);a.sort((x,y)=>x-y);return `for(const n of [${a.join(',')}]){`;});
            }
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE_SIZE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER_SIZE=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER_SIZE-BEFORE_SIZE))
          echo "content-v2 growth: $GROWTH bytes"
          test "$GROWTH" -gt 0
          test "$GROWTH" -lt 120000
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const e=d.nonquestions?.episodes?.['290'];
          if(!e)throw new Error('Episode 290 missing in content-v2');
          if(e.cs?.length!==14||e.sk?.length!==14)throw new Error(`Unexpected 290 counts ${e.cs?.length}/${e.sk?.length}`);
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('290 CZ/SK times differ in content-v2');
          if(d.nonquestions?.episodes?.['316'])throw new Error('Episode 316 unexpectedly returned');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified episode files only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-290-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only
          git commit -m 'Add bilingual summary for episode 290'
          git push
