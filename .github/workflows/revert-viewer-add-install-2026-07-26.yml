name: Vrátit externí odkazy a přidat instalaci

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-viewer-add-install-2026-07-26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upravit PWA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          css_marker = "header{background:linear-gradient(135deg,#151b2f,#32256c);color:#fff;padding:28px 18px 24px}.wrap{max-width:1050px;margin:auto}"
          css_replacement = css_marker + ".header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.install-app{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;white-space:nowrap}.install-app:hover{background:rgba(255,255,255,.22)}.install-app.hidden{display:none!important}"
          if '.install-app{' not in text:
              if css_marker not in text:
                  raise SystemExit('CSS marker nebyl nalezen')
              text = text.replace(css_marker, css_replacement, 1)

          mobile_marker = "@media(max-width:550px){.controls{grid-template-columns:1fr}.refresh{padding:12px}.meta{align-items:flex-start;flex-direction:column}.series-list{grid-template-columns:1fr}}"
          mobile_replacement = "@media(max-width:550px){.controls{grid-template-columns:1fr}.refresh{padding:12px}.meta{align-items:flex-start;flex-direction:column}.series-list{grid-template-columns:1fr}.header-row{align-items:center}.install-app{padding:9px 11px;font-size:.9rem}h1{max-width:13ch}}"
          if mobile_marker in text:
              text = text.replace(mobile_marker, mobile_replacement, 1)

          old_header = '<header><div class="wrap"><div class="eyebrow">Neoficiální tematický katalog</div><h1>Vedátorský podcast podle témat</h1></div></header>'
          new_header = '<header><div class="wrap header-row"><div><div class="eyebrow">Neoficiální tematický katalog</div><h1>Vedátorský podcast podle témat</h1></div><button id="installApp" class="install-app hidden" type="button">Instalovat</button></div></header>'
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif 'id="installApp"' not in text:
              raise SystemExit('Hlavička nebyla nalezena')

          old_tail = "document.querySelector('#search').addEventListener('input',render);document.querySelector('#episodeSort').addEventListener('change',render);document.querySelector('#seriesSort').addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',load);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();"
          install_js = """document.querySelector('#search').addEventListener('input',render);document.querySelector('#episodeSort').addEventListener('change',render);document.querySelector('#seriesSort').addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',load);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
          const installButton=document.querySelector('#installApp');
          let deferredInstallPrompt=null;
          const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
          function updateInstallButton(){installButton.classList.toggle('hidden',isInstalled())}
          window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallButton()});
          window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.classList.add('hidden')});
          installButton.addEventListener('click',async()=>{if(isInstalled()){installButton.classList.add('hidden');return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;updateInstallButton();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);alert(ios?'V Safari klepněte na Sdílet a potom na Přidat na plochu.':'Instalaci otevřete v nabídce prohlížeče a zvolte Instalovat aplikaci nebo Přidat na plochu.')});
          updateInstallButton();
          if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();"""
          if 'deferredInstallPrompt' not in text:
              if old_tail not in text:
                  raise SystemExit('JS konec nebyl nalezen')
              text = text.replace(old_tail, install_js, 1)

          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw.write_text("""const CACHE='vedator-temata-v21';
          const ASSETS=['./','index.html','manifest.webmanifest','icon.svg'];
          self.addEventListener('install',event=>{self.skipWaiting();event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(ASSETS)))});
          self.addEventListener('activate',event=>{event.waitUntil((async()=>{await Promise.all((await caches.keys()).filter(key=>key!==CACHE).map(key=>caches.delete(key)));await self.clients.claim()})())});
          self.addEventListener('fetch',event=>{
           if(event.request.method!=='GET')return;
           const url=new URL(event.request.url);
           const networkFirst=event.request.mode==='navigate'||url.pathname.endsWith('/index.html')||url.pathname.endsWith('/episodes.json');
           if(networkFirst){event.respondWith(fetch(event.request,{cache:'no-store'}).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response}).catch(()=>caches.match(event.request).then(cached=>cached||caches.match('./'))));return}
           event.respondWith(caches.match(event.request).then(cached=>cached||fetch(event.request).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response})));
          });
          """, encoding='utf-8')

          for filename in ('inapp.css','inapp.js'):
              p=Path(filename)
              if p.exists():
                  p.unlink()
          PY
      - name: Commitnout změny
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vrátit externí odkazy a přidat instalaci"
          git push
