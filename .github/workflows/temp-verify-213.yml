name: Temp verify episode 213

on:
  push:
    branches: [add-summary-213]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical CZ/SK source and serialization
        run: |
          node <<'NODE'
          const fs=require('fs');
          const urls={
            cs:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/213-nobelove-ceny-2023.html',
            sk:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/213-nobelove-ceny-2023.html'
          };
          const expectedTimes=['03:22','06:29','08:02','11:31','13:16','13:53','15:01','17:43'];
          const decode=s=>s.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          function parse(html,lang){
            if(!html.includes('data-episode="213"')) throw new Error(`${lang}: wrong data-episode`);
            if(!new RegExp(`<title>[^<]*213[^<]*</title>`).test(html)) throw new Error(`${lang}: title mismatch`);
            if(!new RegExp(`<h1>[^<]*213[^<]*</h1>`).test(html)) throw new Error(`${lang}: h1 mismatch`);
            const sections=[...html.matchAll(/<section class="faq" data-time="([^"]+)"><h2>(.*?)<\/h2><ul>(.*?)<\/ul><\/section>/gs)].map(m=>({
              time:m[1],title:decode(m[2]),points:[...m[3].matchAll(/<li>(.*?)<\/li>/gs)].map(x=>decode(x[1]))
            }));
            if(sections.length!==8) throw new Error(`${lang}: expected 8 FAQ, got ${sections.length}`);
            if(JSON.stringify(sections.map(x=>x.time))!==JSON.stringify(expectedTimes)) throw new Error(`${lang}: timestamp mismatch`);
            return sections;
          }
          (async()=>{
            const html={};
            for(const lang of ['cs','sk']){
              const r=await fetch(urls[lang]); if(!r.ok)throw new Error(`${lang}: source HTTP ${r.status}`); html[lang]=await r.text();
            }
            const canonical={cs:parse(html.cs,'cs'),sk:parse(html.sk,'sk')};
            const source=fs.readFileSync('episode-213-summary.js','utf8');
            const marker='const DATA='; const start=source.indexOf(marker)+marker.length; const end=source.indexOf(';',start);
            const data=JSON.parse(source.slice(start,end));
            if(JSON.stringify(data)!==JSON.stringify(canonical)) throw new Error('episode-213-summary.js differs from canonical HTML');
            console.log('Canonical round-trip OK: 8 CZ + 8 SK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run relevant V2 build and tests
        run: |
          node --check app-v2.js
          node --check episode-213-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html

      - name: Record successful verification in target files
        run: |
          marker='// temp-verify-213: passed'
          if grep -Fq "$marker" episode-213-summary.js; then
            echo 'Verification marker already present; nothing to commit.'
            exit 0
          fi
          printf '\n%s\n' "$marker" >> episode-213-summary.js
          printf '\n%s\n' "$marker" >> tools/augment-v2-extra-nonquestions.mjs
          printf '\n%s\n' "$marker" >> tools/test-content-v2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-213-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git commit -m 'Ověření epizody 213 prošlo'
          git push
