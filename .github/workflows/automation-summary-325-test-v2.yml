name: Test episode 325 summary integration v2

on:
  push:
    branches:
      - automation/summary-325-test

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/summary-325-test

      - name: Generate bilingual static summary source
        run: |
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/325-posledna-sanca.html -o /tmp/325-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/325-posledna-sanca.html -o /tmp/325-sk.html
          node <<'NODE'
          const fs=require('fs');
          const decode=s=>String(s).replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/\s+/g,' ').trim();
          function parse(file){
            const html=fs.readFileSync(file,'utf8'),out=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1].replace(/<[^>]+>/g,' ')));
              out.push({time:m[1],title:decode(m[2].replace(/<[^>]+>/g,' ')),points});
            }
            if(!out.length||out.some(x=>!x.time||!x.title||x.points.length<3))throw new Error(`${file}: invalid summary data`);
            return out;
          }
          const DATA={cs:parse('/tmp/325-cs.html'),sk:parse('/tmp/325-sk.html')};
          if(DATA.cs.length!==DATA.sk.length)throw new Error(`CZ/SK count mismatch ${DATA.cs.length}/${DATA.sk.length}`);
          DATA.cs.forEach((x,i)=>{if(x.time!==DATA.sk[i].time)throw new Error(`CZ/SK time mismatch ${i}`)});
          console.log(`Parsed ${DATA.cs.length} paired summary sections.`);
          fs.writeFileSync('episode-325-summary.js',`(()=>{\n  if(window.__vedatorEpisode325Summary)return;\n  window.__vedatorEpisode325Summary=true;\n  const DATA=${JSON.stringify(DATA)};\n})();\n`);
          NODE

      - name: Register episode in build and regression test
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(path,from,to){const s=fs.readFileSync(path,'utf8');if(!s.includes(from))throw new Error(`${path}: marker missing`);fs.writeFileSync(path,s.replace(from,to));}
          patch('tools/build-content-v2.mjs','const EXTRA_NONQUESTION_EPISODES=[331,333,334,335,336,338,339,341,342,344,345,347];','const EXTRA_NONQUESTION_EPISODES=[331,333,334,335,336,338,339,341,342,344,345,347,325];');
          patch('tools/test-content-v2.mjs','for(const n of [334,335,336,338,339,341,342,343,344,345,347]){','for(const n of [334,335,336,338,339,341,342,343,344,345,347,325]){');
          NODE

      - name: Build V2 content
        run: |
          BEFORE=$(wc -c < content-v2.json)
          node tools/build-content-v2.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER=$(wc -c < content-v2.json)
          GROWTH=$((AFTER-BEFORE))
          echo "content-v2 growth: $GROWTH bytes"
          test "$GROWTH" -gt 5000
          test "$GROWTH" -lt 100000

      - name: Install test dependencies
        run: npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24

      - name: Prepare current production entrypoint for legacy-named tests
        run: cp index.html v2.html

      - name: Run required V2 tests
        run: |
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-episode-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs

      - name: Verify runtime surface unchanged
        run: |
          rm -f v2.html
          git diff --exit-code HEAD -- app-v2.js index.html sw.js episode-translations-loader.js
          CHANGED=$(git diff --name-only HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '(^|/)(app-v2\.js|index\.html|sw\.js|episode-translations-loader\.js)$'; then exit 1; fi

      - name: Commit tested result only to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/automation-summary-325-test.yml .github/workflows/automation-summary-325-test-v2.yml
          git add -- episode-325-summary.js tools/build-content-v2.mjs tools/test-content-v2.mjs content-v2.json
          git commit -m 'Prepare tested episode 325 summary'
          git push origin HEAD:automation/summary-325-test
