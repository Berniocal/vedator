name: Prepare episode 364 content and promises
on:
  push:
    branches: [captions/episode-364-20261119]
    paths: [.github/workflows/prepare-episode364-content.yml, tools/update-episode364-promises.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add the reviewed public findings without duplicating a completed pass
        run: |
          python tools/update-episode364-promises.py
          node tools/consolidate-sliby.cjs
          node tools/test-sliby-content-scope.cjs
          node tools/test-sliby-episode-scope.cjs
          node tools/test-sliby-player.cjs
          node tools/test-sliby-personal-state.cjs
          node tools/test-sliby-embedded-sort.cjs
          node tools/test-sliby-duplicate-batch.cjs
          node tools/test-sliby-duplicate-third-batch.cjs
          node tools/test-sliby-github-admin.cjs
      - name: Preserve the source findings only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sliby/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add four public findings and five mentions from complete episode 364 transcript'
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            done
            exit 1
          fi
