name: Sliby one-off safe deduplication 20261112
on:
  push:
    branches:
      - sliby-konsolidace-ostatni-20261112-4
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify conservative consolidation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='sliby/index.html';
          const reviewPath='sliby/duplicate-review.json';
          const html=fs.readFileSync(path,'utf8');
          const re=/(<script type="application\/json" id="audit-data">)([\s\S]*?)(<\/script>)/;
          const m=html.match(re);if(!m)throw Error('Missing embedded sliby JSON');
          const d=JSON.parse(m[2]),r=JSON.parse(fs.readFileSync(reviewPath,'utf8'));
          if(d.findings.length!==917||d.sections.options[0].count!==328||d.sections.options[1].count!==589||d.consolidation.originalFindings!==1052)throw Error('Baseline changed; refusing update');
          const original=d.findings.flatMap(x=>(x.mergedFrom?.length?x.mergedFrom:[x]).map(y=>JSON.stringify([y.candidate,y.tema,y.sourceURL,y.time])));
          const groups=[
          {head:303,members:[303,1292],title:'Další živé natáčení mimo Bratislavu v roce 2023',note:'Díly 166 a 174 znovu avizují další živé nahrávání mimo Bratislavu v roce 2023. Uskutečnění potvrzuje díl 194 z Popradu. Starší obecná podmíněná možnost vystupovat mimo Bratislavu z dílu 128 ani jednotlivé logistické sliby konkrétní popradské akce se nepřipojují.'},
          {head:1408,members:[1408,1499,1566],title:'Zajistit, aby se otázky zaslané aplikací neztratily',note:'Díly 219, 248 a 272 opakují záruku, že otázky zaslané aplikací zůstanou uchované. Nejde o závazek zodpovědět všechny otázky nebo je všechny zařadit do FAQ. Úplnost uchování všech podání není nezávisle ověřena.'},
          {head:1493,members:[1493,1517],title:'Oznámit podrobnosti chystaného živého natáčení v roce 2024',note:'V dílech 245 a 254 je opakován závazek předem oznámit podrobnosti chystaného živého natáčení v roce 2024. V dílu 261 je ohlášen odklad akce; tím se nedokládá předchozí včasné sdělení detailů. Samotné uspořádání akce zůstává samostatným závazkem.'}
          ];
          for(const g of groups){if(r.exclusions.some(x=>x.members?.length===g.members.length&&x.members.every(n=>g.members.includes(n))))throw Error('Pair previously excluded');}
          const removed=new Set();
          for(const g of groups){
           const members=g.members.map(id=>d.findings.find(x=>x.candidate===id));
           if(members.some(x=>!x||x.mergedFrom?.length||x.section!=='other')||new Set(members.map(x=>x.stav)).size!==1)throw Error('Invalid merge '+g.head);
           const main=members[0];if(main.candidate!==g.head)throw Error('Bad primary');
           const memberKeys=members.map(x=>JSON.stringify([x.candidate,x.tema]));
           main.mergedFrom=members.map(x=>JSON.parse(JSON.stringify(x)));
           main.displayTema=g.title;
           main.mergeNote=g.note;
           const targets=new Map();
           for(const x of members)for(const t of x.targets||[]){
             const key=String(t.number)+'|'+String(t.date);
             if(!targets.has(key))targets.set(key,JSON.parse(JSON.stringify(t)));
             else {
               const dst=targets.get(key),existing=new Set((dst.evidence||[]).map(e=>JSON.stringify(e)));
               for(const ev of t.evidence||[]){const sig=JSON.stringify(ev);if(!existing.has(sig)){dst.evidence=(dst.evidence||[]).concat([ev]);existing.add(sig)}}
             }
           }
           main.targets=[...targets.values()];
           for(const x of members.slice(1))removed.add(x.candidate);
           d.consolidation.groups.push({candidate:g.head,members:g.members,memberKeys,title:g.title});
           r.groups.push({batch:'2026-11-12-4',members:g.members,title:g.title,note:g.note});
          }
          d.findings=d.findings.filter(x=>!removed.has(x.candidate));
          d.findings.forEach((x,i)=>x.index=i+1);
          d.sections.options.forEach(x=>x.count=d.findings.filter(y=>y.section===x.id).length);
          d.sections.review.reviewedFindings=d.findings.length;
          d.classification.categoryCounts=Object.fromEntries(d.classification.categories.map(k=>[k,d.findings.filter(x=>x.kategorie===k).length]));
          d.classification.statusCounts=Object.fromEntries(d.classification.statuses.map(k=>[k,d.findings.filter(x=>x.stav===k).length]));
          d.consolidation.date='2026-11-12';
          d.consolidation.uniqueFindings=d.findings.length;
          const scope='Čtvrtá konzervativní kontrola: u témat epizod nebyl nalezen další bezpečný pár; u ostatních slibů sjednoceny tři konkrétní opakované závazky, bez propojování výslovně odlišných příslibů.';
          d.consolidation.latestBatch={date:'2026-11-12',groups:groups.length,scope,reviewFile:reviewPath};
          r.scope=scope;r.batchId='2026-11-12-4';
          const after=d.findings.flatMap(x=>(x.mergedFrom?.length?x.mergedFrom:[x]).map(y=>JSON.stringify([y.candidate,y.tema,y.sourceURL,y.time])));
          if(original.length!==1052||after.length!==1052||JSON.stringify(original.sort())!==JSON.stringify(after.sort()))throw Error('Lost or altered original evidence');
          if(d.findings.length!==913||d.sections.options[0].count!==328||d.sections.options[1].count!==585||d.consolidation.groups.length!==69)throw Error('Count validation failed');
          for(const g of groups)if(!d.findings.find(x=>x.candidate===g.head&&x.mergedFrom?.length===g.members.length))throw Error('Group validation failed');
          const updated=html.replace(re,(_,prefix,old,suffix)=>prefix+JSON.stringify(d)+suffix);
          if(updated.slice(0,m.index)!==html.slice(0,m.index)||updated.slice(updated.lastIndexOf('</script>'))!==html.slice(html.lastIndexOf('</script>')))throw Error('Non-data HTML changed');
          fs.writeFileSync(path,updated);
          fs.writeFileSync(reviewPath,JSON.stringify(r,null,2)+'\n');
          console.log('VALIDATED: 328 episodes, 585 other, 913 distinct, 1052 source statements, 69 merge groups');
          NODE
      - name: Commit resulting data and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/sliby-dedupe-oneoff-20261112.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sliby/index.html sliby/duplicate-review.json .github/workflows/sliby-dedupe-oneoff-20261112.yml
          git diff --cached --check
          git commit -m "Sliby: tři opakované ostatní sliby bez ztráty zmínek"
          git push origin HEAD:"$GITHUB_REF_NAME"
