name: TEMP verify episode 223

on:
  push:
    branches: [add-summary-223]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and verify canonical episode 223 data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/223-jak-funguje-internet.html -o /tmp/223-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/223-ako-funguje-internet.html -o /tmp/223-sk.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/222-caroline-herschel.html -o /tmp/222-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/224-klimaticka-zmena-2.html -o /tmp/224-cs.html
          node <<'NODE'
          const fs=require('fs');
          function decode(s){return s.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).trim()}
          function parse(path,lang){
            const html=fs.readFileSync(path,'utf8');
            if(!new RegExp(`data-episode=["']223["']`).test(html))throw new Error(`${lang}: data-episode mismatch`);
            if(!/<title>[^<]*223[^<]*<\/title>/i.test(html)||!/<h1>[^<]*223[^<]*<\/h1>/i.test(html))throw new Error(`${lang}: title/h1 mismatch`);
            const meta=html.match(/data-question-count=["'](\d+)["']/i);
            const out=[];
            const re=/<section\s+class=["']faq["']\s+data-time=["']([^"']+)["'][^>]*>\s*<h2>([\s\S]*?)<\/h2>\s*<ul>([\s\S]*?)<\/ul>\s*<\/section>/gi;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/gi)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            if(out.length!==25)throw new Error(`${lang}: expected real 25 FAQ, got ${out.length}`);
            if(meta&&Number(meta[1])!==out.length)throw new Error(`${lang}: metadata ${meta[1]} != real ${out.length}`);
            if(out.some(x=>!x.time||!x.title||x.points.length<1))throw new Error(`${lang}: incomplete section`);
            return out;
          }
          function parseNeighbor(path){
            const html=fs.readFileSync(path,'utf8'); const out=[]; const re=/<section\s+class=["']faq["']\s+data-time=["']([^"']+)["'][^>]*>\s*<h2>([\s\S]*?)<\/h2>/gi; let m;
            while((m=re.exec(html)))out.push(`${m[1]}|${decode(m[2]).toLowerCase()}`);
            return out.join('\n');
          }
          const cs=parse('/tmp/223-cs.html','cs');
          const sk=parse('/tmp/223-sk.html','sk');
          const cst=cs.map(x=>x.time), skt=sk.map(x=>x.time);
          if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK timestamps differ: ${cst.join(',')} vs ${skt.join(',')}`);
          const signature=cs.map(x=>`${x.time}|${x.title.toLowerCase()}`).join('\n');
          if(signature===parseNeighbor('/tmp/222-cs.html')||signature===parseNeighbor('/tmp/224-cs.html'))throw new Error('Suspicious duplicate of neighboring episode');
          let json=JSON.stringify({cs,sk}).replace(/;/g,'\\u003b');
          fs.writeFileSync('episode-223-summary.js',`const DATA=${json};\n`);
          const round=JSON.parse(json);
          if(JSON.stringify(round)!==JSON.stringify({cs,sk}))throw new Error('Serialization round-trip mismatch');
          for(const file of ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']){
            let s=fs.readFileSync(file,'utf8');
            if(file.includes('augment-')){
              if(!s.includes('const EXTRAS=[224,'))throw new Error('Unexpected EXTRAS registry shape');
              s=s.replace('const EXTRAS=[224,','const EXTRAS=[223,224,');
            } else {
              if(!s.includes('for(const n of [224,'))throw new Error('Unexpected nonquestion test list shape');
              s=s.replace('for(const n of [224,','for(const n of [223,224,');
            }
            fs.writeFileSync(file,s);
          }
          const episodes=JSON.parse(fs.readFileSync('episodes.json','utf8')).episodes||[];
          const ep=episodes.find(x=>Number(x.number)===223);
          if(!ep)throw new Error('Episode 223 missing from production episodes.json');
          console.log(JSON.stringify({episode:223,czechFaq:cs.length,slovakFaq:sk.length,timestamps:cst,title:ep.title},null,2));
          NODE
          node --check app-v2.js
          node --check episode-223-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-223-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Přidat ověřená data epizody 223'
          git push
