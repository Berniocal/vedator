name: TEMP build and verify episode 253

on:
  push:
    branches: [add-summary-253]
    paths:
      - '.github/workflows/temp-build-verify-253.yml'

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-253
      - name: Build exact bilingual summary from canonical HTML
        run: |
          python - <<'PY'
          import json, re, urllib.request, html

          EP=253
          urls={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/253-michal-valko.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/253-michal-valko.html'
          }
          data={}
          times={}
          for lang,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Vedator summary builder'})
            text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')
            if f'data-episode="{EP}"' not in text or f'podcast {EP}' not in text.lower():
              raise SystemExit(f'Episode metadata mismatch in {lang}')
            sections=re.findall(r'<section class="faq" data-time="([^"]+)"><h2>(.*?)</h2><ul>(.*?)</ul></section>',text,re.S)
            rows=[]
            for t,title,ul in sections:
              points=re.findall(r'<li>(.*?)</li>',ul,re.S)
              clean=lambda s: html.unescape(re.sub(r'<[^>]+>','',s)).strip()
              rows.append({'time':t,'title':clean(title),'points':[clean(p) for p in points]})
            data[lang]=rows
            times[lang]=[r['time'] for r in rows]
          if len(data['cs'])!=18 or len(data['sk'])!=18:
            raise SystemExit(f'Expected 18+18 sections, got {len(data["cs"])}+{len(data["sk"])}')
          if times['cs']!=times['sk']:
            raise SystemExit('CZ/SK time mismatch')
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace(';','\\u003b')
          with open(f'episode-{EP}-summary.js','w',encoding='utf-8') as f:
            f.write('const DATA='+payload+';\n')

          path='tools/augment-v2-extra-nonquestions.mjs'
          s=open(path,encoding='utf-8').read()
          if 'const EXTRAS=[254,' not in s: raise SystemExit('Unexpected EXTRAS layout')
          s=s.replace('const EXTRAS=[254,','const EXTRAS=[253,254,',1)
          open(path,'w',encoding='utf-8').write(s)

          path='tools/test-content-v2.mjs'
          s=open(path,encoding='utf-8').read()
          if 'for(const n of [254,' not in s: raise SystemExit('Unexpected regression-list layout')
          s=s.replace('for(const n of [254,','for(const n of [253,254,',1)
          open(path,'w',encoding='utf-8').write(s)
          print('Built episode 253 with 18 bilingual sections and matching times.')
          PY
      - name: Verify V2 integration
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit only episode 253 source and registrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-253-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git commit -m 'Add episode 253 summary integration'
          git push origin HEAD:add-summary-253
