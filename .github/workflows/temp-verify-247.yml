name: TEMP verify episode 247

on:
  push:
    branches: [add-summary-247]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Generate episode 247 summary and registration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact bilingual summary from canonical HTML
        run: |
          python - <<'PY'
          import html, json, re, urllib.request
          from pathlib import Path

          episode=247
          urls={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/247-fosfor.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/247-fosfor.html',
          }
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'VedatorSummaryBot/1.0'})
            with urllib.request.urlopen(req,timeout=60) as r:
              return r.read().decode('utf-8')
          def clean(fragment):
            return html.unescape(re.sub(r'<[^>]+>','',fragment)).strip()
          def parse(lang,source):
            if f'data-episode="{episode}"' not in source: raise SystemExit(f'{lang}: wrong data-episode')
            if f'<title>Vedátorský podcast {episode} – Fosfor</title>' not in source: raise SystemExit(f'{lang}: title mismatch')
            if f'<h1>Vedátorský podcast {episode} – Fosfor</h1>' not in source: raise SystemExit(f'{lang}: h1 mismatch')
            sections=[]
            for m in re.finditer(r'<section class="faq" data-time="([^"]+)"><h2>(.*?)</h2><ul>(.*?)</ul></section>',source,re.S):
              time=m.group(1)
              title=clean(m.group(2))
              points=[clean(x) for x in re.findall(r'<li>(.*?)</li>',m.group(3),re.S)]
              if not title or not points: raise SystemExit(f'{lang}: empty section at {time}')
              sections.append({'time':time,'title':title,'points':points})
            return sections
          data={lang:parse(lang,fetch(url)) for lang,url in urls.items()}
          if len(data['cs'])!=15 or len(data['sk'])!=15: raise SystemExit(f"Expected 15+15 FAQ, got {len(data['cs'])}+{len(data['sk'])}")
          if [x['time'] for x in data['cs']] != [x['time'] for x in data['sk']]: raise SystemExit('CZ/SK timestamps differ')
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace(';',r'\u003b')
          Path(f'episode-{episode}-summary.js').write_text('const DATA='+payload+';\n',encoding='utf-8')
          decoded=json.loads(payload)
          if decoded!=data: raise SystemExit('Serialization roundtrip mismatch')
          print('Validated exact source: 15 CZ + 15 SK, timestamps 1:1, serialization roundtrip OK')
          PY
      - name: Register episode in current V2 build and regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/augment-v2-extra-nonquestions.mjs')
          s=p.read_text(encoding='utf-8')
          old='const EXTRAS=[249,'
          if old not in s: raise SystemExit('Current EXTRAS anchor changed; refusing broad edit')
          p.write_text(s.replace(old,'const EXTRAS=[247,249,',1),encoding='utf-8')
          p=Path('tools/test-content-v2.mjs')
          s=p.read_text(encoding='utf-8')
          old='for(const n of [249,'
          if old not in s: raise SystemExit('Current regression-list anchor changed; refusing broad edit')
          p.write_text(s.replace(old,'for(const n of [247,249,',1),encoding='utf-8')
          PY
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit only target source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-247-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Generate episode 247 summary and registration'
          git push
