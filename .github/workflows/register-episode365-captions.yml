name: Register validated episode 365 captions and promise timings
on:
  push:
    branches: [content/episode-365-20261127]
    paths: [.github/workflows/register-episode365-captions.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate before registering reviewed assets
        run: |
          node tools/build-content-v2.mjs
          python tools/validate-youtube-caption-batch.py --register 365
          python tools/update-episode365-caption-times.py
          node tools/build-content-v2.mjs
          python tools/validate-youtube-caption-batch.py --registered 365
          node tools/test-video-catalog.mjs
          node tools/test-sliby-content-scope.cjs
          node tools/test-sliby-episode-scope.cjs
          node tools/test-sliby-links.cjs
      - name: Commit reviewed mappings and content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-videos.json audio-seek-index.json captions/episode-365.review.json sliby/index.html
          git commit -m 'Register validated episode 365 bilingual captions and precise promise anchors'
          git restore content-v2.json
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
