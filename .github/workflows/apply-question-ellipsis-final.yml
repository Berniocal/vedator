name: Finální ověření výpustky otázek

on:
  push:
    branches: [fix/question-ellipsis-final]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Použít nativní výpustku pro zkrácené odpovědi
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.question-card:not(.open):has(.question-more:not(.hidden)) .question-answer{position:relative}\n.question-card:not(.open):has(.question-more:not(.hidden)) .question-answer::after{content:"...";position:absolute;right:0;bottom:0;width:3.2em;height:1.5em;display:flex;align-items:center;justify-content:flex-end;padding-right:.15rem;background:linear-gradient(90deg,transparent 0,var(--card) 42%);color:var(--ink);font-weight:700;pointer-events:none}'
          new='.question-card:not(.open) .question-answer{display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:5!important;max-height:none!important;overflow:hidden!important}\n.question-card.open .question-answer{display:block!important;-webkit-line-clamp:unset!important;-webkit-box-orient:initial!important;max-height:none!important}\n.question-card .question-answer::after{content:none!important}'
          if old not in s: raise SystemExit('Nenalezen očekávaný CSS blok výpustky')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Ověřit syntaxi aplikace
        run: node --check app-v2.js

      - name: Nainstalovat pouze testovací závislosti
        run: npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24

      - name: Připravit testovací vstup
        run: cp index.html v2.html

      - name: Ověřit stávající chování otázek
        run: node tools/test-v2-question-experience.mjs

      - name: Ověřit nativní výpustku na mobilním Chromiu
        run: |
          cat > tools/tmp-test-native-question-ellipsis.mjs <<'EOF'
          import fs from 'node:fs';
          import http from 'node:http';
          import path from 'node:path';
          import puppeteer from 'puppeteer-core';
          const assert=(condition,message)=>{if(!condition)throw new Error(message)};
          const root=process.cwd(),sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.webmanifest':'application/manifest+json'};
          const server=http.createServer((request,response)=>{try{const url=new URL(request.url,'http://127.0.0.1'),pathname=decodeURIComponent(url.pathname==='/'?'/v2.html':url.pathname),file=path.resolve(root,'.'+pathname);if(!file.startsWith(root)||!fs.existsSync(file)){response.writeHead(404);response.end('not found');return}response.writeHead(200,{'Content-Type':mime[path.extname(file)]||'application/octet-stream','Cache-Control':'no-store'});fs.createReadStream(file).pipe(response)}catch(error){response.writeHead(500);response.end(String(error))}});
          await new Promise(resolve=>server.listen(4173,'127.0.0.1',resolve));
          const executablePath=[process.env.CHROME_PATH,'/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].filter(Boolean).find(fs.existsSync);assert(executablePath,'Chromium/Chrome nenalezen');
          const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();await page.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          async function inspect(view){
            await page.click(`.tab-v2[data-view="${view}"]`);await sleep(700);
            return page.evaluate(view=>{
              const root=document.querySelector(view==='questions'?'#questions-v2':'#nonquestions-v2'),rows=[];
              for(const card of root.querySelectorAll('.question-card')){
                const answer=card.querySelector('.question-answer'),button=card.querySelector('.question-more');if(!answer||!button)continue;
                const css=getComputedStyle(answer),line=parseFloat(css.lineHeight)||0,clipped=answer.scrollHeight>answer.clientHeight+2;
                rows.push({id:card.dataset.item,clipped,buttonVisible:!button.classList.contains('hidden'),clamp:css.webkitLineClamp,orient:css.webkitBoxOrient,display:css.display,client:answer.clientHeight,scroll:answer.scrollHeight,line});
              }
              return rows;
            },view);
          }
          try{
            await page.goto('http://127.0.0.1:4173/v2.html',{waitUntil:'domcontentloaded',timeout:15000});await page.waitForFunction(()=>document.documentElement.dataset.vedatorV2Ready==='1',{timeout:15000});
            const questions=await inspect('questions'),nonquestions=await inspect('nonquestions');
            for(const [name,rows] of [['questions',questions],['nonquestions',nonquestions]]){
              assert(rows.length>0,`${name}: žádné karty`);
              const clipped=rows.filter(row=>row.clipped);assert(clipped.length>0,`${name}: žádná zkrácená odpověď`);
              assert(clipped.every(row=>row.buttonVisible),`${name}: chybí Číst více u zkrácené odpovědi`);
              assert(clipped.every(row=>row.clamp==='5'&&row.orient==='vertical'),`${name}: nativní line-clamp není aktivní`);
              assert(clipped.every(row=>!row.line||row.client<=row.line*5.35),`${name}: odpověď přesahuje pět řádků`);
              assert(rows.filter(row=>!row.clipped).every(row=>!row.buttonVisible),`${name}: Číst více je u nezkrácené odpovědi`);
            }
            await page.click('.tab-v2[data-view="questions"]');await sleep(150);
            const target=questions.find(row=>row.clipped);assert(target,'nenalezena zkrácená otázka');
            const before=target.client;
            await page.evaluate(id=>document.querySelector(`.question-card[data-item="${CSS.escape(id)}"] .question-more`)?.click(),target.id);await sleep(120);
            const opened=await page.evaluate(id=>{const card=document.querySelector(`.question-card[data-item="${CSS.escape(id)}"]`),answer=card?.querySelector('.question-answer');if(!card||!answer)return null;const css=getComputedStyle(answer);return{open:card.classList.contains('open'),clamp:css.webkitLineClamp,height:answer.clientHeight,scroll:answer.scrollHeight}},target.id);
            assert(opened?.open,'otázka se nerozbalila');assert(opened.clamp==='none'||opened.clamp==='unset','line-clamp zůstal po rozbalení');assert(opened.height>before,'rozbalená odpověď se nezvětšila');assert(Math.abs(opened.height-opened.scroll)<=2,'rozbalená odpověď zůstala oříznutá');
            console.log(JSON.stringify({ok:true,questions:questions.length,nonquestions:nonquestions.length,questionsClipped:questions.filter(x=>x.clipped).length,nonquestionsClipped:nonquestions.filter(x=>x.clipped).length,nativeClamp:true,opensCleanly:true},null,2));
          }finally{await page.close().catch(()=>{});await browser.close().catch(()=>{});await new Promise(resolve=>server.close(resolve))}
          EOF
          node tools/tmp-test-native-question-ellipsis.mjs

      - name: Ověřit širší mobilní regresi
        run: node tools/test-v2-mobile-browser.mjs

      - name: Zkontrolovat čistý rozsah změny
        run: |
          rm -f v2.html tools/tmp-test-native-question-ellipsis.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "index.html"

      - name: Commitnout pouze ověřenou opravu a odstranit dočasný workflow
        run: |
          rm -f .github/workflows/apply-question-ellipsis-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html .github/workflows/apply-question-ellipsis-final.yml
          git commit -m 'Srovnat výpustku otázek s koncem textu'
          git push
