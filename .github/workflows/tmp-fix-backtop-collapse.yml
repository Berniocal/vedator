name: Temporary back-to-top collapse fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch back-to-top behavior
        run: node tools/tmp-fix-backtop-collapse.mjs

      - name: Verify patch
        shell: bash
        run: |
          node --check app-v2.js
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('app-v2.js','utf8');
          const required=[
            'playerNavOriginalSetPlayerCollapsed',
            'base+rect.height+9',
            'linear-gradient(180deg,#55449a,#3f307b)',
            'linear-gradient(180deg,#51408f,#3a2c70)',
            '--vedator-back-bottom'
          ];
          for(const value of required)if(!source.includes(value))throw new Error('Missing expected fragment: '+value);
          if(source.includes('background:#7c3aed!important'))throw new Error('Old bright purple back-to-top color still present');
          console.log('Back-to-top static checks passed.');
          NODE
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js
          git commit -m 'Fix collapsed player back-to-top position'
          git push origin HEAD:main
