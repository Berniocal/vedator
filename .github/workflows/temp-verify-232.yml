name: Temporary verify episode 232

on:
  push:
    branches:
      - add-summary-232

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical episode 232 data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const get=url=>new Promise((resolve,reject)=>https.get(url,res=>{if(res.statusCode!==200){reject(new Error(`HTTP ${res.statusCode} ${url}`));return;}let s='';res.setEncoding('utf8');res.on('data',d=>s+=d);res.on('end',()=>resolve(s));}).on('error',reject));
          const decode=s=>s
            .replace(/<[^>]*>/g,'')
            .replace(/&nbsp;/g,'\u00a0')
            .replace(/&amp;/g,'&')
            .replace(/&quot;/g,'"')
            .replace(/&#39;|&apos;/g,"'")
            .replace(/&lt;/g,'<')
            .replace(/&gt;/g,'>')
            .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n)))
            .replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)));
          const parse=(html,lang)=>{
            const ep=html.match(/data-episode="(\d+)"/);
            const title=html.match(/<title>(.*?)<\/title>/s);
            const h1=html.match(/<h1>(.*?)<\/h1>/s);
            if(!ep||Number(ep[1])!==232)throw new Error(`${lang}: wrong data-episode`);
            if(!title?.[1].includes('232')||!h1?.[1].includes('232'))throw new Error(`${lang}: title/h1 mismatch`);
            const out=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>(.*?)<\/h2><ul>(.*?)<\/ul><\/section>/gs;
            for(const m of html.matchAll(re)){
              const points=[...m[3].matchAll(/<li>(.*?)<\/li>/gs)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            if(out.length!==24)throw new Error(`${lang}: expected 24 FAQ, got ${out.length}`);
            return out;
          };
          const sec=t=>{const [m,s]=t.split(':').map(Number);return m*60+s};
          (async()=>{
            const base='https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti';
            const cs=parse(await get(`${base}/cs/232-zapisky-zo-starmusu.html`),'cs');
            const sk=parse(await get(`${base}/sk/232-zapisky-zo-starmusu.html`),'sk');
            const csSet=[...cs].sort((a,b)=>sec(a.time)-sec(b.time));
            const skSet=[...sk].sort((a,b)=>sec(a.time)-sec(b.time));
            const ct=csSet.map(x=>x.time), st=skSet.map(x=>x.time);
            if(JSON.stringify(ct)!==JSON.stringify(st))throw new Error(`CZ/SK timestamps differ after chronological alignment: ${ct.join(',')} vs ${st.join(',')}`);
            if(new Set(ct).size!==24)throw new Error('Duplicate timestamp in episode 232');
            const data={cs:csSet,sk:skSet};
            let json=JSON.stringify(data).replace(/;/g,'\\u003b');
            fs.writeFileSync('episode-232-summary.js',`const DATA=${json};\n`);
            const roundTrip=JSON.parse(json);
            if(JSON.stringify(roundTrip)!==JSON.stringify(data))throw new Error('Serialization round-trip mismatch');
            let aug=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            if(!aug.includes('const EXTRAS=[232,')){
              if(!aug.includes('const EXTRAS=[233,'))throw new Error('Unexpected EXTRAS registry shape');
              aug=aug.replace('const EXTRAS=[233,','const EXTRAS=[232,233,');
              fs.writeFileSync('tools/augment-v2-extra-nonquestions.mjs',aug);
            }
            let test=fs.readFileSync('tools/test-content-v2.mjs','utf8');
            if(!test.includes('for(const n of [232,')){
              if(!test.includes('for(const n of [233,'))throw new Error('Unexpected nonquestion regression list shape');
              test=test.replace('for(const n of [233,','for(const n of [232,233,');
              fs.writeFileSync('tools/test-content-v2.mjs',test);
            }
            console.log(`episode 232: ${csSet.length} CZ + ${skSet.length} SK; aligned times ${ct.join(', ')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Syntax and V2 build checks
        run: |
          node --check app-v2.js
          node --check episode-232-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html

      - name: Commit verified target files
        run: |
          git add episode-232-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if git diff --cached --quiet; then
            echo "Target files already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add episode 232 summary data"
            git push origin HEAD:add-summary-232
          fi

# trigger retry
