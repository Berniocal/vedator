name: TEMP verify episode 231

on:
  push:
    branches: [add-summary-231]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-231
      - name: Build canonical episode 231 data
        run: |
          node <<'NODE'
          const fs=require('fs');
          const EP=231;
          const urls={
            cs:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/231-pribeh-chlpate-cibule.html',
            sk:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/231-pribeh-chlpatej-cibule.html'
          };
          const decode=s=>s.replace(/<[^>]+>/g,'').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,'\u00a0').trim();
          async function parse(lang){
            const html=await (await fetch(urls[lang])).text();
            if(!html.includes(`data-episode="${EP}"`))throw new Error(`${lang}: episode metadata mismatch`);
            if(!new RegExp(`<title>[^<]*\\b${EP}\\b`).test(html)||!new RegExp(`<h1>[^<]*\\b${EP}\\b`).test(html))throw new Error(`${lang}: title/h1 mismatch`);
            const sections=[...html.matchAll(/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g)].map(m=>({time:m[1],title:decode(m[2]),points:[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]))}));
            if(sections.length!==11)throw new Error(`${lang}: expected 11 FAQ, got ${sections.length}`);
            return sections;
          }
          (async()=>{
            const cs=await parse('cs'), sk=await parse('sk');
            const cst=cs.map(x=>x.time), skt=sk.map(x=>x.time);
            if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK timestamps differ: ${cst} vs ${skt}`);
            const data={cs,sk};
            const json=JSON.stringify(data).replace(/;/g,'\\u003b');
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${json};\n`);
            const round=JSON.parse(json);
            if(JSON.stringify(round)!==JSON.stringify(data))throw new Error('Serialization round-trip failed');
            const augment='tools/augment-v2-extra-nonquestions.mjs';
            let a=fs.readFileSync(augment,'utf8');
            if(!a.includes('const EXTRAS=[232,'))throw new Error('Unexpected EXTRAS layout');
            a=a.replace('const EXTRAS=[232,','const EXTRAS=[231,232,');
            fs.writeFileSync(augment,a);
            const test='tools/test-content-v2.mjs';
            let t=fs.readFileSync(test,'utf8');
            if(!t.includes('for(const n of [232,'))throw new Error('Unexpected test list layout');
            t=t.replace('for(const n of [232,','for(const n of [231,232,');
            fs.writeFileSync(test,t);
            console.log(JSON.stringify({episode:EP,cs:cs.length,sk:sk.length,timestamps:cst},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node --check episode-231-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-231-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git diff --cached --quiet || git commit -m 'Přidat ověřená data shrnutí epizody 231'
          git push origin HEAD:add-summary-231
