name: Review episode 365 disputed source speech
on:
  push:
    branches: [content/episode-365-20261127]
    paths:
      - tools/review-youtube-caption-batch-audio.py
      - .github/workflows/review-episode365-captions.yml
      - captions/source/episode-36*-youtube-editorial-review.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-caption-audio-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: [365]
        shard: [0, 1, 2, 3]
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-youtube-caption-audio-models-v1
          restore-keys: |
            vedator-youtube-caption-draft-models-v1
            vedator-asr-turbo-and-slovak-ctc-v2
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-${{ matrix.episode }}-v1
      - name: Install acoustic review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 transformers==4.45.2 sentencepiece 'numpy<2' num2words==0.5.14
      - name: Independently recognize flagged speech and omitted-caption gaps
        run: python tools/review-youtube-caption-batch-audio.py ${{ matrix.episode }} check --shard-index ${{ matrix.shard }} --shard-count 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode365-review-${{ matrix.shard }}
          path: captions/source/episode-365-youtube-independent-audio-review-shard-*.json
          if-no-files-found: error
  collect:
    needs: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/download-artifact@v4
        with:
          pattern: episode365-review-*
          path: captions/source
          merge-multiple: true
      - name: Join source evidence
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          root=Path('captions/source');parts=sorted(root.glob('episode-365-youtube-independent-audio-review-shard-*.json'));assert len(parts)==4
          data=json.loads(parts[0].read_text());data['passages']=[]
          for p in parts:
              part=json.loads(p.read_text());assert part['audioSha256']==data['audioSha256'];data['passages']+=part['passages']
          data['passages'].sort(key=lambda p:p['start'])
          (root/'episode-365-youtube-independent-audio-review.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captions/source/episode-365-youtube-independent-audio-review*.json
          git commit -m 'Preserve independent episode 365 difficult speech and gap evidence'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
