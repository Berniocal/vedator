name: Coordinate episode 12 source continuation
on:
  push:
    branches: [captions/episode-12-precise-20261126]
    paths: [.github/workflows/coordinate-episode12-source.yml]
permissions:
  actions: write
  contents: read
jobs:
  avoid_duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runId=45747369365;
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            if(run.head_branch!=='captions/episode-12-precise-20261126'||run.head_sha!=='38f130311834e9d50ca2d0187532d9917beb0eb1')throw Error('Unexpected run identity');
            if(['pending','queued','waiting'].includes(run.status)){
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:runId});
              core.info('Cancelled only the queued redundant episode 12 preparation; original source run remains untouched.');
            }else core.info('Queued preparation already changed state; no action taken: '+run.status);
