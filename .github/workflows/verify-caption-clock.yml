name: Verify caption MP3 clock and screen wake
on:
  push:
    branches: [main, fix/captions-mp3-clock-20261116]
    paths:
      - app-v2.js
      - audio-seek-index.json
      - tools/test-caption-clock-browser.mjs
      - .github/workflows/verify-caption-clock.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build current content
        run: |
          node tools/build-content-v2.mjs
          node --check app-v2.js
      - name: Download original caption source MP3s
        run: |
          mkdir -p "$RUNNER_TEMP/caption-audio"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const data=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          for(const n of [1,2,3,4]){
            const e=data.episodes.find(e=>e.number===n);
            console.log(JSON.stringify({episode:n,enclosure:e.enclosure,captionFile:e.captionFile}));
            execFileSync('curl',['--fail','--location','--retry','3','--max-time','120',e.enclosure,'-o',process.env.RUNNER_TEMP+'/caption-audio/episode-'+n+'.mp3'],{stdio:'inherit'});
          }
          JS
      - name: Install browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/caption-deps" --no-audit --no-fund puppeteer-core@25.12.0 @sparticuz/chromium@153.0.0
      - name: Diagnose original timeline
        if: github.ref == 'refs/heads/fix/captions-mp3-clock-20261116'
        run: VEDATOR_CAPTION_DIAGNOSTIC=1 VEDATOR_CAPTION_AUDIO="$RUNNER_TEMP/caption-audio" VEDATOR_TEST_DEPS="$RUNNER_TEMP/caption-deps" node tools/test-caption-clock-browser.mjs
      - name: Build exact MP3 frame indexes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const data=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          for(const n of [1,2,3,4]){
            const e=data.episodes.find(e=>e.number===n);
            execFileSync('node',['tools/build-mp3-seek-index.mjs',process.env.RUNNER_TEMP+'/caption-audio/episode-'+n+'.mp3',e.enclosure],{stdio:'inherit'});
          }
          JS
      - name: Save exact indexes on repair branch
        if: github.ref == 'refs/heads/fix/captions-mp3-clock-20261116'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-seek-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Index exact MP3 frame times for captioned episodes 1 to 4"
            git push origin HEAD:fix/captions-mp3-clock-20261116
          fi
      - name: Verify actual MP3 captions, reader, video and wake lifecycle
        if: github.ref == 'refs/heads/main'
        run: VEDATOR_CAPTION_AUDIO="$RUNNER_TEMP/caption-audio" VEDATOR_TEST_DEPS="$RUNNER_TEMP/caption-deps" node tools/test-caption-clock-browser.mjs
