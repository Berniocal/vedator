name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['android/**']
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: node android/tools/prepare-assets.mjs
      - name: Build and validate
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:testDebugUnitTest :app:lintRelease
      - name: Collect unsigned APK and local signing tool
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/Vedator-0.1.0-unsigned.apk
          cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)" android-output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vedator-android-build
          path: android-output/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/lint-results*
