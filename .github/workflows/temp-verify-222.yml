# trigger retry
name: TEMP verify episode 222

on:
  push:
    branches: [add-summary-222]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and validate episode 222 integration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/222-caroline-herschel.html -o /tmp/222-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/222-caroline-herschel.html -o /tmp/222-sk.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/221-zabije-nas-supernova.html -o /tmp/221-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/223-jak-funguje-internet.html -o /tmp/223-cs.html
          node <<'NODE'
          const fs=require('fs');
          const decode=s=>s
            .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
            .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
            .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n)))
            .replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)));
          function strip(s){return decode(s.replace(/<[^>]*>/g,'').trim())}
          function parse(path,lang){
            const html=fs.readFileSync(path,'utf8');
            if(!html.includes('data-episode="222"'))throw new Error(`${lang}: data-episode mismatch`);
            if(!html.match(/<title>[^<]*222[^<]*Caroline Herschel[^<]*<\/title>/i))throw new Error(`${lang}: title mismatch`);
            if(!html.match(/<h1>[^<]*222[^<]*Caroline Herschel[^<]*<\/h1>/i))throw new Error(`${lang}: h1 mismatch`);
            const items=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>strip(x[1]));
              items.push({time:m[1],title:strip(m[2]),points});
            }
            if(items.length!==13)throw new Error(`${lang}: expected 13 FAQ, got ${items.length}`);
            if(items.some(x=>!x.title||x.points.length<3))throw new Error(`${lang}: malformed FAQ`);
            return {html,items};
          }
          const cs=parse('/tmp/222-cs.html','cs');
          const sk=parse('/tmp/222-sk.html','sk');
          const cst=cs.items.map(x=>x.time), skt=sk.items.map(x=>x.time);
          if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK timestamps differ: ${cst} vs ${skt}`);
          if(new Set(cst).size!==13)throw new Error('Duplicate timestamps in 222');
          const neighborTimes=path=>[...fs.readFileSync(path,'utf8').matchAll(/data-time="([^"]+)"/g)].map(m=>m[1]);
          for(const p of ['/tmp/221-cs.html','/tmp/223-cs.html']){
            const nt=neighborTimes(p);
            if(nt.length===13 && JSON.stringify(nt)===JSON.stringify(cst))throw new Error(`Suspicious timestamp duplicate with ${p}`);
          }
          const episodes=JSON.parse(fs.readFileSync('episodes.json','utf8'));
          const list=Array.isArray(episodes)?episodes:(episodes.episodes||[]);
          const ep=list.find(x=>Number(x.number??x.episode??x.id)===222);
          if(!ep)throw new Error('Episode 222 missing from episodes.json');
          if(!/Herschel/i.test(JSON.stringify(ep)))throw new Error('Episode 222 catalog title does not mention Herschel');
          const data={cs:cs.items,sk:sk.items};
          const json=JSON.stringify(data).replace(/;/g,'\\u003b');
          fs.writeFileSync('episode-222-summary.js',`const DATA=${json};\n`);
          let aug=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
          if(!/const EXTRAS=\[223,/.test(aug))throw new Error('Unexpected EXTRAS anchor');
          aug=aug.replace('const EXTRAS=[223,','const EXTRAS=[222,223,');
          fs.writeFileSync('tools/augment-v2-extra-nonquestions.mjs',aug);
          let test=fs.readFileSync('tools/test-content-v2.mjs','utf8');
          const anchor='for(const n of [223,224,225,';
          if(!test.includes(anchor))throw new Error('Unexpected test anchor');
          test=test.replace(anchor,'for(const n of [222,223,224,225,');
          fs.writeFileSync('tools/test-content-v2.mjs',test);
          const src=fs.readFileSync('episode-222-summary.js','utf8');
          const parsed=JSON.parse(src.slice(src.indexOf('const DATA=')+11,src.indexOf(';',src.indexOf('const DATA=')+11)));
          if(JSON.stringify(parsed)!==JSON.stringify(data))throw new Error('Serialization round-trip mismatch');
          console.log('Episode 222 canonical validation OK: 13 CZ + 13 SK, timestamps 1:1');
          NODE
          node --check app-v2.js
          node --check episode-222-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit verified target files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episode-222-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git commit -m "Přidat ověřená data epizody 222"
          git push
