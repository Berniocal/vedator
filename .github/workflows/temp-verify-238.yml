name: TEMP verify episode 238

on:
  push:
    branches: [add-summary-238]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-238
      - name: Build episode 238 summary from canonical HTML if needed
        run: |
          python - <<'PY'
          import urllib.request,re,html,json,pathlib
          def get(lang):
              url=f'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/{lang}/238-kip-thorne-starmus-interview.html'
              req=urllib.request.Request(url,headers={'User-Agent':'VedatorSummaryBot/1.0'})
              text=urllib.request.urlopen(req,timeout=60).read().decode('utf-8')
              assert 'data-episode="238"' in text
              title=re.search(r'<title>Vedátorský podcast 238 – (.*?)</title>',text,re.S).group(1)
              h1=re.search(r'<h1>Vedátorský podcast 238 – (.*?)</h1>',text,re.S).group(1)
              assert title==h1
              items=[]
              for t,body in re.findall(r'<section class="faq" data-time="([^"]+)">(.*?)</section>',text,re.S):
                  h2=re.search(r'<h2>(.*?)</h2>',body,re.S).group(1)
                  pts=re.findall(r'<li>(.*?)</li>',body,re.S)
                  clean=lambda s: html.unescape(re.sub(r'<[^>]+>','',s)).strip()
                  items.append({'time':t,'title':clean(h2),'points':[clean(p) for p in pts]})
              return title,items
          tc,cs=get('cs'); ts,sk=get('sk')
          assert tc==ts=='Kip Thorne (STARMUS interview)'
          assert len(cs)==len(sk)==15
          assert [x['time'] for x in cs]==[x['time'] for x in sk]
          payload=json.dumps({'cs':cs,'sk':sk},ensure_ascii=False,separators=(',',':')).replace(';','\\u003b')
          pathlib.Path('episode-238-summary.js').write_text('const DATA='+payload+';\n',encoding='utf-8')
          for path in ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']:
              p=pathlib.Path(path); s=p.read_text(encoding='utf-8')
              if path.endswith('augment-v2-extra-nonquestions.mjs'):
                  assert 'const EXTRAS=[239,' in s
                  s=s.replace('const EXTRAS=[239,','const EXTRAS=[238,239,',1)
              else:
                  assert 'for(const n of [239,' in s
                  s=s.replace('for(const n of [239,','for(const n of [238,239,',1)
              p.write_text(s,encoding='utf-8')
          PY
          if ! git diff --quiet -- episode-238-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add episode-238-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
            git commit -m 'Add episode 238 summary data and registration'
            git push
          fi
      - name: Verify V2 summary integration
        run: |
          node --check episode-238-summary.js
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
