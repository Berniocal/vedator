name: Prepare Czech drafts from reviewed newest Slovak captions
on:
  push:
    branches: [captions/youtube-batch-363-361-20261119]
    paths:
      - tools/translate-reviewed-youtube-caption-batch.py
      - .github/workflows/translate-reviewed-youtube-caption-batch.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-caption-czech-drafts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: [363, 362, 361]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-slovak-czech-multislav-v1
      - name: Install dedicated Czech draft translation model dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 sentencepiece 'numpy<2' sacremoses
      - name: Translate reviewed Slovak groups without truncating source text
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/translate-reviewed-youtube-caption-batch.py ${{ matrix.episode }}
      - name: Preserve Czech draft for editorial review
        if: always()
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captions/source/episode-${EPISODE}-youtube-czech-multislav-draft.json
          if ! git diff --cached --quiet; then
            git commit -m "Translate reviewed episode ${EPISODE} Slovak text into Czech editorial draft"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            done
            exit 1
          fi
