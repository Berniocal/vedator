name: Apply reviewed episode promise scope (temporary)
on:
  push:
    branches: [audit/episode-promises-20261117]
    paths:
      - '.github/workflows/audit-sliby-episode-scope.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply 53 individually reviewed scope changes
        run: node tools/apply-sliby-episode-scope.cjs
      - name: Check exact episode-only grouping and archive
        run: node tools/test-sliby-episode-scope.cjs
      - name: Verify player filters, archived links and sections
        run: node tools/test-sliby-player.cjs
      - name: Verify personal states and deletions
        run: node tools/test-sliby-personal-state.cjs
      - name: Verify exclusion of subscriber content
        run: node tools/test-sliby-content-scope.cjs
      - name: Commit reviewed HTML classification to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sliby/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Keep only real future podcast episodes in episode promise section"
            git push origin HEAD:audit/episode-promises-20261117
          fi
