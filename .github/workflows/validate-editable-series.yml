name: Ověření editovatelných sérií

on:
  push:
    branches:
      - refactor/editable-series-config

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Uložit produkční V2 jako referenci
        run: |
          git fetch origin main
          git show origin/main:content-v2.json > /tmp/content-v2-before.json

      - name: Sestavit V2 z nového series.json
        run: |
          node --check tools/augment-v2-parity-content.mjs
          node --check tools/test-content-v2.mjs
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs

      - name: Ověřit bezeztrátovou migraci současných sérií
        run: |
          node <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/content-v2-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const clean=item=>({name:item.name,i18n:item.i18n,episodes:[...(item.episodes||[])],people:Boolean(item.people)});
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          if(!same(before.episodes,after.episodes))throw new Error('Migrace změnila epizody mimo série');
          if(!same(before.questions,after.questions))throw new Error('Migrace změnila FAQ otázky');
          if(!same(before.nonquestions,after.nonquestions))throw new Error('Migrace změnila neotázky');
          const oldMap=new Map(before.series.map(item=>[item.name,clean(item)]));
          const newMap=new Map(after.series.map(item=>[item.name,clean(item)]));
          const names=[...new Set([...oldMap.keys(),...newMap.keys()])].sort((a,b)=>a.localeCompare(b,'cs'));
          const differences=[];
          for(const name of names){
            const oldItem=oldMap.get(name),newItem=newMap.get(name);
            if(!same(oldItem,newItem))differences.push({name,before:oldItem,after:newItem});
          }
          if(differences.length){
            console.error('Rozdílné série:',JSON.stringify(differences,null,2));
            throw new Error(`series.json nereprodukuje ${differences.length} současných sérií přesně`);
          }
          console.log(`Bezeztrátová migrace OK: ${after.series.length} sérií.`);
          NODE
