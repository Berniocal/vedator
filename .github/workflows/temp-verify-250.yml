name: TEMP verify episode 250

on:
  push:
    branches: [add-summary-250]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical episode 250 summary
        run: |
          python - <<'PY'
          import json, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          urls={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/250-lawrence-krauss.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/250-lawrence-krauss.html'
          }
          class Parser(HTMLParser):
            def __init__(self):
              super().__init__(); self.sections=[]; self.cur=None; self.tag=None; self.buf=''
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='article': assert a.get('data-episode')=='250'
              if tag=='section' and 'faq' in a.get('class','').split():
                self.cur={'time':a.get('data-time'),'title':'','points':[]}
              elif self.cur is not None and tag in ('h2','li'):
                self.tag=tag; self.buf=''
            def handle_data(self,data):
              if self.tag: self.buf+=data
            def handle_endtag(self,tag):
              if self.cur is not None and self.tag==tag:
                text=self.buf.strip()
                if tag=='h2': self.cur['title']=text
                else: self.cur['points'].append(text)
                self.tag=None; self.buf=''
              if tag=='section' and self.cur is not None:
                self.sections.append(self.cur); self.cur=None
          data={}
          for lang,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Vedator-summary-build'})
            html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')
            assert 'data-episode="250"' in html
            assert '<title>Vedátorský podcast 250 – Lawrence Krauss</title>' in html
            assert '<h1>Vedátorský podcast 250 – Lawrence Krauss</h1>' in html
            p=Parser(); p.feed(html)
            assert len(p.sections)==34, (lang,len(p.sections))
            assert all(x['time'] and x['title'] and 3 <= len(x['points']) <= 4 for x in p.sections)
            data[lang]=p.sections
          assert [x['time'] for x in data['cs']]==[x['time'] for x in data['sk']]
          Path('episode-250-summary.js').write_text('const DATA='+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')

          p=Path('tools/augment-v2-extra-nonquestions.mjs'); s=p.read_text(encoding='utf-8')
          if 'const EXTRAS=[250,' not in s: s=s.replace('const EXTRAS=[251,','const EXTRAS=[250,251,')
          p.write_text(s,encoding='utf-8')

          p=Path('tools/test-content-v2.mjs'); s=p.read_text(encoding='utf-8')
          marker='for(const n of [251,252,253,254,255,256,258,259,260,261,262,265,266,267,268,269,271,273,274,276,277,279,280,281,282,283,285,286,287,288,290,292,293,294,296,297,298,299,301,302,303,304,305,306,307,308,309,310,311,312,315,318,320,321,322,323,324,325,334,335,336,338,339,341,342,343,344,345,347])'
          if 'for(const n of [250,251,' not in s:
            assert marker in s
            s=s.replace(marker,marker.replace('[251,','[250,251,'))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node --check episode-250-summary.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Commit target files if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-250-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Add episode 250 summary data and V2 registration'
            git push
          fi
