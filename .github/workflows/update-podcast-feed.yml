name: Aktualizace podcastového katalogu a V2 dat

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main, fix-episode-336-nonquestion]
    paths:
      - '.github/workflows/update-podcast-feed.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Převést díl 336 z FAQ do neotázek
        run: |
          OLD=c5edb1c7bc642054e3b48c082b879215c52a58b3
          git show "${OLD}:tools/build-content-v2.mjs" > tools/build-content-v2.mjs
          git show "${OLD}:tools/augment-v2-parity-content.mjs" > tools/augment-v2-parity-content.mjs
          git show "${OLD}:tools/test-app-v2.mjs" > tools/test-app-v2.mjs
          git show "${OLD}:tools/test-content-v2.mjs" > tools/test-content-v2.mjs
          git show "${OLD}:tools/test-v2-faq-integrity.mjs" > tools/test-v2-faq-integrity.mjs
          python - <<'PY'
          from pathlib import Path

          build = Path('tools/build-content-v2.mjs')
          text = build.read_text(encoding='utf-8')
          old = 'const EXTRA_NONQUESTION_EPISODES=[331,333,334,335,338,339,341,342,344,345,347];'
          new = 'const EXTRA_NONQUESTION_EPISODES=[331,333,334,335,336,338,339,341,342,344,345,347];'
          if old not in text:
              raise SystemExit('Nelze bezpečně přidat 336 do EXTRA_NONQUESTION_EPISODES')
          build.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tools/test-content-v2.mjs')
          text = test.read_text(encoding='utf-8')
          old = 'for(const n of [334,335,338,339,341,342,343,344,345,347])'
          new = 'for(const n of [334,335,336,338,339,341,342,343,344,345,347])'
          if old not in text:
              raise SystemExit('Nelze bezpečně přidat kontrolu neotázky 336')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Stáhnout RSS a vytvořit episodes.json
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          FEED = 'https://feed.podbean.com/vedatorskypodcast/feed.xml'
          req = urllib.request.Request(FEED, headers={'User-Agent': 'Mozilla/5.0 VedatorCatalog/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)
          episodes = []
          for i, item in enumerate(root.findall('.//item')):
              def text(name):
                  node = item.find(name)
                  return (node.text or '').strip() if node is not None else ''

              title = text('title') or 'Bez názvu'
              description = text('description')
              link = text('link')
              date = text('pubDate')
              enclosure_node = item.find('enclosure')
              enclosure = enclosure_node.attrib.get('url', '') if enclosure_node is not None else ''
              guid = text('guid')
              match = re.search(r'podcast\s+(\d+)', title, re.I)
              episodes.append({
                  'title': title,
                  'description': description,
                  'date': date,
                  'link': link or enclosure,
                  'enclosure': enclosure,
                  'number': int(match.group(1)) if match else 0,
                  'id': guid or link or enclosure or f'{title}-{i}'
              })

          if len(episodes) < 20:
              raise SystemExit(f'RSS obsahuje jen {len(episodes)} epizod, soubor nepřepisuji.')

          payload = {
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'source': FEED,
              'count': len(episodes),
              'episodes': episodes
          }
          with open('episodes.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, separators=(',', ':'))
          print(f'Uloženo {len(episodes)} epizod.')
          PY

      - name: Přestavět V2 datový balík a ověřit klasifikaci 336
        run: |
          node tools/build-content-v2.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          if(data.questions.some(q=>Number(q.episode)===336)) throw new Error('336 je stále ve FAQ otázkách');
          if(data.questions.length!==734) throw new Error(`FAQ má ${data.questions.length} otázek místo 734`);
          if(new Set(data.questions.map(q=>Number(q.episode))).size!==42) throw new Error('FAQ nemá 42 dílů');
          const ep=data.nonquestions?.episodes?.['336'];
          if(!ep||!Array.isArray(ep.cs)||!Array.isArray(ep.sk)) throw new Error('336 chybí v neotázkách');
          if(ep.cs.length!==20||ep.sk.length!==20) throw new Error(`336 má špatný počet položek: ${ep.cs.length}/${ep.sk.length}`);
          if(ep.cs[0]?.[0]!=='03:18'||ep.sk[0]?.[0]!=='03:18') throw new Error('336 má posunutý první čas');
          if(ep.cs.at(-1)?.[0]!=='41:20'||ep.sk.at(-1)?.[0]!=='41:20') throw new Error('336 má posunutý poslední čas');
          console.log(JSON.stringify({ok:true,questions:data.questions.length,faqEpisodes:new Set(data.questions.map(q=>q.episode)).size,nonquestion336:{cs:ep.cs.length,sk:ep.sk.length,first:ep.cs[0][0],last:ep.cs.at(-1)[0]}}));
          NODE
          node tools/build-production-sw.mjs

      - name: Commitnout opravu na pracovní větev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episodes.json content-v2.json sw.js tools/build-content-v2.mjs tools/augment-v2-parity-content.mjs tools/test-app-v2.mjs tools/test-content-v2.mjs tools/test-v2-faq-integrity.mjs
          if git diff --cached --quiet; then
            echo 'Beze změny.'
          else
            git commit -m 'Move episode 336 from FAQ to nonquestions'
            git push
          fi

  deploy-pages:
    needs: update-feed
    if: ${{ needs.update-feed.result == 'success' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: pages-direct
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nahrát statické soubory
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
