name: Aktualizace podcastového katalogu a V2 dat

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main, fix-336-nonquestion]
    paths:
      - '.github/workflows/update-podcast-feed.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout RSS a vytvořit episodes.json
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          FEED = 'https://feed.podbean.com/vedatorskypodcast/feed.xml'
          req = urllib.request.Request(FEED, headers={'User-Agent': 'Mozilla/5.0 VedatorCatalog/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)
          episodes = []
          for i, item in enumerate(root.findall('.//item')):
              def text(name):
                  node = item.find(name)
                  return (node.text or '').strip() if node is not None else ''

              title = text('title') or 'Bez názvu'
              description = text('description')
              link = text('link')
              date = text('pubDate')
              enclosure_node = item.find('enclosure')
              enclosure = enclosure_node.attrib.get('url', '') if enclosure_node is not None else ''
              guid = text('guid')
              match = re.search(r'podcast\s+(\d+)', title, re.I)
              episodes.append({
                  'title': title,
                  'description': description,
                  'date': date,
                  'link': link or enclosure,
                  'enclosure': enclosure,
                  'number': int(match.group(1)) if match else 0,
                  'id': guid or link or enclosure or f'{title}-{i}'
              })

          if len(episodes) < 20:
              raise SystemExit(f'RSS obsahuje jen {len(episodes)} epizod, soubor nepřepisuji.')

          payload = {
              'updatedAt': datetime.now(timezone.utc).isoformat(),
              'source': FEED,
              'count': len(episodes),
              'episodes': episodes
          }
          with open('episodes.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, separators=(',', ':'))
          print(f'Uloženo {len(episodes)} epizod.')
          PY

      - name: Přestavět V2 datový balík a service worker
        run: |
          node tools/build-content-v2.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs

      - name: Commitnout atomickou aktualizaci
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episodes.json content-v2.json sw.js
          if git diff --cached --quiet; then
            echo 'Katalog, V2 data i service worker jsou beze změny.'
          else
            git commit -m 'Automatická aktualizace katalogu a V2 dat'
            git push
          fi

  deploy-pages:
    needs: update-feed
    if: ${{ github.ref == 'refs/heads/main' && needs.update-feed.result == 'success' }}
    concurrency:
      group: pages-direct
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst aktuální main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nahrát statické soubory
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          reporting_interval: 10000
