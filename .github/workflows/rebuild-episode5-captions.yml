name: Prepare precise episode 5 captions
on:
  push:
    branches: [captions/episode-5-precise-20261116]
    paths:
      - tools/rebuild-episode5-captions.py
      - .github/workflows/rebuild-episode5-captions.yml
      - captions/episode-5.edited.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vedator-episode5-captions
  cancel-in-progress: true
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VEDATOR_EP5_AUDIO: '${{ runner.temp }}/vedator-ep5-audio'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: '${{ runner.temp }}/vedator-ep5-audio'
          key: vedator-original-episode-5-audio-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-ep5-asr-ctc-models-v1
      - name: Prepare source catalog
        run: node tools/build-content-v2.mjs
      - name: Install transcription dependencies
        if: hashFiles('captions/episode-5.edited.json') == ''
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Fresh complete Slovak transcription
        if: hashFiles('captions/episode-5.edited.json') == ''
        run: python tools/rebuild-episode5-captions.py draft
      - name: Install acoustic alignment dependencies
        if: hashFiles('captions/episode-5.edited.json') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 'numpy<2'
      - name: Align reviewed Slovak speech and Czech captions to original MP3
        if: hashFiles('captions/episode-5.edited.json') != ''
        run: |
          python tools/rebuild-episode5-captions.py align
          node tools/build-content-v2.mjs
      - name: Save caption results on preparation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-5* episode-videos.json audio-seek-index.json
          if test -f captions/episode-5.edited.json; then git add captions/episode-5*; fi
          git restore content-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare episode 5 source transcript or acoustically aligned bilingual captions"
            git push origin HEAD:captions/episode-5-precise-20261116
          fi
