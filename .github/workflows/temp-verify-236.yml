name: TEMP verify episode 236

on:
  push:
    branches: [add-summary-236]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact episode 236 data from canonical CZ/SK sources
        run: |
          python - <<'PY'
          import json, re, urllib.request, html, difflib
          from html.parser import HTMLParser
          from pathlib import Path

          EP=236
          BRANCH='add-summary-236'
          BASE='https://raw.githubusercontent.com/Berniocal/vedator-test/main/'
          SOURCES={
            'cs':'shrnuti/cs/236-steven-chu-starmus-interview.html',
            'sk':'shrnuti/sk/236-steven-chu-starmus-interview.html',
          }
          NEIGHBORS={
            235:{'cs':'shrnuti/cs/235-novacen.html','sk':'shrnuti/sk/235-novacen.html'},
            237:{'cs':'shrnuti/cs/237-rozpad-protonu.html','sk':'shrnuti/sk/237-rozpad-protonu.html'},
          }

          def download(path):
            req=urllib.request.Request(BASE+path,headers={'User-Agent':'Vedator-summary-verifier/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              return r.read().decode('utf-8')

          class SummaryParser(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True)
              self.article=None; self.sections=[]; self.cur=None; self.mode=None; self.buf=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='article' and 'episode-summary' in a.get('class','').split(): self.article=a
              if tag=='section' and 'faq' in a.get('class','').split():
                self.cur={'time':a.get('data-time',''),'title':'','points':[]}
                self.sections.append(self.cur)
              elif self.cur is not None and tag=='h2': self.mode='title'; self.buf=[]
              elif self.cur is not None and tag=='li': self.mode='point'; self.buf=[]
            def handle_data(self,data):
              if self.mode: self.buf.append(data)
            def handle_endtag(self,tag):
              if self.cur is not None and self.mode=='title' and tag=='h2':
                self.cur['title']=''.join(self.buf).strip(); self.mode=None; self.buf=[]
              elif self.cur is not None and self.mode=='point' and tag=='li':
                self.cur['points'].append(''.join(self.buf).strip()); self.mode=None; self.buf=[]
              elif tag=='section': self.cur=None; self.mode=None; self.buf=[]

          def parse(path, expected_ep):
            text=download(path)
            p=SummaryParser(); p.feed(text)
            if not p.article: raise SystemExit(f'Missing article metadata: {path}')
            if int(p.article.get('data-episode','-1')) != expected_ep: raise SystemExit(f'Wrong data-episode in {path}')
            titlem=re.search(r'<title>(.*?)</title>',text,re.S|re.I)
            h1m=re.search(r'<h1>(.*?)</h1>',text,re.S|re.I)
            for label,m in [('title',titlem),('h1',h1m)]:
              if not m or not re.search(rf'\b{expected_ep}\b',html.unescape(re.sub(r'<[^>]+>','',m.group(1)))):
                raise SystemExit(f'Wrong {label} episode number in {path}')
            if not p.sections: raise SystemExit(f'No FAQ sections in {path}')
            for i,s in enumerate(p.sections,1):
              if not re.fullmatch(r'\d{2}:\d{2}',s['time']): raise SystemExit(f'Bad time in {path} section {i}: {s["time"]}')
              if not s['title'] or not (3 <= len(s['points']) <= 4): raise SystemExit(f'Bad FAQ content in {path} section {i}')
            return p.article,p.sections

          parsed={}
          for lang,path in SOURCES.items():
            meta,sections=parse(path,EP); parsed[lang]=sections
            print(lang,'sections',len(sections),'metadata questionCount',meta.get('data-question-count'))
          if len(parsed['cs']) != len(parsed['sk']): raise SystemExit('CZ/SK section count differs')
          cst=[s['time'] for s in parsed['cs']]; skt=[s['time'] for s in parsed['sk']]
          if cst != skt: raise SystemExit('CZ/SK times differ 1:1')

          # Duplicate guard against immediate neighbors.
          for n,paths in NEIGHBORS.items():
            for lang,path in paths.items():
              _,other=parse(path,n)
              ot=[s['time'] for s in other]
              if ot==([s['time'] for s in parsed[lang]]):
                a='\n'.join(s['title']+'\n'+'\n'.join(s['points']) for s in parsed[lang]).casefold()
                b='\n'.join(s['title']+'\n'+'\n'.join(s['points']) for s in other).casefold()
                ratio=difflib.SequenceMatcher(None,a,b).ratio()
                if ratio>0.90: raise SystemExit(f'Suspicious duplicate: {EP} vs {n} ({lang}, similarity {ratio:.3f})')

          # Production catalog cross-check.
          req=urllib.request.Request('https://raw.githubusercontent.com/Berniocal/vedator/main/episodes.json',headers={'User-Agent':'Vedator-summary-verifier/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: catalog=json.load(r)
          records=[e for e in catalog.get('episodes',[]) if int(e.get('number') or 0)==EP]
          if not records: raise SystemExit('Episode 236 missing from production episodes.json')
          if not any('steven chu' in str(e.get('title','')).casefold() for e in records): raise SystemExit('Production catalog title for 236 does not match Steven Chu')

          # JSON strings must not contain literal semicolons because the legacy reader finds the first ';'.
          payload=json.dumps(parsed,ensure_ascii=False,separators=(',',':')).replace(';','\\u003b')
          Path(f'episode-{EP}-summary.js').write_text('const DATA='+payload+';\n',encoding='utf-8')

          aug=Path('tools/augment-v2-extra-nonquestions.mjs')
          txt=aug.read_text(encoding='utf-8')
          m=re.search(r'const EXTRAS=\[([^\]]*)\];',txt)
          if not m: raise SystemExit('EXTRAS array not found')
          nums=[int(x.strip()) for x in m.group(1).split(',') if x.strip()]
          if EP not in nums: nums.append(EP)
          nums=sorted(set(nums))
          txt=txt[:m.start(1)]+','.join(map(str,nums))+txt[m.end(1):]
          aug.write_text(txt,encoding='utf-8')

          tst=Path('tools/test-content-v2.mjs')
          txt=tst.read_text(encoding='utf-8')
          m=re.search(r'for\(const n of \[([^\]]*)\]\)\{',txt)
          if not m: raise SystemExit('Nonquestion regression array not found')
          nums=[int(x.strip()) for x in m.group(1).split(',') if x.strip()]
          if EP not in nums: nums.append(EP)
          nums=sorted(set(nums))
          txt=txt[:m.start(1)]+','.join(map(str,nums))+txt[m.end(1):]
          tst.write_text(txt,encoding='utf-8')

          # Verify round-trip content exactly, including semicolons.
          src=Path(f'episode-{EP}-summary.js').read_text(encoding='utf-8')
          raw=src[len('const DATA='):-2]
          back=json.loads(raw)
          if back != parsed: raise SystemExit('Serialized episode data do not round-trip exactly')
          print('Episode 236 source checks OK:',len(parsed['cs']),'CZ +',len(parsed['sk']),'SK')
          PY

      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html

      - name: Commit target files if generated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-236-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          if git diff --cached --quiet; then
            echo 'Target files already generated and verified.'
          else
            git commit -m 'Add episode 236 summary data and V2 registration'
            git push origin HEAD:add-summary-236
          fi
