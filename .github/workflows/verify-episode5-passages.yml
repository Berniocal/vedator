name: Cross-check uncertain episode 5 speech
on:
  push:
    branches: [captions/episode-5-precise-20261116]
    paths:
      - tools/verify-episode5-passages.py
      - .github/workflows/verify-episode5-passages.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep5-audio
          key: vedator-original-episode-5-audio-v1
      - name: Install independent recognition model
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Re-recognize uncertain passages with full large-v3 model
        run: python tools/verify-episode5-passages.py
      - name: Save second recognizer evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-5-checks.sk.json
          git commit -m "Cross-check uncertain episode 5 phrases with full large-v3 ASR"
          git push origin HEAD:captions/episode-5-precise-20261116
