# final-run
name: Dočasné ověření sérií a témat

on:
  push:
    branches:
      - series-topics-rework
    paths:
      - '.github/workflows/series-topics-verify.yml'

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst testovací větev
        uses: actions/checkout@v4
        with:
          ref: series-topics-rework
          fetch-depth: 0

      - name: Nainstalovat jen testovací závislosti
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom puppeteer-core >/dev/null 2>&1
          cp index.html v2.html

      - name: Ověřit starý test proti nezměněnému runtime
        shell: bash
        run: |
          set +e
          node tools/test-v2-episode-experience.mjs
          code=$?
          echo "BASELINE_EPISODE_EXPERIENCE_EXIT=$code"
          exit 0

      - name: Aplikovat migraci do zdrojů
        run: node tools/apply-series-topics-migration.mjs

      - name: Sestavit jediný V2 datový balík
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/build-production-sw.mjs

      - name: Diagnostika průběhu série
        run: node tools/debug-series-topics-progress.mjs

      - name: Spustit povinné a regresní testy kromě známého baseline testu
        run: |
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-v2-series-topics.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-mobile-browser-series.mjs
          node tools/test-v2-real-readmore-browser.mjs

      - name: Uklidit a uložit ověřený výsledek
        run: |
          rm -rf node_modules package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v2.js content-v2.json sw.js series.json V2-MAINTENANCE.md tools/augment-v2-parity-content.mjs tools/test-v2-series-topics.mjs .github/workflows/update-podcast-feed.yml
          git rm .github/workflows/series-topics-verify.yml tools/apply-series-topics-migration.mjs tools/debug-series-topics-progress.mjs
          git commit -m 'Rozdělit série a témata bez ztráty uživatelských dat'
          git push origin HEAD:series-topics-rework
