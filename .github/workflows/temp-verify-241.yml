name: TEMP verify episode 241

on:
  push:
    branches: [add-summary-241]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-241
      - name: Build canonical episode 241 integration
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser

          EP=241
          SOURCES={
            'cs':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/241-opakujici-se-novy.html',
            'sk':'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/241-opakujuce-sa-novy.html',
          }

          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.sections=[]; self.cur=None; self.tag=None; self.buf=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='article' and a.get('data-episode')!=str(EP): raise SystemExit('Wrong episode number')
              if tag=='section' and 'faq' in a.get('class','').split():
                self.cur={'time':a.get('data-time',''),'title':'','points':[]}
              if self.cur is not None and tag in ('h2','li'):
                self.tag=tag; self.buf=[]
            def handle_data(self,data):
              if self.tag: self.buf.append(data)
            def handle_endtag(self,tag):
              if self.cur is not None and self.tag==tag:
                text=''.join(self.buf).strip()
                if tag=='h2': self.cur['title']=text
                elif tag=='li': self.cur['points'].append(text)
                self.tag=None; self.buf=[]
              if tag=='section' and self.cur is not None:
                self.sections.append(self.cur); self.cur=None

          data={}
          times=[]
          for lang,url in SOURCES.items():
            req=urllib.request.Request(url,headers={'User-Agent':'VedatorSummaryBot/1.0'})
            html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')
            if f'data-episode="{EP}"' not in html or f'podcast {EP}' not in html.lower(): raise SystemExit(f'Identity mismatch {lang}')
            p=P(); p.feed(html)
            if len(p.sections)!=10: raise SystemExit(f'Expected 10 {lang} FAQ, got {len(p.sections)}')
            if any(not s['time'] or not s['title'] or not (3<=len(s['points'])<=4) for s in p.sections): raise SystemExit(f'Invalid section {lang}')
            data[lang]=p.sections
            t=[s['time'] for s in p.sections]
            if times and t!=times: raise SystemExit('CZ/SK times differ')
            times=t

          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace(';','\\u003b')
          open(f'episode-{EP}-summary.js','w',encoding='utf-8').write('const DATA='+payload+';\n')

          path='tools/augment-v2-extra-nonquestions.mjs'
          s=open(path,encoding='utf-8').read()
          s=s.replace('const EXTRAS=[243,','const EXTRAS=[241,243,',1)
          if 'const EXTRAS=[241,243,' not in s: raise SystemExit('Could not register augment entry')
          open(path,'w',encoding='utf-8').write(s)

          path='tools/test-content-v2.mjs'
          s=open(path,encoding='utf-8').read()
          s=s.replace('for(const n of [243,','for(const n of [241,243,',1)
          if 'for(const n of [241,243,' not in s: raise SystemExit('Could not register test entry')
          open(path,'w',encoding='utf-8').write(s)
          print('Prepared episode 241 with 10+10 canonical sections')
          PY

      - name: Verify source data serialization
        run: |
          node --check episode-241-summary.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('episode-241-summary.js','utf8')+'\n;globalThis.__D=DATA;';
          const ctx={}; vm.createContext(ctx); vm.runInContext(src,ctx);
          const d=ctx.__D;
          if(d.cs.length!==10||d.sk.length!==10) throw new Error('Wrong counts');
          if(d.cs.map(x=>x.time).join('|')!==d.sk.map(x=>x.time).join('|')) throw new Error('Times differ');
          NODE

      - name: Commit integration files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-241-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          git commit -m 'Add episode 241 summary integration'
          git push origin add-summary-241

      - name: Verify V2 summary integration
        run: |
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
