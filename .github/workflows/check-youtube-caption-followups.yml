name: Verify disputed short caption passages without VAD
on:
  push:
    branches: [captions/youtube-batch-363-361-20261119]
    paths:
      - tools/check-youtube-caption-followups.py
      - .github/workflows/check-youtube-caption-followups.yml
      - captions/source/episode-36*-youtube-followup-requests.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        episode: [363, 362, 361]
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          if test -f captions/source/episode-${{ matrix.episode }}-youtube-followup-requests.json; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.present == 'true'
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        if: steps.source.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: vedator-youtube-caption-audio-models-v1
      - uses: actions/cache@v4
        if: steps.source.outputs.present == 'true'
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-${{ matrix.episode }}-v1
      - name: Install independent speech recognition
        if: steps.source.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 'numpy<2'
      - name: Compare two original-audio ASR models without speech filtering
        if: steps.source.outputs.present == 'true'
        run: python tools/check-youtube-caption-followups.py ${{ matrix.episode }}
      - name: Save independent followup evidence
        if: always() && steps.source.outputs.present == 'true'
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f captions/source/episode-${EPISODE}-youtube-followup-audio.json; then
            git add captions/source/episode-${EPISODE}-youtube-followup-audio.json
            if ! git diff --cached --quiet; then
              git commit -m "Preserve episode ${EPISODE} difficult-speech followup evidence"
              for attempt in 1 2 3 4; do
                git pull --rebase origin "${GITHUB_REF_NAME}"
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              done
              exit 1
            fi
          fi
