name: Přímé nasazení GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-direct.yml'
      - '.nojekyll'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'icons/**'
      - 'assets/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nahrát statické soubory
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000
