name: Přímé nasazení GitHub Pages

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[deploy-pages]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nahrát statické soubory
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000

      - name: Vypnout jednorázové workflow
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages-direct.yml/disable"
