name: Přímé nasazení GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sestavit aktuální shrnutí pro nasazení
        run: |
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs

      - name: Zkontrolovat aplikaci a data
        run: |
          node --check app-v2.js
          node --test tools/test-deploy-pages-from-artifact.cjs
          node tools/test-content-v2.mjs
          node tools/test-video-catalog.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-v2-series-topics.mjs

      - name: Připravit produkční PWA
        run: |
          node tools/sync-ai-ask-engine.mjs
          node tools/prepare-production-index.mjs
          node tools/build-production-sw.mjs
          node --check sw.js
          node tools/test-production-pwa.mjs

      - name: Připojit administrační opravy slibů
        run: |
          node tools/test-sliby-content-scope.cjs
          node tools/test-sliby-github-admin.cjs
          node tools/test-sliby-links.cjs
          node tools/test-sliby-guests.cjs
          node tools/patch-sliby-admin-runtime.cjs

      - name: Nahrát statické soubory
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        timeout-minutes: 13
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const deploy = require('./tools/deploy-pages-from-artifact.cjs');
            await deploy({github, context, core,
              artifactId: process.env.PAGES_ARTIFACT_ID,
              buildVersion: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim()});

      - name: Ověřit živá produkční data
        timeout-minutes: 10
        run: |
          node tools/test-live-production-verifier.mjs
          DEPLOY_CHECKOUT_SHA="$(git rev-parse HEAD)" node tools/verify-live-production.mjs
          if test -f captions/episode-364.json; then node tools/verify-episode364-production.mjs; fi

          if test -f captions/episode-10.json; then node tools/verify-caption-production.mjs 10; fi

          if test -f captions/episode-11.json; then node tools/verify-caption-production.mjs 11; fi

          if test -f captions/episode-365.json; then node tools/verify-caption-production.mjs 365; fi
