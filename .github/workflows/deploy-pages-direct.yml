name: Přímé nasazení GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 6 8 *'
  workflow_run:
    workflows: ['pages-build-deployment', 'pages build and deployment']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages-direct.yml'
      - '.nojekyll'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'icons/**'
      - 'assets/**'

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nahrát statické soubory
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000

      - name: Vypnout jednorázový plán
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages-direct.yml/disable"
