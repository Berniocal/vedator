name: Recheck episode 11 disputed speech against original audio
on:
  push:
    branches: [captions/episode-11-precise-20261121]
    paths:
      - captions/source/episode-11-review-windows.json
      - .github/workflows/verify-episode11-editorial-passages.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vedator-episode11-editorial-cross-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent full recognizer
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Wait until complete source transcript is available
        run: |
          for attempt in $(seq 1 120); do
            git pull --ff-only origin "${GITHUB_REF_NAME}"
            if test -s captions/source/episode-11-draft.sk.json; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep11-audio
          key: vedator-original-episode-11-audio-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-asr-turbo-and-large-v3-episode11-v1
      - name: Recognize disputed source-audio windows with large-v3
        run: python tools/verify-episode11-passages.py --editorial-review
      - name: Commit independent-acoustic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-11-followup-checks.sk.json
          git diff --cached --quiet && exit 0
          git commit -m "Independently recheck 19 disputed episode 11 passage windows"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
