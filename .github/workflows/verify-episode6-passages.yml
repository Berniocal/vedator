name: Cross-check uncertain episode 6 speech
on:
  push:
    branches: [captions/episode-6-precise-20261117]
    paths:
      - tools/verify-episode6-passages.py
      - .github/workflows/verify-episode6-passages.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent recognizer
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Wait for complete source transcription
        run: |
          for attempt in $(seq 1 120); do
            git pull --ff-only origin captions/episode-6-precise-20261117
            if test -f captions/source/episode-6-draft.sk.json; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep6-audio
          key: vedator-original-episode-6-audio-v1
      - name: Check speech gaps and uncertain proper names against original audio
        run: python tools/verify-episode6-passages.py
      - name: Save recognizer evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-6-checks.sk.json
          git commit -m "Cross-check episode 6 speech gaps and uncertain passages with full large-v3"
          git pull --rebase origin captions/episode-6-precise-20261117
          git push origin HEAD:captions/episode-6-precise-20261117
