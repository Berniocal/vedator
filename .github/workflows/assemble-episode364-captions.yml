name: Assemble reviewed episode 364 bilingual captions
on:
  push:
    branches: [captions/episode-364-20261119]
    paths: [.github/workflows/assemble-episode364-captions.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-364-final-models-v1
          restore-keys: |
            vedator-youtube-caption-audio-models-v1
            vedator-youtube-caption-final-models-v1
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-364-v1
      - name: Install exact acoustic alignment dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 sentencepiece 'numpy<2' num2words==0.5.14
      - name: Assemble all acoustic blocks and realign only revised text
        run: |
          python tools/test-youtube-caption-layout.py
          python tools/finalize-youtube-caption-batch.py 364 --assemble-shards 6
      - name: Preserve full alignment and caption outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode364-assembled-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            captions/episode-364.*
            captions/source/episode-364-youtube-final-alignment.json
            captions/source/episode-364-youtube-seek-index.json
      - name: Commit outputs for final provenance and reading gates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captions/source/episode-364-youtube-final-alignment.json
          for path in captions/source/episode-364-youtube-seek-index.json captions/episode-364.json captions/episode-364.edited.json captions/episode-364.review.json captions/episode-364.cs.srt captions/episode-364.sk.srt; do
            if test -f "$path"; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Assemble fully aligned episode 364 Czech and Slovak captions for publication gates'
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            done
            exit 1
          fi

# Rebuild recovered overlaps with a single monotonic acoustic path.
# Preserve original broad-context evidence alongside the difficult-speech followup.
