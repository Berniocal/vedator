name: Verify V2 summary PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'episode-*-summary.js'
      - 'episode-translations-*.js'
      - 'question-translations-*.js'
      - 'legacy-source-index.html'
      - 'app-v2.js'
      - 'index.html'
      - 'tools/test-v2-ask*.mjs'
      - 'tools/test-v2-playback-identity.mjs'
      - 'tools/test-v2-youtube-player.mjs'
      - 'episode-videos.json'
      - 'captions/**'
      - 'tools/test-v2-mathjax-*.mjs'
      - 'series.json'
      - 'tools/build-content-v2.mjs'
      - 'tools/augment-v2-extra-nonquestions.mjs'
      - 'tools/augment-v2-parity-content.mjs'
      - 'tools/build-production-sw.mjs'
      - 'tools/test-production-pwa.mjs'
      - 'tools/test-content-v2.mjs'
      - 'tools/test-v2-faq-integrity.mjs'
      - 'tools/test-v2-series-topics.mjs'
      - '.github/workflows/verify-v2-summary-pr.yml'
      - '.github/workflows/deploy-pages-direct.yml'
      - '.github/workflows/update-podcast-feed.yml'
      - 'tools/verify-live-production.mjs'
      - 'tools/test-live-production-verifier.mjs'

permissions:
  contents: read

jobs:
  youtube-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify YouTube player and edited bilingual captions
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26
          node tools/build-content-v2.mjs
          node tools/test-v2-youtube-player.mjs
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify V2 build and tests
        run: |
          node --check app-v2.js
          node --check tools/verify-live-production.mjs
          node tools/test-live-production-verifier.mjs
          for f in episode-*-summary.js; do node --check "$f"; done
          for f in episode-translations-*.js; do node --check "$f"; done
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Verify application and ask integration
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26 puppeteer-core@25.12.0
          ln -s index.html v2.html
          failures=0
          run_checked() {
            echo "::group::$*"
            if "$@"; then echo "PASS $*"; else
              echo "::error::V2 integration check failed: $*"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          }
          run_checked node tools/test-app-v2.mjs
          run_checked node tools/test-v2-ask.mjs
          run_checked node tools/sync-ai-ask-engine.mjs --check
          run_checked node tools/test-local-ai-browser.mjs
          run_checked node tools/test-v2-question-experience.mjs
          run_checked node tools/test-v2-episode-experience.mjs
          run_checked node tools/test-v2-full-parity.mjs
          run_checked node tools/test-v2-playlist-parity.mjs
          run_checked node tools/test-v2-mobile-deep-polish.mjs
          run_checked node tools/test-v2-card-player-polish.mjs
          run_checked node tools/test-v2-legacy-visual-parity.mjs
          run_checked node tools/test-v2-duplicate-142.mjs
          run_checked node tools/test-v2-playback-identity.mjs
          run_checked node tools/test-v2-youtube-player.mjs
          run_checked node tools/test-v2-episode-context-order.mjs
          run_checked node tools/test-v2-series-playback-order.mjs
          run_checked node tools/test-v2-series-topics.mjs
          run_checked node tools/test-v2-collection-filter.mjs
          run_checked node tools/test-v2-mobile-browser.mjs
          run_checked node tools/test-v2-mobile-browser-playlist.mjs
          run_checked node tools/test-v2-real-readmore-browser.mjs
          if [ "$failures" -ne 0 ]; then echo "::error::$failures V2 integration checks failed"; exit 1; fi
      - name: Verify MathJax in the browser
        run: |
          npm install --prefix "$RUNNER_TEMP/vedator-mathjax-test" --no-audit --no-fund mathjax-full@3.2.2 @sparticuz/chromium@153.0.0 puppeteer-core@25.12.0
          VEDATOR_TEST_DEPS="$RUNNER_TEMP/vedator-mathjax-test" node tools/test-v2-mathjax-browser.mjs
      - name: Verify production PWA preparation
        run: |
          node tools/prepare-production-index.mjs
          node tools/build-production-sw.mjs
          node --check sw.js
          node tools/test-production-pwa.mjs
      - name: Verify ask in prepared production PWA
        run: node tools/test-v2-ask-browser.mjs

