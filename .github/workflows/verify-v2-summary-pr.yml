name: Verify V2 summary PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'episode-*-summary.js'
      - 'episode-translations-*.js'
      - 'question-translations-*.js'
      - 'legacy-source-index.html'
      - 'app-v2.js'
      - 'index.html'
      - 'tools/test-v2-ask*.mjs'
      - 'tools/test-v2-mathjax-*.mjs'
      - 'tools/augment-v2-extra-nonquestions.mjs'
      - 'tools/test-content-v2.mjs'
      - '.github/workflows/verify-v2-summary-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify V2 build and tests
        run: |
          node --check app-v2.js
          for f in episode-*-summary.js; do node --check "$f"; done
          for f in episode-translations-*.js; do node --check "$f"; done
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
      - name: Verify application and ask integration
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund jsdom@26 puppeteer-core@25.12.0
          ln -s index.html v2.html
          node tools/test-app-v2.mjs
          node tools/test-v2-ask.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-episode-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-card-player-polish.mjs
          node tools/test-v2-legacy-visual-parity.mjs
          node tools/test-v2-duplicate-142.mjs
          node tools/test-v2-episode-context-order.mjs
          node tools/test-v2-series-topics.mjs
          node tools/test-v2-collection-filter.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
      - name: Verify MathJax in the browser
        run: |
          npm install --prefix "$RUNNER_TEMP/vedator-mathjax-test" --no-audit --no-fund mathjax-full@3.2.2 @sparticuz/chromium@153.0.0 puppeteer-core@25.12.0
          VEDATOR_TEST_DEPS="$RUNNER_TEMP/vedator-mathjax-test" node tools/test-v2-mathjax-browser.mjs
      - name: Verify production PWA preparation
        run: |
          node tools/prepare-production-index.mjs
          node tools/build-production-sw.mjs
          node --check sw.js
          node tools/test-production-pwa.mjs
      - name: Verify ask in prepared production PWA
        run: node tools/test-v2-ask-browser.mjs
