name: Independently review low-score episode 10 subtitle phrases
on:
  push:
    branches: [captions/episode-10-precise-20261118]
    paths:
      - .github/workflows/verify-episode10-low-ctc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep10-audio
          key: vedator-original-episode-10-audio-v1
      - name: Install independent full recognizer
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1
      - name: Decode disputed source audio with full large-v3
        run: |
          python - <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          from faster_whisper import WhisperModel
          from faster_whisper.audio import decode_audio
          root=Path.cwd()
          audio=Path('/tmp/vedator-ep10-audio/episode-10.mp3')
          draft=json.loads((root/'captions/source/episode-10-draft.sk.json').read_text())
          if not audio.exists():
              audio.parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['curl','--fail','--location','--retry','3',draft['source']['audio'],'-o',str(audio)],check=True)
          sha=hashlib.file_digest(audio.open('rb'),'sha256').hexdigest()
          assert sha==draft['source']['audioSha256']
          wave=decode_audio(str(audio),sampling_rate=16000)
          model=WhisperModel('large-v3',device='cpu',compute_type='int8',cpu_threads=4)
          windows=[
              (69.0,75.0,'cue 14 short reaction Fúha'),
              (380.5,388.5,'cue 85 Áno'),
              (1232.0,1241.0,'cue 285 ďalej versus ďalšie')
          ]
          passages=[]
          for a,b,reason in windows:
              segments,_=model.transcribe(wave[round(a*16000):round(b*16000)],
                  language='sk',beam_size=5,temperature=0,word_timestamps=True,
                  vad_filter=False,condition_on_previous_text=False)
              row={'start':a,'end':b,'reason':reason,
                   'segments':[{'start':round(a+s.start,3),'end':round(a+s.end,3),
                                'text':s.text.strip()} for s in segments]}
              passages.append(row)
              print(json.dumps(row,ensure_ascii=False),flush=True)
          out={'episode':10,'audioSha256':sha,'model':'large-v3',
               'status':'independent-ASR-source-audio-evidence-not-human-listening',
               'passages':passages}
          path=root/'captions/source/episode-10-low-ctc-checks.sk.json'
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Save independently corroborated short cue evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-10-low-ctc-checks.sk.json
          git commit -m "Independently verify short and low-score episode 10 cues"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
