name: Ověření výpustky odpovědí

on:
  push:
    branches:
      - fix/question-answer-ellipsis-position

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplikovat opravu
        run: python tools/tmp-fix-question-ellipsis.py

      - name: Ověřit syntaxi a otázky
        run: |
          node --check app-v2.js
          cp index.html v2.html
          npm install --no-save --no-package-lock jsdom@26 puppeteer-core@24
          node tools/test-v2-question-experience.mjs

      - name: Ověřit polohu výpustky v Chromiu
        run: node tools/tmp-test-question-ellipsis.mjs

      - name: Ověřit širší mobilní regresi
        run: node tools/test-v2-mobile-browser.mjs

      - name: Commitnout ověřenou opravu
        run: |
          rm -f v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app-v2.js index.html
          if git diff --cached --quiet; then
            echo 'Oprava už je na větvi a testy prošly.'
          else
            git commit -m 'Umístit výpustku odpovědi za poslední viditelný text'
            git push
          fi
