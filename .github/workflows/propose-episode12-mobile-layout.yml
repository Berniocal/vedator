name: Propose episode 12 balanced mobile caption lines for editorial review
on:
  push:
    branches: [captions/episode-12-precise-20261126]
    paths:
      - .github/workflows/propose-episode12-mobile-layout.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: episode12-mobile-proposals
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VEDATOR_CAPTION_AUDIO: /tmp/vedator-ep12-audio
      VEDATOR_TEST_DEPS: /tmp/episode12-layout-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep12-audio
          key: vedator-original-episode-12-audio-v1
      - name: Authenticate original MP3 and install browser
        run: |
          python tools/download-caption-reference.py --episode 12 --output /tmp/vedator-ep12-audio/episode-12.mp3
          npm install --prefix "$VEDATOR_TEST_DEPS" --no-audit --no-fund puppeteer-core@25.12.0 @sparticuz/chromium@153.0.0
      - name: Measure candidate layouts in the actual MP3 and video caption surfaces
        run: VEDATOR_LAYOUT_UNREGISTERED_FINAL=1 VEDATOR_LAYOUT_PROPOSE=1 node tools/test-episode12-mobile-layout-browser.mjs > captions/source/episode-12-layout-candidates.json
      - name: Preserve unapproved proposals
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/source/episode-12-layout-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve measured episode 12 line-break candidates for manual review"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
