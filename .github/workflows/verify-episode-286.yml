name: Verify episode 286

on:
  push:
    branches:
      - chatgpt/episode-286-summary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/episode-286-summary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Generate and verify episode 286
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=286;
          const sources={
            cs:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/286-mileniove-problemy-2-birchova-a-swinnerton-dyerova-hypoteza.html',
            sk:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/286-mileniove-problemy-2-birchova-a-swinnerton-dyerova-hypoteza.html'
          };
          async function load(lang){
            const url=sources[lang];
            const base=url.split('/').pop();
            if(!base.startsWith(`${EP}-`))throw new Error(`${lang} filename mismatch: ${base}`);
            const r=await fetch(url); if(!r.ok)throw new Error(`${lang} HTTP ${r.status}`);
            const html=await r.text(); const d=new JSDOM(html).window.document;
            const a=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent?.trim()||'';
            const h1=d.querySelector('h1')?.textContent?.trim()||'';
            if(!a||a.dataset.episode!==String(EP)||a.dataset.lang!==lang)throw new Error(`${lang} article metadata mismatch`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `))throw new Error(`${lang} title/h1 number mismatch`);
            if(!title.includes('Birch')||!title.includes('Swinnerton-Dyer')||!h1.includes('Birch')||!h1.includes('Swinnerton-Dyer'))throw new Error(`${lang} topic mismatch`);
            const sections=[...a.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim(),points:[...s.querySelectorAll('li')].map(li=>li.textContent.trim())}));
            return sections;
          }
          (async()=>{
            const cs=await load('cs'), sk=await load('sk');
            if(cs.length!==9||sk.length!==9)throw new Error(`Expected actual 9/9 sections, got ${cs.length}/${sk.length}`);
            const cst=cs.map(x=>x.time), skt=sk.map(x=>x.time);
            if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK times differ`);
            if(cs.some(x=>!x.time||!x.title||!x.points.length)||sk.some(x=>!x.time||!x.title||!x.points.length))throw new Error('Incomplete section');
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep||!ep.title.includes(` ${EP} `)||!ep.title.includes('Birch'))throw new Error(`Production catalog mismatch: ${ep?.title}`);
            const extrasText=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            const m=extrasText.match(/const EXTRAS=\[([^\]]*)\]/);
            const extras=(m?.[1]||'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            for(const n of extras){
              const p=`episode-${n}-summary.js`; if(!fs.existsSync(p))continue;
              const text=fs.readFileSync(p,'utf8'), start=text.indexOf('const DATA='), end=text.indexOf(';',start+11);
              if(start<0||end<0)continue;
              const data=JSON.parse(text.slice(start+11,end));
              const sameTimes=JSON.stringify(data.cs?.map(x=>x.time))===JSON.stringify(cst);
              const sameTitles=JSON.stringify(data.cs?.map(x=>x.title))===JSON.stringify(cs.map(x=>x.title));
              const samePoints=JSON.stringify(data.cs?.map(x=>x.points))===JSON.stringify(cs.map(x=>x.points));
              if(sameTimes&&(sameTitles||samePoints))throw new Error(`Episode ${EP} looks duplicated with existing episode ${n}`);
            }
            const json=JSON.stringify({cs,sk}).replaceAll(';','\\u003b');
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${json};\n`);
            console.log(`Verified ${EP}: 9 CZ + 9 SK; ${cst.join(', ')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Register episode 286
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const p of ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']){
            let s=fs.readFileSync(p,'utf8');
            const re=p.includes('augment')?/const EXTRAS=\[([^\]]*)\];/:/for\(const n of \[([^\]]*)\]\)\{/;
            s=s.replace(re,(_,body)=>{
              const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
              if(!a.includes(286))a.push(286); a.sort((a,b)=>a-b);
              return p.includes('augment')?`const EXTRAS=[${a.join(',')}];`:`for(const n of [${a.join(',')}]){`;
            });
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE_SIZE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER_SIZE=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER_SIZE-BEFORE_SIZE)); echo "content-v2 growth: $GROWTH bytes"; test "$GROWTH" -gt 0; test "$GROWTH" -lt 100000
          node <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('content-v2.json','utf8'));
          const e=d.nonquestions?.episodes?.['286'];
          if(!e||e.cs?.length!==9||e.sk?.length!==9)throw new Error('Episode 286 missing or wrong count');
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('286 times differ');
          if(d.nonquestions?.episodes?.['316'])throw new Error('Episode 316 unexpectedly returned');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified episode files only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-286-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only
          git commit -m 'Add bilingual summary for episode 286'
          git push
