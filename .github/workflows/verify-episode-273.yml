name: Verify episode 273

on:
  push:
    branches: [chatgpt/episode-273-summary]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/episode-273-summary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Generate and verify episode 273
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=273;
          const paths={cs:'shrnuti/cs/273-radiove-teleskopy.html',sk:'shrnuti/sk/273-radiove-teleskopy.html'};
          async function load(lang){
            const path=paths[lang];
            const base=path.split('/').pop();
            if(!base.startsWith(`${EP}-`)) throw new Error(`${lang} filename mismatch: ${base}`);
            const url=`https://raw.githubusercontent.com/Berniocal/vedator-test/main/${path}`;
            const r=await fetch(url); if(!r.ok)throw new Error(`${lang} source HTTP ${r.status}`);
            const html=await r.text(); const d=new JSDOM(html).window.document;
            const article=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent.trim()||'';
            const h1=d.querySelector('h1')?.textContent.trim()||'';
            if(!article||article.dataset.episode!==String(EP)||article.dataset.lang!==lang)throw new Error(`${lang} episode/lang mismatch`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `)||!title.includes('Rádiové teleskopy')||!h1.includes('Rádiové teleskopy'))throw new Error(`${lang} title mismatch`);
            return [...article.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim(),points:[...s.querySelectorAll('li')].map(li=>li.textContent.trim())}));
          }
          (async()=>{
            const cs=await load('cs'), sk=await load('sk');
            if(cs.length!==23||sk.length!==23)throw new Error(`Expected actual 23/23 sections, got ${cs.length}/${sk.length}`);
            if(JSON.stringify(cs.map(x=>x.time))!==JSON.stringify(sk.map(x=>x.time)))throw new Error('CZ/SK times differ');
            if(cs.some(x=>!x.time||!x.title||!x.points.length)||sk.some(x=>!x.time||!x.title||!x.points.length))throw new Error('Incomplete section');
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep||!ep.title.includes(` ${EP} `)||!ep.title.includes('Rádiové teleskopy'))throw new Error(`Production catalog mismatch: ${ep?.title}`);
            const src=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            const m=src.match(/const EXTRAS=\[([^\]]*)\]/); const extras=(m?.[1]||'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            for(const n of extras){
              const p=`episode-${n}-summary.js`; if(!fs.existsSync(p))continue;
              const t=fs.readFileSync(p,'utf8'); const a=t.indexOf('const DATA='); const b=t.indexOf(';',a+11); if(a<0||b<0)continue;
              const data=JSON.parse(t.slice(a+11,b));
              const sameTimes=JSON.stringify(data.cs?.map(x=>x.time))===JSON.stringify(cs.map(x=>x.time));
              const sameTitles=JSON.stringify(data.cs?.map(x=>x.title))===JSON.stringify(cs.map(x=>x.title));
              if(sameTimes&&sameTitles)throw new Error(`Episode ${EP} duplicates episode ${n}`);
            }
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${JSON.stringify({cs,sk}).replaceAll(';','\\u003b')};\n`);
            console.log(`Verified episode ${EP}: ${cs.length} CZ + ${sk.length} SK`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Register episode 273
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const p of ['tools/augment-v2-extra-nonquestions.mjs','tools/test-content-v2.mjs']){
            let s=fs.readFileSync(p,'utf8');
            const re=p.includes('augment')?/const EXTRAS=\[([^\]]*)\];/:/for\(const n of \[([^\]]*)\]\)\{/;
            s=s.replace(re,(_,body)=>{
              const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite); if(!a.includes(273))a.push(273); a.sort((x,y)=>x-y);
              return p.includes('augment')?`const EXTRAS=[${a.join(',')}];`:`for(const n of [${a.join(',')}]){`;
            });
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Build and verify scope
        run: |
          BEFORE=$(wc -c < content-v2.json)
          APP=$(sha256sum app-v2.js|cut -d' ' -f1); IDX=$(sha256sum index.html|cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          test "$APP" = "$(sha256sum app-v2.js|cut -d' ' -f1)"
          test "$IDX" = "$(sha256sum index.html|cut -d' ' -f1)"
          AFTER=$(wc -c < content-v2.json); G=$((AFTER-BEFORE)); echo "growth=$G"; test "$G" -gt 0; test "$G" -lt 120000
          node -e "const d=require('./content-v2.json');const e=d.nonquestions?.episodes?.['273'];if(!e||e.cs.length!==23||e.sk.length!==23)throw Error('273 missing/count mismatch');if(d.nonquestions?.episodes?.['316'])throw Error('316 returned')"
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified files only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-273-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Add bilingual summary for episode 273'
          git push
