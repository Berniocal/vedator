name: Verify episode 315

on:
  push:
    branches:
      - chatgpt/episode-315-summary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/episode-315-summary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Generate episode 315 from canonical CZ/SK sources
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=315;
          const urls={
            cs:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/315-technicke-vyzvy-santa-clausa.html',
            sk:'https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/315-technicke-vyzvy-santa-clausa.html'
          };
          async function load(lang){
            const r=await fetch(urls[lang]);
            if(!r.ok)throw new Error(`${lang} source HTTP ${r.status}`);
            const html=await r.text();
            const d=new JSDOM(html).window.document;
            const article=d.querySelector(`article.episode-summary[data-episode="${EP}"][data-lang="${lang}"]`);
            if(!article)throw new Error(`Missing ${lang} article`);
            return [...article.querySelectorAll('section.faq')].map(s=>({
              time:s.dataset.time,
              title:s.querySelector('h2')?.textContent.trim(),
              points:[...s.querySelectorAll('li')].map(li=>li.textContent.trim())
            }));
          }
          (async()=>{
            const cs=await load('cs');
            const sk=await load('sk');
            if(cs.length!==18||sk.length!==18)throw new Error(`Expected actual 18/18 sections, got ${cs.length}/${sk.length}`);
            const cst=cs.map(x=>x.time), skt=sk.map(x=>x.time);
            if(JSON.stringify(cst)!==JSON.stringify(skt))throw new Error(`CZ/SK times differ: ${cst} vs ${skt}`);
            if(cs.some(x=>!x.time||!x.title||!x.points.length)||sk.some(x=>!x.time||!x.title||!x.points.length))throw new Error('Incomplete section found');
            const json=JSON.stringify({cs,sk}).replaceAll(';','\\u003b');
            fs.writeFileSync(`episode-${EP}-summary.js`,`const DATA=${json};\n`);
            console.log(`Generated ${EP}: ${cs.length} CZ + ${sk.length} SK; times ${cst.join(', ')}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Register episode 315 and regression guard
        run: |
          node <<'NODE'
          const fs=require('fs');
          let p='tools/augment-v2-extra-nonquestions.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/const EXTRAS=\[([^\]]*)\];/,(_,body)=>{
            const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            if(!a.includes(315))a.push(315);
            a.sort((a,b)=>a-b);
            return `const EXTRAS=[${a.join(',')}];`;
          });
          fs.writeFileSync(p,s);
          p='tools/test-content-v2.mjs';
          s=fs.readFileSync(p,'utf8');
          s=s.replace(/for\(const n of \[([^\]]*)\]\)\{/,(_,body)=>{
            const a=body.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);
            if(!a.includes(315))a.push(315);
            a.sort((a,b)=>a-b);
            return `for(const n of [${a.join(',')}]){`;
          });
          fs.writeFileSync(p,s);
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE_SIZE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER_SIZE=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER_SIZE-BEFORE_SIZE))
          echo "content-v2 growth: $GROWTH bytes"
          test "$GROWTH" -gt 0
          test "$GROWTH" -lt 100000
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('content-v2.json','utf8'));
          const e=d.nonquestions?.episodes?.['315'];
          if(!e)throw new Error('Episode 315 missing in content-v2');
          if(e.cs?.length!==18||e.sk?.length!==18)throw new Error(`Unexpected 315 counts ${e.cs?.length}/${e.sk?.length}`);
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('315 CZ/SK times differ in content-v2');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified episode files only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-315-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs content-v2.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'Add bilingual summary for episode 315'
          git push
