name: TEMP verify episode 234

on:
  push:
    branches: [add-summary-234]
    paths:
      - '.github/workflows/temp-verify-234.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-234
      - name: Build canonical episode 234 data and register it
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/234-david-eicher-starmus-interview.html -o /tmp/234-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/sk/234-david-eicher-starmus-interview.html -o /tmp/234-sk.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/233-ako-vieme-ze-zem-je-gulata.html -o /tmp/233-cs.html
          curl -fsSL https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/cs/235-novacen.html -o /tmp/235-cs.html
          node <<'NODE'
          const fs=require('fs');
          function decode(s){
            return s.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).trim();
          }
          function parse(path,lang){
            const html=fs.readFileSync(path,'utf8');
            if(!html.includes('data-episode="234"'))throw new Error(`${lang}: data-episode mismatch`);
            if(!html.match(/<title>[^<]*234[^<]*David Eicher/i))throw new Error(`${lang}: title mismatch`);
            if(!html.match(/<h1>[^<]*234[^<]*David Eicher/i))throw new Error(`${lang}: h1 mismatch`);
            const out=[];
            const re=/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g;
            let m;
            while((m=re.exec(html))){
              const points=[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]));
              out.push({time:m[1],title:decode(m[2]),points});
            }
            if(out.length!==22)throw new Error(`${lang}: expected actual 22 FAQ sections, got ${out.length}`);
            if(out.some(x=>!x.time||!x.title||x.points.length<3||x.points.length>4))throw new Error(`${lang}: malformed FAQ`);
            return out;
          }
          function parseAny(path){
            const html=fs.readFileSync(path,'utf8');
            return [...html.matchAll(/<section class="faq" data-time="([^"]+)"><h2>([\s\S]*?)<\/h2><ul>([\s\S]*?)<\/ul><\/section>/g)].map(m=>({time:m[1],title:decode(m[2]),points:[...m[3].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>decode(x[1]))}));
          }
          const cs=parse('/tmp/234-cs.html','cs');
          const sk=parse('/tmp/234-sk.html','sk');
          if(cs.map(x=>x.time).join('|')!==sk.map(x=>x.time).join('|'))throw new Error('CZ/SK times differ');
          const sig=JSON.stringify(cs.map(x=>[x.time,x.title,x.points]));
          for(const p of ['/tmp/233-cs.html','/tmp/235-cs.html'])if(sig===JSON.stringify(parseAny(p).map(x=>[x.time,x.title,x.points])))throw new Error(`Suspicious exact duplicate: ${p}`);
          const payload={cs,sk};
          const json=JSON.stringify(payload).replace(/;/g,'\\u003b');
          fs.writeFileSync('episode-234-summary.js',`const DATA=${json};\n`);
          const roundtrip=JSON.parse(fs.readFileSync('episode-234-summary.js','utf8').slice('const DATA='.length,-2));
          if(JSON.stringify(roundtrip)!==JSON.stringify(payload))throw new Error('Serialized content differs after roundtrip');
          let a=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
          if(!a.includes('const EXTRAS=['))throw new Error('EXTRAS marker missing');
          if(!/const EXTRAS=\[[^\]]*235/.test(a))throw new Error('Unexpected EXTRAS layout');
          if(!/const EXTRAS=\[[^\]]*234/.test(a))a=a.replace('const EXTRAS=[235,','const EXTRAS=[234,235,');
          fs.writeFileSync('tools/augment-v2-extra-nonquestions.mjs',a);
          let t=fs.readFileSync('tools/test-content-v2.mjs','utf8');
          const marker='for(const n of [235,';
          if(!t.includes(marker))throw new Error('nonquestion test marker missing');
          t=t.replace(marker,'for(const n of [234,235,');
          fs.writeFileSync('tools/test-content-v2.mjs',t);
          NODE
          node --check episode-234-summary.js
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/build-production-sw.mjs
          git diff --exit-code -- app-v2.js index.html
          git status --short
      - name: Commit verified target files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episode-234-summary.js tools/augment-v2-extra-nonquestions.mjs tools/test-content-v2.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Add episode 234 summary data and V2 registration'
          git push origin HEAD:add-summary-234
