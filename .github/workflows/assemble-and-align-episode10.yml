name: Build and acoustically audit episode 10 subtitle candidate
on:
  push:
    branches: [captions/episode-10-precise-20261118]
    paths:
      - .github/workflows/assemble-and-align-episode10.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vedator-episode10-candidate-alignment
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VEDATOR_EP10_AUDIO: /tmp/vedator-ep10-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-ep10-audio
          key: vedator-original-episode-10-audio-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-asr-turbo-and-slovak-ctc-v2
      - name: Read Czech translation and independent acoustic checks from branch
        run: |
          for attempt in $(seq 1 200); do
            git pull --ff-only origin "${GITHUB_REF_NAME}"
            if test -s captions/source/episode-10-translation-draft.cs.json; then break; fi
            sleep 15
          done
          test -s captions/source/episode-10-translation-draft.cs.json
          test -s captions/source/episode-10-editorial-patches.json
          test -s captions/source/episode-10-cs-editorial-patches.json
          test -s captions/source/episode-10-extra-checks.sk.json
      - name: Assemble complete editorially translated bilingual subtitle draft
        run: python tools/assemble-episode10-edited.py
      - name: Install acoustic alignment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check transformers==4.45.2 'numpy<2'
      - name: CTC align full source MP3 to Slovak text and synchronized Czech captions
        run: python tools/rebuild-episode10-captions.py align
      - name: Save acoustic audit and candidate for editorial review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captions/episode-10* captions/source/episode-10-ctc-checks.sk.json captions/source/episode-10-alignment.json episode-videos.json audio-seek-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Acoustically align episode 10 bilingual draft for final editorial QA"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Audit all timing, CTC scores, source words, SRT pairs and MP3 seek anchors
        run: python tools/validate-episode10-captions.py --audio /tmp/vedator-ep10-audio/episode-10.mp3
      - name: Check production app and service worker
        run: |
          node tools/build-content-v2.mjs
          node --check app-v2.js
          node tools/prepare-production-index.mjs
          node tools/build-production-sw.mjs
          node --check sw.js
          node tools/test-production-pwa.mjs
