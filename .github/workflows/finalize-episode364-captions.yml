name: Finish episode 364 acoustic captions
on:
  push:
    branches: [captions/episode-364-20261119]
    paths: [.github/workflows/finalize-episode364-captions.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finish-episode364-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acoustic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        part: [align-0, align-1, align-2, align-3, align-4, align-5, followup-0, followup-1, followup-2]
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-364-final-models-v1
          restore-keys: |
            vedator-youtube-caption-audio-models-v1
            vedator-youtube-caption-final-models-v1
            vedator-youtube-caption-draft-models-v1
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-364-v1
      - name: Install acoustic dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 transformers==4.45.2 sentencepiece 'numpy<2' num2words==0.5.14
      - name: Align disjoint complete utterance blocks or inspect disputed speech
        run: |
          index=${PART##*-}
          if [[ "$PART" == align-* ]]; then
            python tools/finalize-youtube-caption-batch.py 364 --shard-index "$index" --shard-count 6
          else
            python tools/check-youtube-caption-followups.py 364 --shard-index "$index" --shard-count 3
            if test "$index" = 0; then python tools/check-youtube-caption-contrasts.py 364; fi
          fi
      - name: Preserve every acoustic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode364-${{ matrix.part }}
          retention-days: 7
          if-no-files-found: error
          path: |
            captions/source/episode-364-youtube-final-alignment-shard-*.json
            captions/source/episode-364-youtube-followup-audio-shard-*.json
            captions/source/episode-364-youtube-contrast-audio.json
  collect:
    needs: acoustic
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}'}
      - uses: actions/download-artifact@v4
        with:
          pattern: episode364-*
          path: captions/source
          merge-multiple: true
      - name: Join independent difficult-speech evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('captions/source');parts=sorted(root.glob('episode-364-youtube-followup-audio-shard-*.json'))
          if len(parts)==3:
              data=json.loads(parts[0].read_text());data['passages']=[]
              for p in parts:
                  part=json.loads(p.read_text());assert part['audioSha256']==data['audioSha256'];data['passages']+=part['passages']
              data['passages'].sort(key=lambda p:(p['start'],p['model']))
              (root/'episode-364-youtube-followup-audio.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit checkpoints for final editorial decisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captions/source/episode-364-youtube-*alignment-shard-*.json captions/source/episode-364-youtube-*audio*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve episode 364 final acoustic blocks and independent difficult-speech evidence'
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            done
            exit 1
          fi
