name: Verify and repair caption helper video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-caption-wake-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Vedator
        uses: actions/checkout@v4
      - name: Generate muted H264 Baseline loop
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=black:s=16x16:r=12" -t 2 -an -c:v libx264 -profile:v baseline -level 3.0 -preset veryfast -crf 30 -pix_fmt yuv420p -movflags +faststart -y wake-loop.mp4
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          file=Path("wake-loop.mp4")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_name,width,height,profile","-of","json",str(file)]))
          video=info["streams"][0]
          assert video["codec_name"]=="h264"
          assert video["width"]==16 and video["height"]==16
          assert 1.9 <= float(info["format"]["duration"]) <= 2.1
          assert file.stat().st_size > 1000
          print("Verified short looping MP4:",info)
          PY
      - name: Commit verified helper video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- wake-loop.mp4
          if git diff --cached --quiet; then
            echo "Video is already identical."
          else
            git commit -m "Repair and verify 2 second H264 caption wake video"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
