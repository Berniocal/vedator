name: Validate episode 8 captions before release
on:
  push:
    branches: [captions/episode-8-precise-20261117]
    paths:
      - 'captions/episode-8.json'
      - 'captions/episode-8.cs.srt'
      - 'captions/episode-8.sk.srt'
      - 'captions/episode-8.review.json'
      - 'captions/source/episode-8-alignment.json'
      - 'audio-seek-index.json'
      - 'episode-videos.json'
  pull_request:
    branches: [main]
    paths:
      - 'captions/episode-8*'
      - 'captions/source/episode-8*'
      - tools/validate-episode8-captions.py
      - episode-videos.json
      - audio-seek-index.json
      - .github/workflows/validate-episode8-captions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure reviewed bilingual subtitle files exist
        run: |
          test -s captions/episode-8.json
          test -s captions/episode-8.edited.json
          test -s captions/episode-8.cs.srt
          test -s captions/episode-8.sk.srt
          test -s captions/episode-8.review.json
          test -s captions/source/episode-8-draft.sk.json
          test -s captions/source/episode-8-alignment.json
      - name: Download and authenticate original episode 8 MP3
        run: |
          mkdir -p "$RUNNER_TEMP/caption-ep8-audio"
          python - <<'PY'
          import json, subprocess, os
          src = json.load(open('captions/episode-8.json'))['source']
          subprocess.run(['curl','--fail','--location','--retry','3','--max-time','180',
                          src['audio'],'-o',os.environ['RUNNER_TEMP']+'/caption-ep8-audio/episode-8.mp3'], check=True)
          PY
      - name: Verify all source hashes, words, timings, CTC scores, SRTs and seek index
        run: python tools/validate-episode8-captions.py --audio "$RUNNER_TEMP/caption-ep8-audio/episode-8.mp3"
      - name: Rebuild content and check application scripts
        run: |
          node tools/build-content-v2.mjs
          node --check app-v2.js
      - name: Verify production cache build
        run: |
          node tools/prepare-production-index.mjs
          node tools/build-production-sw.mjs
          node --check sw.js
          node tools/test-production-pwa.mjs
