name: Verify episode 262

on:
  push:
    branches:
      - add-summary-262-retry

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-262-retry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Verify canonical source and normalize safe serialization
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=262;
          const path='262-crevny-mikrobiom.html';
          async function load(lang){
            const r=await fetch(`https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/${lang}/${path}`);
            if(!r.ok)throw new Error(`${lang} source HTTP ${r.status}`);
            const d=new JSDOM(await r.text()).window.document;
            const a=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent||'', h1=d.querySelector('h1')?.textContent||'';
            if(!path.startsWith(`${EP}-`)||a?.dataset.episode!==String(EP)||a?.dataset.lang!==lang)throw new Error(`${lang} identity mismatch`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `)||!title.includes('Črevný mikrobióm')||!h1.includes('Črevný mikrobióm'))throw new Error(`${lang} title mismatch`);
            return [...d.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim(),points:[...s.querySelectorAll('li')].map(x=>x.textContent.trim())}));
          }
          (async()=>{
            const cs=await load('cs'), sk=await load('sk');
            if(cs.length!==23||sk.length!==23)throw new Error(`Expected 23/23, got ${cs.length}/${sk.length}`);
            if(JSON.stringify(cs.map(x=>x.time))!==JSON.stringify(sk.map(x=>x.time)))throw new Error('CZ/SK times differ');
            const current=fs.readFileSync('episode-262-summary.js','utf8');
            const m=current.match(/^const DATA=(.*);\s*$/s); if(!m)throw new Error('DATA parse failed');
            const existing=JSON.parse(m[1]);
            if(JSON.stringify(existing.cs)!==JSON.stringify(cs)||JSON.stringify(existing.sk)!==JSON.stringify(sk))throw new Error('Stored DATA differs from canonical HTML');
            fs.writeFileSync('episode-262-summary.js',`const DATA=${JSON.stringify(existing).replaceAll(';','\\u003b')};\n`);
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep||!ep.title.includes(` ${EP} `)||!ep.title.includes('Črevný mikrobióm'))throw new Error(`Catalog mismatch: ${ep?.title}`);
            console.log(`Verified ${EP}: ${cs.length} CZ + ${sk.length} SK; safe serialization normalized`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Check duplicate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const parse=f=>JSON.parse(fs.readFileSync(f,'utf8').match(/^const DATA=(.*);\s*$/s)[1]);
          const data=parse('episode-262-summary.js'), times=JSON.stringify(data.cs.map(x=>x.time)), titles=JSON.stringify(data.cs.map(x=>x.title));
          for(const f of fs.readdirSync('.').filter(f=>/^episode-\d+-summary\.js$/.test(f)&&f!=='episode-262-summary.js')){
            const d=parse(f);
            if(JSON.stringify(d.cs?.map(x=>x.time))===times&&JSON.stringify(d.cs?.map(x=>x.title))===titles)throw new Error(`Duplicate with ${f}`);
          }
          console.log('No exact time+title duplicate found');
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE_SIZE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER_SIZE=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER_SIZE-BEFORE_SIZE)); echo "content-v2 growth: $GROWTH bytes"; test "$GROWTH" -gt 0; test "$GROWTH" -lt 150000
          node <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('content-v2.json','utf8')), e=d.nonquestions?.episodes?.['262'];
          if(!e||e.cs?.length!==23||e.sk?.length!==23)throw new Error('262 missing or count mismatch');
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('262 times differ');
          if(d.nonquestions?.episodes?.['316'])throw new Error('316 unexpectedly present');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit verified episode files
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- episode-262-summary.js content-v2.json
          NAMES=$(git diff --cached --name-only)
          echo "$NAMES"
          echo "$NAMES" | grep -qx 'content-v2.json'
          echo "$NAMES" | grep -qx 'episode-262-summary.js'
          test "$(echo "$NAMES" | wc -l)" -eq 2
          git commit -m 'Finalize bilingual summary for episode 262'
          git push
