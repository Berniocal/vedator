name: Verify episode 262

on:
  push:
    branches:
      - add-summary-262-retry

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-summary-262-retry
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save jsdom@26 puppeteer-core@24
      - name: Verify source identity and bilingual structure
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const EP=262;
          const paths={cs:'262-crevny-mikrobiom.html',sk:'262-crevny-mikrobiom.html'};
          async function source(lang){
            const url=`https://raw.githubusercontent.com/Berniocal/vedator-test/main/shrnuti/${lang}/${paths[lang]}`;
            const r=await fetch(url); if(!r.ok)throw new Error(`${lang} HTTP ${r.status}`);
            const html=await r.text(); const d=new JSDOM(html).window.document;
            const article=d.querySelector('article.episode-summary');
            const title=d.querySelector('title')?.textContent||''; const h1=d.querySelector('h1')?.textContent||'';
            if(!paths[lang].startsWith(`${EP}-`))throw new Error(`${lang} filename mismatch`);
            if(article?.dataset.episode!==String(EP))throw new Error(`${lang} data-episode mismatch`);
            if(article?.dataset.lang!==lang)throw new Error(`${lang} lang mismatch`);
            if(!title.includes(` ${EP} `)||!h1.includes(` ${EP} `)||!title.includes('Črevný mikrobióm')||!h1.includes('Črevný mikrobióm'))throw new Error(`${lang} title/h1 mismatch`);
            return [...d.querySelectorAll('section.faq')].map(s=>({time:s.dataset.time,title:s.querySelector('h2')?.textContent.trim(),points:[...s.querySelectorAll('li')].map(x=>x.textContent.trim())}));
          }
          (async()=>{
            const cs=await source('cs'), sk=await source('sk');
            if(cs.length!==23||sk.length!==23)throw new Error(`Expected 23/23 sections, got ${cs.length}/${sk.length}`);
            if(JSON.stringify(cs.map(x=>x.time))!==JSON.stringify(sk.map(x=>x.time)))throw new Error('CZ/SK times differ');
            const text=fs.readFileSync('episode-262-summary.js','utf8');
            const m=text.match(/^const DATA=(.*);\s*$/s); if(!m)throw new Error('DATA parse failed');
            const data=JSON.parse(m[1]);
            if(JSON.stringify(data.cs)!==JSON.stringify(cs)||JSON.stringify(data.sk)!==JSON.stringify(sk))throw new Error('Stored DATA differs from canonical HTML');
            const catalog=JSON.parse(fs.readFileSync('episodes.json','utf8'));
            const ep=catalog.episodes.find(e=>Number(e.number)===EP);
            if(!ep||!ep.title.includes(` ${EP} `)||!ep.title.includes('Črevný mikrobióm'))throw new Error(`Production catalog mismatch: ${ep?.title}`);
            const aug=fs.readFileSync('tools/augment-v2-extra-nonquestions.mjs','utf8');
            if(!/const EXTRAS=\[[^\]]*\b262\b/.test(aug))throw new Error('262 not registered in EXTRAS');
            console.log(`Verified ${EP}: ${cs.length} CZ + ${sk.length} SK, canonical content exact`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Check for obvious duplicate among existing summaries
        run: |
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('episode-262-summary.js','utf8');
          const data=JSON.parse(text.match(/^const DATA=(.*);\s*$/s)[1]);
          const times=JSON.stringify(data.cs.map(x=>x.time));
          const titles=JSON.stringify(data.cs.map(x=>x.title));
          for(const f of fs.readdirSync('.').filter(f=>/^episode-\d+-summary\.js$/.test(f)&&f!=='episode-262-summary.js')){
            const t=fs.readFileSync(f,'utf8'); const m=t.match(/^const DATA=(.*);\s*$/s); if(!m)continue;
            const d=JSON.parse(m[1]);
            if(JSON.stringify(d.cs?.map(x=>x.time))===times && JSON.stringify(d.cs?.map(x=>x.title))===titles)throw new Error(`Obvious duplicate: ${f}`);
          }
          console.log('No exact time+title duplicate found');
          NODE
      - name: Build V2 and verify scope
        run: |
          BEFORE_SIZE=$(git show HEAD:content-v2.json | wc -c)
          APP_SHA=$(sha256sum app-v2.js | cut -d' ' -f1)
          INDEX_SHA=$(sha256sum index.html | cut -d' ' -f1)
          node --check app-v2.js
          node tools/build-content-v2.mjs
          node tools/augment-v2-extra-nonquestions.mjs
          node tools/augment-v2-episode-descriptions.mjs
          node tools/augment-v2-full-descriptions.mjs
          node tools/augment-v2-parity-content.mjs
          AFTER_SIZE=$(wc -c < content-v2.json)
          test "$APP_SHA" = "$(sha256sum app-v2.js | cut -d' ' -f1)"
          test "$INDEX_SHA" = "$(sha256sum index.html | cut -d' ' -f1)"
          GROWTH=$((AFTER_SIZE-BEFORE_SIZE)); echo "content-v2 growth: $GROWTH bytes"; test "$GROWTH" -gt 0; test "$GROWTH" -lt 150000
          node <<'NODE'
          const d=JSON.parse(require('fs').readFileSync('content-v2.json','utf8'));
          const e=d.nonquestions?.episodes?.['262']; if(!e)throw new Error('262 missing from content-v2');
          if(e.cs?.length!==23||e.sk?.length!==23)throw new Error(`Unexpected 262 counts ${e.cs?.length}/${e.sk?.length}`);
          if(JSON.stringify(e.cs.map(x=>x.time))!==JSON.stringify(e.sk.map(x=>x.time)))throw new Error('262 times differ in content-v2');
          if(d.nonquestions?.episodes?.['316'])throw new Error('Episode 316 unexpectedly returned');
          NODE
      - name: Run relevant V2 tests
        run: |
          cp index.html v2.html
          node tools/test-content-v2.mjs
          node tools/test-v2-faq-integrity.mjs
          node tools/test-app-v2.mjs
          node tools/test-v2-question-experience.mjs
          node tools/test-v2-full-parity.mjs
          node tools/test-v2-playlist-parity.mjs
          node tools/test-v2-mobile-deep-polish.mjs
          node tools/test-v2-mobile-browser.mjs
          node tools/test-v2-mobile-browser-playlist.mjs
          node tools/test-v2-real-readmore-browser.mjs
          rm -f v2.html
      - name: Commit rebuilt content only
        run: |
          rm -f package.json package-lock.json v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content-v2.json
          test "$(git diff --cached --name-only)" = "content-v2.json"
          git commit -m 'Rebuild V2 content for episode 262'
          git push
