name: Prepare episode 364 captions (review required)
on:
  push:
    branches: [captions/episode-364-20261119]
    paths:
      - tools/prepare-youtube-caption-batch.py
      - tools/test-youtube-caption-batch.py
      - .github/workflows/prepare-episode364-captions.yml
      - .github/workflows/prepare-youtube-caption-batch.yml
      - captions/source/episode-36*-youtube-original.sk.srt
      - captions/source/youtube-episode-364-manifest.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-caption-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        episode: [364]
    env:
      VEDATOR_BATCH_AUDIO: /tmp/vedator-youtube-batch-audio
      VEDATOR_YOUTUBE_MANIFEST: youtube-episode-364-manifest.json
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vedator-youtube-caption-draft-models-v1
          restore-keys: |
            vedator-asr-turbo-and-slovak-ctc-v2
      - uses: actions/cache@v4
        with:
          path: /tmp/vedator-youtube-batch-audio
          key: vedator-caption-batch-audio-${{ matrix.episode }}-v1
      - name: Validate source normalization and prepare catalog
        run: |
          python tools/test-youtube-caption-batch.py
          node tools/build-content-v2.mjs
      - name: Install acoustic check and draft translation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install --disable-pip-version-check faster-whisper==1.2.1 transformers==4.45.2 sentencepiece 'numpy<2'
      - name: Check seven MP3 anchors and prepare bilingual editorial draft
        run: python tools/prepare-youtube-caption-batch.py ${{ matrix.episode }}
      - name: Preserve auditable drafts on preparation branch
        if: always()
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captions/source/episode-${EPISODE}-youtube-*.json
          git restore content-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare episode ${EPISODE} YouTube caption draft and MP3 clock probes"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            done
            exit 1
          fi
